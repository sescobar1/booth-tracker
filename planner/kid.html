<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Planner</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f4ef">
  <!-- The family pages' own icon: a white calendar on bright pink -->
  <link rel="icon" href="family-icon.svg" type="image/svg+xml">
  <link rel="icon" href="family-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="family-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Family">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Patrick+Hand&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root { --bg: #f7f4ef; --card: #fff; --ink: #2b2522; --muted: #8e837b; --line: #e6dfd7; --sage: #7d9b76; --sage-soft: #e7efe4; --accent: #2b2522; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1a18; --card: #2a2623; --ink: #f2ede8; --muted: #a99f97; --line: #3b3531; --sage: #93b28b; --sage-soft: #2f3a2c; --accent: #f2ede8; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    main { max-width: 600px; margin: 0 auto; padding: 18px 16px 60px; }
    h1 { font-size: 1.7rem; margin: 6px 0 2px; }
    .sub { color: var(--muted); margin: 0 0 14px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .tabs button { font: inherit; font-weight: 600; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .tabs button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin: 12px 0; }
    h2 { font-size: .95rem; margin: 2px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
    input, textarea, select { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 500; }
    .check input { width: 20px; height: 20px; }
    .go { width: 100%; margin-top: 14px; background: var(--accent); color: var(--bg); border: 0; border-radius: 999px; padding: 14px; font: inherit; font-weight: 700; }
    .go:disabled { opacity: .5; }
    .row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; }
    .row b { flex: none; min-width: 92px; font-weight: 600; color: var(--muted); font-size: 14px; padding-top: 1px; }
    .muted { color: var(--muted); }
    .ok { background: var(--sage-soft); border-color: var(--sage); }
    .hs { background: var(--sage-soft); border-color: var(--sage); }
    .hs h2 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 1.05rem; }
    .hs ol { margin: 6px 0 4px; padding-left: 1.3em; }
    .hs li { margin: 6px 0; }
    .hsdone { margin: 10px 0 2px; padding: 10px 12px; background: var(--card); border-radius: 14px; font-weight: 600; cursor: pointer; }
    .hsdone input { accent-color: var(--sage); }
    .hs .x { float: right; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; }
    .ico { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; background: var(--card); font-size: 15px; }
    .rem { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-weight: 500; }
    .rem:first-of-type { border-top: 0; }
    .rem input { width: 26px; height: 26px; flex: none; accent-color: var(--sage); margin: 0; }
    .rem span { flex: 1; }
    .rem small { color: var(--muted); font-weight: 600; }
    .rem.done span { text-decoration: line-through; color: var(--muted); }
    .rem .link { border: 0; background: none; font-size: 1rem; padding: 2px 4px; text-decoration: none; }
    .link { border: 0; background: none; color: var(--ink); font: inherit; text-decoration: underline; padding: 6px 0; cursor: pointer; }
    .link.danger { color: #b0473a; }
    .addrem { display: block; margin-top: 6px; font-weight: 600; text-decoration: none; }
    .remform { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 8px; }
    .remform .two { align-items: center; }
    .remform .go { margin: 0; padding: 11px; }
    .remrow { display: flex; gap: 16px; }
    .addcal { display: block; text-align: center; text-decoration: none; margin-top: 10px; background: var(--sage); color: #fff; border-radius: 999px; padding: 12px; font-weight: 700; }
    .bday { text-align: center; background: linear-gradient(135deg, #ffe3ec, #fff3c9 55%, #dff3ff); border: 0; color: #4a2a35; position: relative; overflow: hidden; }
    .bday h2 { color: #b23a6b; text-transform: none; letter-spacing: 0; font-size: 1.5rem; margin: 4px 0; }
    .bday p { margin: 4px 0; }
    .bday .big { font-size: 3rem; line-height: 1.1; }
    .bday.other { background: linear-gradient(135deg, #f3e9ff, #fff3c9); }
    .bday.other h2 { font-size: 1.15rem; }
    .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
    .ping { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .ping:first-of-type { border-top: 0; }
    .ping b { flex: none; min-width: 92px; color: var(--muted); font-size: 14px; }
    .msg { text-align: center; padding: 40px 10px; }
    .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .calhead b { font-size: 1.1rem; }
    .calhead button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; width: 40px; height: 40px; font: inherit; font-size: 1.2rem; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
    .grid .wd { font-size: 12px; color: var(--muted); font-weight: 600; padding: 2px 0 4px; }
    .grid button { position: relative; aspect-ratio: 1 / 1.05; border: 1px solid transparent; border-radius: 12px; background: none; color: var(--ink); font: inherit; font-size: 15px; padding: 4px 0 0; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .grid button.out { visibility: hidden; }
    .grid button.today { border-color: var(--ink); font-weight: 700; }
    .grid button.sel { background: var(--accent); color: var(--bg); }
    .grid button.per { background: #f7c6d6; color: #5a1f35; }
    .grid button.per.sel { background: #c94f7c; color: #fff; }
    .grid button.pred { border: 2px dashed #e58fb0; }
    .dots { display: flex; gap: 2px; height: 6px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--sage); }
    .grid button.sel .dots i { background: var(--bg); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .legend span::before { content: ''; display: inline-block; width: 11px; height: 11px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
    .legend .l-ev::before { background: var(--sage); border-radius: 50%; }
    .legend .l-per::before { background: #f7c6d6; }
    .legend .l-pred::before { border: 2px dashed #e58fb0; width: 9px; height: 9px; }
    .dayp h3 { margin: 12px 0 4px; font-size: 1rem; }
    .pbtn { margin-top: 10px; width: 100%; border: 2px solid #e58fb0; background: none; color: inherit; border-radius: 999px; padding: 11px; font: inherit; font-weight: 700; }
    .pbtn.on { background: #f7c6d6; color: #5a1f35; border-color: #f7c6d6; }
    .pbig { display: block; width: 100%; margin-top: 12px; border: 0; border-radius: 999px; padding: 15px; font: inherit; font-weight: 700; font-size: 1.05rem; background: #e0648f; color: #fff; }
    .pbig.end { background: var(--sage); }
    .pcard .link { color: inherit; }
    .pcard { background: #fff0f5; border-color: #f7c6d6; color: #5a1f35; }
    .pcard h2 { color: #b23a6b; }
    @media (prefers-color-scheme: dark) { .pcard { background: #3a2530; border-color: #6b3a52; color: #f7d9e4; } .pcard h2 { color: #f2a6c3; } .grid button.per { background: #7a3554; color: #fff; } }
    #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--accent); color: var(--bg); padding: 11px 18px; border-radius: 14px; max-width: 90%; text-align: center; }
    /* The same look as Shaana's planner: soft taupe, blush and cream boxes, sage leaves, a tall hand-lettered title,
       handwritten labels and very round cards. */
    :root { --taupe: #cdbdb0; --blush: #dccbc1; --cream: #ece8e2; --sage-deep: #6f8f66; --radius: 26px; --shadow: 0 1px 2px rgba(43, 37, 34, .04), 0 6px 18px rgba(43, 37, 34, .05); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --taupe: #4a3f38; --blush: #4b3c37; --cream: #34302c; --shadow: none; } }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; -webkit-font-smoothing: antialiased; }
    main { padding-top: 10px; }
    .hello { position: relative; padding: 4px 2px 6px; }
    .vine { display: block; width: 210px; height: 36px; margin: 0 0 0 -6px; }
    .hello .eyebrow { display: block; font-family: 'Patrick Hand', 'Comic Sans MS', cursive; font-size: 1.25rem; color: var(--sage); }
    h1, .hello h1 { font-family: 'Amatic SC', 'Arial Narrow', sans-serif; font-weight: 700; letter-spacing: 1px; font-size: 2.9rem; line-height: 1; margin: 4px 0 6px; }
    .sub { font-size: .95rem; }
    .card { border: 0; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
    h2, .card h2, .hs h2, .pcard h2 { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; font-weight: 400; text-transform: none; letter-spacing: .3px; font-size: 1.4rem; color: var(--ink); margin: 0 0 8px; }
    .bday h2 { font-family: 'Amatic SC', sans-serif; font-weight: 700; font-size: 2.2rem; letter-spacing: 1px; }
    .tabs { background: var(--cream); padding: 5px; border-radius: 999px; gap: 4px; }
    .tabs button { border: 0; border-radius: 999px; background: transparent; font-family: 'Patrick Hand', cursive; font-size: 1.15rem; font-weight: 400; padding: 10px; }
    .tabs button.on { background: var(--ink); color: var(--bg); }
    .tabs.three { grid-template-columns: 1fr 1fr 1.2fr; }
    .tabs.three button { font-size: 1.02rem; padding: 10px 4px; }
    .todo .from { color: var(--muted); font-weight: 400; font-size: 13px; }
    .todo select { margin-bottom: 2px; }
    .asked { font-size: 15px; padding: 3px 0; }
    .asked.done { color: var(--muted); text-decoration: line-through; }
    .go.small { margin: 0; padding: 11px; }
    .cheer { background: var(--cream); text-align: center; padding: 18px 20px; }
    .cheer h2 { color: var(--sage-deep); font-size: 1.25rem; margin-bottom: 6px; }
    .cheer .q { font-family: 'Patrick Hand', cursive; font-size: 1.35rem; line-height: 1.35; margin: 0; color: var(--ink); }
    .cheer .who { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
    .dstat { display: inline-block; margin-top: 4px; font-size: 14px; color: var(--muted); }
    .dstat.yes { color: var(--sage-deep); font-weight: 600; }
    #df { background: var(--card); }
    .hs { background: var(--sage-soft); }
    .row b, .ping b { font-family: 'Patrick Hand', cursive; font-weight: 400; font-size: 1rem; color: var(--ink-2, var(--muted)); }
    .go { background: var(--ink); color: var(--bg); }
    .addcal { background: var(--sage); }
    input, textarea, select { border-radius: 14px; border-color: var(--line); }
    label { font-family: 'Patrick Hand', cursive; font-weight: 400; font-size: 1.02rem; color: var(--ink); }
    .rem span { font-weight: 500; }
    /* boxes in the planner's colors */
    #cal { background: var(--card); }
    .calhead b { font-family: 'Amatic SC', sans-serif; font-weight: 700; font-size: 2rem; letter-spacing: 1px; }
    .calhead button { border: 0; background: var(--cream); }
    .grid .wd { font-family: 'Patrick Hand', cursive; font-size: .95rem; font-weight: 400; }
    .grid button { border-radius: 16px; }
    .grid button.today { border-color: var(--sage); color: var(--sage-deep); }
    .grid button.sel { background: var(--taupe); color: var(--ink); }
    .grid button.sel .dots i { background: var(--sage-deep); }
    .dayp h3 { font-family: 'Patrick Hand', cursive; font-weight: 400; font-size: 1.2rem; }
    .pcard { background: #f6e4e1; color: #4a2e2c; }
    .pcard h2 { color: #4a2e2c; }
    .pcard.warn { background: var(--blush); }
    .pcard h3 { font-family: 'Patrick Hand', cursive; font-weight: 400; font-size: 1.25rem !important; }
    [data-pl-edit][aria-label] { text-decoration: none; }
    .pbig { background: #d98a95; }
    .pbig.end { background: var(--sage); }
    .ok { background: var(--sage-soft); border: 0; }
    #up { background: var(--cream); }
    #f { background: var(--card); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pcard { background: #3a2a2b; color: #f3dcdc; } :root:not([data-theme="light"]) .pcard h2 { color: #f3dcdc; } }
  </style>
</head>
<body>
<main id="app"><p class="msg">Loading…</p></main>
<div id="toast" hidden></div>
<script src="config.js"></script>
<script>
(() => {
  // A link for Eli or Cece: they can add events and shopping items, but can't change or delete anything.
  const CFG = window.PLANNER_CONFIG, P = CFG.sync, token = new URLSearchParams(location.search).get('t') || '';
  const $ = id => document.getElementById(id), app = $('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const call = async (path, body) => {
    const r = await fetch(P.url + path, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: P.key, Authorization: 'Bearer ' + P.key }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error((j && (j.message || j.error)) || 'Something went wrong');
    return j;
  };
  const rpc = (fn, body) => call('/rest/v1/rpc/' + fn, body);
  function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
  const pad = n => String(n).padStart(2, '0'), iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = iso(new Date());
  const niceDate = d => new Date(d + 'T12:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const niceTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h < 12 ? 'am' : 'pm'); };
  const AISLES = [
    ['Produce', /lettuce|tomato|onion|garlic|pepper|potato|carrot|celery|banana|apple|berr|grape|lemon|lime|avocado|cilantro|spinach|broccoli|corn|cucumber|fruit|vegetable|salad|mushroom|zucchini|green bean|orange|herb|parsley|jalape/i],
    ['Meat & seafood', /beef|chicken|pork|turkey|sausage|bacon|ham|steak|shrimp|fish|salmon|tuna|ground|hot dog|pepperoni|meat/i],
    ['Dairy & eggs', /milk|cheese|butter|egg|yogurt|cream|sour cream|half.and.half|creamer/i],
    ['Bakery & bread', /bread|bun|tortilla|roll|bagel|muffin|biscuit|croissant|pita/i],
    ['Frozen', /frozen|ice cream|pizza|fries|tater|waffle/i],
    ['Pantry', /rice|pasta|spaghetti|noodle|sauce|bean|soup|broth|stock|flour|sugar|oil|vinegar|spice|seasoning|salt|pepper|cereal|oat|peanut butter|jelly|syrup|can|taco shell|chip|cracker|ketchup|mustard|mayo|dressing|honey|pancake mix|salsa|cookie|snack|granola/i],
    ['Drinks', /water|soda|juice|coffee|tea|gatorade|drink/i],
    ['Household', /paper|towel|toilet|soap|detergent|trash|foil|wrap|bag|dish|cleaner|wipes|shampoo|toothpaste|diaper|napkin|plate|cup/i]
  ];
  // Canned/boxed things are pantry and "garlic bread" is bakery, so those are checked before produce.
  const AISLE_CHECK = ['Frozen', 'Bakery & bread', 'Pantry*', 'Meat & seafood', 'Dairy & eggs', 'Produce', 'Pantry', 'Drinks', 'Household'];
  const PANTRY_FIRST = /goldfish|crackers?|peanut butter|cream of|\bcans?\b|canned|jar|packets?|box(ed)?|seasoning|sauce|\bmix\b|diced|crushed|dried|broth/i;
  function aisleOf(text) {
    for (const a of AISLE_CHECK) {
      if (a === 'Pantry*') { if (PANTRY_FIRST.test(text)) return 'Pantry'; continue; }
      if (AISLES.find(x => x[0] === a)[1].test(text)) return a;
    }
    return 'Other';
  }
  let info = null, tab = 'event';
  // A little vine of leaves across the top, like Shaana's planner.
  const VINE = '<svg class="vine" viewBox="0 0 240 40" aria-hidden="true"><path d="M2 8 C 50 34, 90 30, 120 14 S 190 2, 238 20" fill="none" stroke="#6f8f66" stroke-width="1.6"/>' +
    [[22, 18, -30], [44, 26, 25], [66, 29, -20], [88, 26, 30], [110, 18, -35], [134, 11, 20], [158, 7, -25], [182, 8, 30], [206, 12, -20], [226, 17, 25]].map(([x, y, r], i) =>
      '<ellipse cx="' + x + '" cy="' + (y + (i % 2 ? 7 : -7)) + '" rx="8" ry="4" transform="rotate(' + r + ' ' + x + ' ' + (y + (i % 2 ? 7 : -7)) + ')" fill="' + (i % 3 ? '#8fb48a' : '#a9c7a2') + '" stroke="#5f7d57" stroke-width=".8"/>').join('') + '</svg>';
  // ---- Month calendar (and period tracking for Cece) ----
  const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return iso(x); };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
  let calMonth = today.slice(0, 7), selDay = today;
  const monthEvents = {};   // 'YYYY-MM' → events from the family calendars that belong on this link
  // Logged period days → next expected start (average cycle; 28 days until two periods are logged). Same as kid-ics.
  function periodPlan(days) {
    const set = new Set(days), starts = [...set].sort().filter(d => !set.has(addDays(d, -1)));
    if (!starts.length) return null;
    const lens = starts.map(st => { let n = 0; while (set.has(addDays(st, n))) n++; return n; });
    const gaps = []; for (let i = 1; i < starts.length; i++) { const g = daysBetween(starts[i - 1], starts[i]); if (g >= 18 && g <= 45) gaps.push(g); }
    const avg = a => a.reduce((t, x) => t + x, 0) / a.length;
    const cycle = info.cycleDays || (gaps.length ? Math.round(avg(gaps.slice(-6))) : 28), ended = lens.filter((n, i) => addDays(starts[i], n) <= today), len = ended.length ? Math.min(8, Math.max(3, Math.round(avg(ended.slice(-6))))) : 5;
    let next = addDays(starts[starts.length - 1], cycle);
    while (addDays(next, len) <= today) next = addDays(next, cycle);
    const predicted = new Set(); for (let c = 0; c < 3; c++) for (let i = 0; i < len; i++) predicted.add(addDays(next, c * cycle + i));
    let dayNo = 0; if (set.has(today)) { let d = today; while (set.has(addDays(d, -1))) d = addDays(d, -1); dayNo = daysBetween(d, today) + 1; }
    return { cycle, len, next, predicted, dayNo };
  }
  // While a period is "started" and not ended yet, every day from the start through today counts.
  const perDays = () => {
    const days = [...(info.periodDays || [])], open = info.periodOpen;
    if (open && open <= today) for (let d = open, i = 0; d <= today && i < 10; d = addDays(d, 1), i++) days.push(d);
    return days;
  };
  const eventsOn = d => (monthEvents[d.slice(0, 7)] || info.events || []).filter(e => e.date === d || (e.endDate && e.date <= d && e.endDate >= d));
  async function loadMonth(ym) {
    if (monthEvents[ym]) return;
    const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate();
    try {
      const r = await fetch(icsUrl() + '&list=1&from=' + ym + '-01&to=' + ym + '-' + pad(last)).then(x => x.json());
      if (r && Array.isArray(r.events)) { monthEvents[ym] = r.events; if ($('cal')) $('cal').innerHTML = calHtml(); }
    } catch (e) {}
  }
  function calHtml() {
    const [y, m] = calMonth.split('-').map(Number), first = new Date(y, m - 1, 1), last = new Date(y, m, 0).getDate();
    const per = new Set(info.period ? perDays() : []), plan = info.period ? periodPlan(perDays()) : null;

      } catch (err) { btn.disabled = false; toast(/date/i.test(err.message) ? 'Pick a day in the next year.' : /slow/i.test(err.message) ? 'That’s a lot! Try again later.' : 'Couldn’t add that. Try again.'); }
    };
  }
  function redrawTodo() { const el = app.querySelector('.card.todo'); if (el) { el.outerHTML = todoHtml(); wireTodo(); } }
  // ---- Today's encouragement: a new one each day, picked for each person ----
  // Elisha: composers and musicians · Cece: pop stars · Salvador: Bible verses (KJV). Lines without a name are our own.
  const CHEER = {"Eli": [["To play a wrong note is insignificant; to play without passion is inexcusable.", "Ludwig van Beethoven"], ["If it sounds good, it is good.", "Duke Ellington"], ["What we play is life.", "Louis Armstrong"], ["To achieve great things, two things are needed: a plan, and not quite enough time.", "Leonard Bernstein"], ["Do not fear mistakes. There are none.", "Miles Davis"], ["Inspiration is a guest that does not willingly visit the lazy.", "Pyotr Ilyich Tchaikovsky"], ["Love, love, love, that is the soul of genius.", "Wolfgang Amadeus Mozart"], ["It's taken me all my life to learn what not to play.", "Dizzy Gillespie"], ["The humble improve.", "Wynton Marsalis"], ["Master your instrument, master the music, then forget all that and just play.", "Charlie Parker"], ["Music is the space between the notes.", "Claude Debussy"], ["One good thing about music: when it hits you, you feel no pain.", "Bob Marley"], ["Practice makes progress. Every great player started with one squeaky note. 🎺", ""], ["A rest is still part of the music. Take one when you need it.", ""], ["Play today like it's the halftime show. 🏈🎶", ""], ["Count it off and go for it. You know this music.", ""], ["Mistakes are just notes you didn't plan. Keep playing.", ""], ["Breathe deep, sit tall, and let it sing.", ""], ["The band sounds better because you're in it.", ""], ["Ten more minutes of practice today is a better concert tomorrow.", ""]], "Cece": [["No matter what happens in life, be good to people. Being good to people is a wonderful legacy to leave behind.", "Taylor Swift"], ["Just be yourself, there is no one better.", "Taylor Swift"], ["Don't you ever let a soul in the world tell you that you can't be exactly who you are.", "Lady Gaga"], ["Find out who you are and do it on purpose.", "Dolly Parton"], ["If you don't like the road you're walking, start paving another one.", "Dolly Parton"], ["Treat people with kindness.", "Harry Styles"], ["Main character energy today. ✨", ""], ["You're the headliner of your own tour today. 🎤", ""], ["Today's forecast: 100% chance of you being iconic. 💖", ""], ["Glitter on, worries off. ✨", ""], ["Not a backup dancer in anyone's story. You're the star.", ""], ["Practice like it's rehearsal, shine like it's the stage.", ""], ["Turn the volume up on kindness today. 🔊", ""], ["Your sparkle can't be bought. It's all yours.", ""], ["Encore-worthy effort today, superstar. 👏", ""], ["Be the song everybody's humming.", ""], ["Hit the high notes today. You've got range. 🎶", ""], ["Not everyone will get your music, and that's okay.", ""], ["Your vibe is a whole playlist on repeat.", ""], ["Sold-out show energy, all day long. 🎟️", ""]], "Salvador": [["This is the day which the LORD hath made; we will rejoice and be glad in it.", "Psalm 118:24"], ["I can do all things through Christ which strengtheneth me.", "Philippians 4:13"], ["Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.", "Joshua 1:9"], ["Trust in the LORD with all thine heart; and lean not unto thine own understanding.", "Proverbs 3:5"], ["They that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.", "Isaiah 40:31"], ["God is our refuge and strength, a very present help in trouble.", "Psalm 46:1"], ["And whatsoever ye do, do it heartily, as to the Lord, and not unto men.", "Colossians 3:23"], ["Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "Matthew 11:28"], ["And we know that all things work together for good to them that love God.", "Romans 8:28"], ["The LORD is my shepherd; I shall not want.", "Psalm 23:1"], ["His compassions fail not. They are new every morning: great is thy faithfulness.", "Lamentations 3:22–23"], ["Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee.", "Isaiah 41:10"], ["And let us not be weary in well doing: for in due season we shall reap, if we faint not.", "Galatians 6:9"], ["The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.", "Psalm 121:8"], ["Commit thy works unto the LORD, and thy thoughts shall be established.", "Proverbs 16:3"], ["Be ye kind one to another, tenderhearted, forgiving one another.", "Ephesians 4:32"], ["The joy of the LORD is your strength.", "Nehemiah 8:10"], ["For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", "2 Timothy 1:7"], ["What doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?", "Micah 6:8"], ["Let all your things be done with charity.", "1 Corinthians 16:14"]]};
  const CHEER_HEAD = { Eli: '🎼 Today’s note', Cece: '🎤 Today’s vibe', Salvador: '🙏 Today’s verse' };
  function cheerHtml() {
    const list = CHEER[info.name]; if (!list) return '';
    const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5), [q, who] = list[day % list.length];
    return '<div class="card cheer"><h2>' + CHEER_HEAD[info.name] + '</h2><p class="q">“' + esc(q) + '”</p>' + (who ? '<p class="who">— ' + esc(who) + '</p>' : '') + '</div>';
  }
  async function load() {
    try { info = await rpc('kid_info', { p_token: token }); } catch (e) { info = null; }
    if (!info) { app.innerHTML = '<div class="msg"><h1>🙈</h1><p>This link doesn’t work. Ask for a new one.</p></div>'; return; }
    draw(); loadUpcoming();
  }
  function draw() {
    document.title = info.name + '’s Family Planner';
    const hr = new Date().getHours();
    app.innerHTML = '<div class="hello">' + VINE + '<span class="eyebrow">' + (hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening') + ', ' + esc(info.name) + ' 💛</span>' +
      '<h1>' + esc(new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })) + '</h1>' +
      '<p class="sub">Add things to the family calendar or the shopping list. ' + esc(info.tell || 'Mom') + ' gets a message when you do.</p></div>' + bdayHtml() + cheerHtml() + periodWarn() + homeHelp() + pingsHtml() + todoHtml() + remsHtml() +
      '<div class="tabs three"><button type="button" data-tab="event" class="' + (tab === 'event' ? 'on' : '') + '">📅 Calendar</button><button type="button" data-tab="shop" class="' + (tab === 'shop' ? 'on' : '') + '">🛒 Shopping</button><button type="button" data-tab="dinner" class="' + (tab === 'dinner' ? 'on' : '') + '">🍽️ Dinner idea</button></div>' +
      (tab === 'dinner' ? dinnerHtml() : tab === 'event' ?
        periodHtml() + '<div class="card" id="cal">' + calHtml() + '</div>' +
        '<form class="card" id="f"><label for="t">What is it?</label><input id="t" required maxlength="120" placeholder="Band practice, game, friend’s party…" autocomplete="off">' +
        '<label for="d">Day</label><input id="d" type="date" required min="' + today + '" value="' + (selDay >= today ? selDay : today) + '">' +
        '<label class="check"><input type="checkbox" id="ad"> All day</label>' +
        '<div class="two" id="times"><div><label for="s">Starts</label><input id="s" type="time"></div><div><label for="e">Ends</label><input id="e" type="time"></div></div>' +
        '<label for="w">Whose calendar?</label><select id="w">' + whoOpts() + '</select>' +
        '<label for="n">Anything else? (where, need a ride…)</label><textarea id="n" rows="2" maxlength="500"></textarea>' +
        '<button class="go">Add to the calendar</button></form>' +
        '<div class="card" id="up">' + upHtml() + '</div>'
      :
        '<form class="card" id="f"><label for="t">What do we need?</label><input id="t" required maxlength="120" placeholder="Goldfish crackers, shampoo…" autocomplete="off">' +
        '<label for="n">Details (optional)</label><input id="n" maxlength="200" placeholder="the big box, strawberry kind…">' +
        '<button class="go">Add to the shopping list</button></form>' +
        '<div class="card"><h2>Already on the list</h2>' + (info.shop.length ? info.shop.map(s => '<div class="row"><span>' + esc(s.title) + (s.notes ? ' <span class="muted">· ' + esc(s.notes) + '</span>' : '') + '</span></div>').join('') : '<p class="muted">The list is empty.</p>') + '</div>') +
      (info.mine.length ? '<div class="card ok"><h2>You added</h2>' + info.mine.map(m => '<div class="row"><span>' + (m.kind === 'event' ? '📅 ' : m.kind === 'dinner' ? '🍽️ ' : '🛒 ') + esc(m.title) + '</span></div>').join('') + '</div>' : '');
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
    app.querySelectorAll('[data-rem]').forEach(c => c.onchange = () => { const d = remDone().filter(x => x !== c.dataset.rem); if (c.checked) d.push(c.dataset.rem); store.set(remKey(), JSON.stringify(d)); draw(); });
    if ($('remAdd')) $('remAdd').onclick = () => store.set('remSub-' + token.slice(0, 8), '1');
    if ($('remNew')) $('remNew').onclick = () => { remEdit = 'new'; draw(); $('remT').focus(); };
    app.querySelectorAll('[data-remedit]').forEach(b => b.onclick = () => { remEdit = +b.dataset.remedit; draw(); $('remT').focus(); });
    const saveRems = async list => {
      try { info.reminders = await rpc('kid_set_reminders', { p_token: token, p_reminders: list }); remEdit = null; draw(); toast('✓ Saved'); }
      catch (e) { toast('Couldn’t save. Try again.'); }
    };
    if ($('remCancel')) $('remCancel').onclick = () => { remEdit = null; draw(); };
    if ($('remDel')) $('remDel').onclick = () => { if (confirm('Delete this reminder?')) saveRems(info.reminders.filter((x, i) => i !== remEdit)); };
    const rf = app.querySelector('[data-remform]');
    if (rf) rf.onsubmit = e => { e.preventDefault(); const x = { t: $('remT').value.trim(), at: $('remAt').value }; if (!x.t || !x.at) return; const l = (info.reminders || []).slice(); if (remEdit === 'new') l.push(x); else l[remEdit] = x; saveRems(l); };
    if (app.querySelector('.bday:not(.other)')) confetti();
    // Checking "I did it" hides the Home Screen steps for good on this phone.
    if ($('hsDone')) $('hsDone').onchange = () => {
      store.set('hsHide', '1');
      const card = app.querySelector('.card.hs'); card.style.transition = 'opacity .35s'; card.style.opacity = '0';
      setTimeout(() => { card.remove(); toast('🎉 Great! Open it from your Home Screen icon from now on.'); }, 350);
    };
    app.onclick = e => {
      const b = e.target.closest('[data-per]'), o = e.target.closest('[data-per-other]'), sv = e.target.closest('[data-per-day]');
      if (b) periodAction(b.dataset.per, today);
      else if (o) { perOther = o.dataset.perOther; app.querySelector('.pcard:not(.warn)').outerHTML = periodHtml(); }
      else if (sv) { const d = $('perDay').value; if (d) periodAction(sv.dataset.perDay, d); }
      else if (e.target.closest('[data-pl-edit]')) { perEdit = e.target.closest('[data-pl-edit]').dataset.plEdit; app.querySelector('.pcard:not(.warn)').outerHTML = periodHtml(); }
      else if (e.target.closest('[data-pl-save]')) {
        const k = e.target.closest('[data-pl-save]').dataset.plSave, start = k === 'new' ? $('plStart').value : k, days = Number($('plDays').value);
        if (!start || !(days >= 1 && days <= 14)) { toast('Pick a day and 1–14 days.'); return; }
        rpc('kid_period_len', { p_token: token, p_start: start, p_days: days }).then(() => { perEdit = null; toast('✓ Saved'); return reloadPeriod(); }).catch(() => toast('Couldn’t save. Try again.'));
      }
    };
    if ($('cal')) {
      loadMonth(calMonth);
      $('cal').onclick = async e => {
        const mv = e.target.closest('[data-mv]'), day = e.target.closest('[data-day]');
        if (mv) { const [y, m] = calMonth.split('-').map(Number), d = new Date(y, m - 1 + Number(mv.dataset.mv), 1); calMonth = iso(d).slice(0, 7); selDay = calMonth === today.slice(0, 7) ? today : calMonth + '-01'; $('cal').innerHTML = calHtml(); loadMonth(calMonth); }
        else if (day) { selDay = day.dataset.day; $('cal').innerHTML = calHtml(); if ($('d') && selDay >= today) $('d').value = selDay; }
      };
    }
    if ($('ad')) $('ad').onchange = () => { $('times').style.display = $('ad').checked ? 'none' : ''; };
    wireTodo();
    if (tab === 'dinner') wireDinner();
    if ($('f')) $('f').onsubmit = async e => {
      e.preventDefault();
      const btn = $('f').querySelector('.go'), title = $('t').value.trim(); if (!title) return;
      const body = { p_token: token, p_kind: tab, p_title: title, p_notes: $('n').value.trim(), p_date: null, p_start: '', p_end: '', p_list: '', p_for: '' };
      if (tab === 'event') Object.assign(body, { p_date: $('d').value, p_start: $('ad').checked ? '' : $('s').value, p_end: $('ad').checked ? '' : $('e').value, p_for: $('w').value });
      else body.p_list = aisleOf(title);
      btn.disabled = true; btn.textContent = 'Adding…';
      try {
        const r = await rpc('kid_add', body);
        call('/functions/v1/kid-notify', { token, activity: r.activity }).catch(() => {});
        toast('✓ Added! ' + (info.tell || 'Mom') + ' will see it.');
        delete monthEvents[body.p_date ? body.p_date.slice(0, 7) : calMonth];
        info = await rpc('kid_info', { p_token: token }); draw(); loadUpcoming();
      } catch (err) { btn.disabled = false; btn.textContent = tab === 'event' ? 'Add to the calendar' : 'Add to the shopping list'; toast(/date/i.test(err.message) ? 'Pick a day.' : /slow/i.test(err.message) ? 'That’s a lot! Try again later.' : 'Couldn’t add that. Try again.'); }
    };
  }
  load();
})();
</script>
<script src="../refresh.js"></script>
</body>
</html>
