<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Planner</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f4ef">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Family">
  <style>
    :root { --bg: #f7f4ef; --card: #fff; --ink: #2b2522; --muted: #8e837b; --line: #e6dfd7; --sage: #7d9b76; --sage-soft: #e7efe4; --accent: #2b2522; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1a18; --card: #2a2623; --ink: #f2ede8; --muted: #a99f97; --line: #3b3531; --sage: #93b28b; --sage-soft: #2f3a2c; --accent: #f2ede8; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    main { max-width: 600px; margin: 0 auto; padding: 18px 16px 60px; }
    h1 { font-size: 1.7rem; margin: 6px 0 2px; }
    .sub { color: var(--muted); margin: 0 0 14px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .tabs button { font: inherit; font-weight: 600; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .tabs button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin: 12px 0; }
    h2 { font-size: .95rem; margin: 2px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
    input, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 500; }
    .check input { width: 20px; height: 20px; }
    .go { width: 100%; margin-top: 14px; background: var(--accent); color: var(--bg); border: 0; border-radius: 999px; padding: 14px; font: inherit; font-weight: 700; }
    .go:disabled { opacity: .5; }
    .row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; }
    .row b { flex: none; min-width: 92px; font-weight: 600; color: var(--muted); font-size: 14px; padding-top: 1px; }
    .muted { color: var(--muted); }
    .ok { background: var(--sage-soft); border-color: var(--sage); }
    .hs { background: var(--sage-soft); border-color: var(--sage); }
    .hs h2 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 1.05rem; }
    .hs ol { margin: 6px 0 4px; padding-left: 1.3em; }
    .hs li { margin: 6px 0; }
    .hs .x { float: right; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; }
    .ico { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; background: var(--card); font-size: 15px; }
    .rem { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-weight: 500; }
    .rem:first-of-type { border-top: 0; }
    .rem input { width: 26px; height: 26px; flex: none; accent-color: var(--sage); margin: 0; }
    .rem span { flex: 1; }
    .rem small { color: var(--muted); font-weight: 600; }
    .rem.done span { text-decoration: line-through; color: var(--muted); }
    .rem .link { border: 0; background: none; font-size: 1rem; padding: 2px 4px; text-decoration: none; }
    .link { border: 0; background: none; color: var(--ink); font: inherit; text-decoration: underline; padding: 6px 0; cursor: pointer; }
    .link.danger { color: #b0473a; }
    .addrem { display: block; margin-top: 6px; font-weight: 600; text-decoration: none; }
    .remform { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 8px; }
    .remform .two { align-items: center; }
    .remform .go { margin: 0; padding: 11px; }
    .remrow { display: flex; gap: 16px; }
    .addcal { display: block; text-align: center; text-decoration: none; margin-top: 10px; background: var(--sage); color: #fff; border-radius: 999px; padding: 12px; font-weight: 700; }
    .bday { text-align: center; background: linear-gradient(135deg, #ffe3ec, #fff3c9 55%, #dff3ff); border: 0; color: #4a2a35; position: relative; overflow: hidden; }
    .bday h2 { color: #b23a6b; text-transform: none; letter-spacing: 0; font-size: 1.5rem; margin: 4px 0; }
    .bday p { margin: 4px 0; }
    .bday .big { font-size: 3rem; line-height: 1.1; }
    .bday.other { background: linear-gradient(135deg, #f3e9ff, #fff3c9); }
    .bday.other h2 { font-size: 1.15rem; }
    .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 40; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
    .ping { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .ping:first-of-type { border-top: 0; }
    .ping b { flex: none; min-width: 92px; color: var(--muted); font-size: 14px; }
    .msg { text-align: center; padding: 40px 10px; }
    .calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .calhead b { font-size: 1.1rem; }
    .calhead button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; width: 40px; height: 40px; font: inherit; font-size: 1.2rem; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
    .grid .wd { font-size: 12px; color: var(--muted); font-weight: 600; padding: 2px 0 4px; }
    .grid button { position: relative; aspect-ratio: 1 / 1.05; border: 1px solid transparent; border-radius: 12px; background: none; color: var(--ink); font: inherit; font-size: 15px; padding: 4px 0 0; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
    .grid button.out { visibility: hidden; }
    .grid button.today { border-color: var(--ink); font-weight: 700; }
    .grid button.sel { background: var(--accent); color: var(--bg); }
    .grid button.per { background: #f7c6d6; color: #5a1f35; }
    .grid button.per.sel { background: #c94f7c; color: #fff; }
    .grid button.pred { border: 2px dashed #e58fb0; }
    .dots { display: flex; gap: 2px; height: 6px; }
    .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--sage); }
    .grid button.sel .dots i { background: var(--bg); }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .legend span::before { content: ''; display: inline-block; width: 11px; height: 11px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
    .legend .l-ev::before { background: var(--sage); border-radius: 50%; }
    .legend .l-per::before { background: #f7c6d6; }
    .legend .l-pred::before { border: 2px dashed #e58fb0; width: 9px; height: 9px; }
    .dayp h3 { margin: 12px 0 4px; font-size: 1rem; }
    .pbtn { margin-top: 10px; width: 100%; border: 2px solid #e58fb0; background: none; color: inherit; border-radius: 999px; padding: 11px; font: inherit; font-weight: 700; }
    .pbtn.on { background: #f7c6d6; color: #5a1f35; border-color: #f7c6d6; }
    .pcard { background: #fff0f5; border-color: #f7c6d6; color: #5a1f35; }
    .pcard h2 { color: #b23a6b; }
    @media (prefers-color-scheme: dark) { .pcard { background: #3a2530; border-color: #6b3a52; color: #f7d9e4; } .pcard h2 { color: #f2a6c3; } .grid button.per { background: #7a3554; color: #fff; } }
    #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--accent); color: var(--bg); padding: 11px 18px; border-radius: 14px; max-width: 90%; text-align: center; }
  </style>
</head>
<body>
<main id="app"><p class="msg">Loading…</p></main>
<div id="toast" hidden></div>
<script src="config.js"></script>
<script>
(() => {
  // A link for Eli or Cece: they can add events and shopping items, but can't change or delete anything.
  const CFG = window.PLANNER_CONFIG, P = CFG.sync, token = new URLSearchParams(location.search).get('t') || '';
  const $ = id => document.getElementById(id), app = $('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const call = async (path, body) => {
    const r = await fetch(P.url + path, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: P.key, Authorization: 'Bearer ' + P.key }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error((j && (j.message || j.error)) || 'Something went wrong');
    return j;
  };
  const rpc = (fn, body) => call('/rest/v1/rpc/' + fn, body);
  function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
  const pad = n => String(n).padStart(2, '0'), iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = iso(new Date());
  const niceDate = d => new Date(d + 'T12:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const niceTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + (m ? ':' + pad(m) : '') + (h < 12 ? 'am' : 'pm'); };
  const AISLES = [
    ['Produce', /lettuce|tomato|onion|garlic|pepper|potato|carrot|celery|banana|apple|berr|grape|lemon|lime|avocado|cilantro|spinach|broccoli|corn|cucumber|fruit|vegetable|salad|mushroom|zucchini|green bean|orange|herb|parsley|jalape/i],
    ['Meat & seafood', /beef|chicken|pork|turkey|sausage|bacon|ham|steak|shrimp|fish|salmon|tuna|ground|hot dog|pepperoni|meat/i],
    ['Dairy & eggs', /milk|cheese|butter|egg|yogurt|cream|sour cream|half.and.half|creamer/i],
    ['Bakery & bread', /bread|bun|tortilla|roll|bagel|muffin|biscuit|croissant|pita/i],
    ['Frozen', /frozen|ice cream|pizza|fries|tater|waffle/i],
    ['Pantry', /rice|pasta|spaghetti|noodle|sauce|bean|soup|broth|stock|flour|sugar|oil|vinegar|spice|seasoning|salt|pepper|cereal|oat|peanut butter|jelly|syrup|can|taco shell|chip|cracker|ketchup|mustard|mayo|dressing|honey|pancake mix|salsa|cookie|snack|granola/i],
    ['Drinks', /water|soda|juice|coffee|tea|gatorade|drink/i],
    ['Household', /paper|towel|toilet|soap|detergent|trash|foil|wrap|bag|dish|cleaner|wipes|shampoo|toothpaste|diaper|napkin|plate|cup/i]
  ];
  // Canned/boxed things are pantry and "garlic bread" is bakery, so those are checked before produce.
  const AISLE_CHECK = ['Frozen', 'Bakery & bread', 'Pantry*', 'Meat & seafood', 'Dairy & eggs', 'Produce', 'Pantry', 'Drinks', 'Household'];
  const PANTRY_FIRST = /goldfish|crackers?|peanut butter|cream of|\bcans?\b|canned|jar|packets?|box(ed)?|seasoning|sauce|\bmix\b|diced|crushed|dried|broth/i;
  function aisleOf(text) {
    for (const a of AISLE_CHECK) {
      if (a === 'Pantry*') { if (PANTRY_FIRST.test(text)) return 'Pantry'; continue; }
      if (AISLES.find(x => x[0] === a)[1].test(text)) return a;
    }
    return 'Other';
  }
  let info = null, tab = 'event';
  // ---- Month calendar (and period tracking for Cece) ----
  const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return iso(x); };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
  let calMonth = today.slice(0, 7), selDay = today;
  const monthEvents = {};   // 'YYYY-MM' → events from the family calendars that belong on this link
  // Logged period days → next expected start (average cycle; 28 days until two periods are logged). Same as kid-ics.
  function periodPlan(days) {
    const set = new Set(days), starts = [...set].sort().filter(d => !set.has(addDays(d, -1)));
    if (!starts.length) return null;
    const lens = starts.map(st => { let n = 0; while (set.has(addDays(st, n))) n++; return n; });
    const gaps = []; for (let i = 1; i < starts.length; i++) { const g = daysBetween(starts[i - 1], starts[i]); if (g >= 18 && g <= 45) gaps.push(g); }
    const avg = a => a.reduce((t, x) => t + x, 0) / a.length;
    const cycle = gaps.length ? Math.round(avg(gaps.slice(-6))) : 28, ended = lens.filter((n, i) => addDays(starts[i], n) <= today), len = ended.length ? Math.min(8, Math.max(3, Math.round(avg(ended.slice(-6))))) : 5;
    let next = addDays(starts[starts.length - 1], cycle);
    while (addDays(next, len) <= today) next = addDays(next, cycle);
    const predicted = new Set(); for (let c = 0; c < 3; c++) for (let i = 0; i < len; i++) predicted.add(addDays(next, c * cycle + i));
    let dayNo = 0; if (set.has(today)) { let d = today; while (set.has(addDays(d, -1))) d = addDays(d, -1); dayNo = daysBetween(d, today) + 1; }
    return { cycle, len, next, predicted, dayNo };
  }
  const eventsOn = d => (monthEvents[d.slice(0, 7)] || info.events || []).filter(e => e.date === d || (e.endDate && e.date <= d && e.endDate >= d));
  async function loadMonth(ym) {
    if (monthEvents[ym]) return;
    const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate();
    try {
      const r = await fetch(icsUrl() + '&list=1&from=' + ym + '-01&to=' + ym + '-' + pad(last)).then(x => x.json());
      if (r && Array.isArray(r.events)) { monthEvents[ym] = r.events; if ($('cal')) $('cal').innerHTML = calHtml(); }
    } catch (e) {}
  }
  function calHtml() {
    const [y, m] = calMonth.split('-').map(Number), first = new Date(y, m - 1, 1), last = new Date(y, m, 0).getDate();
    const per = new Set(info.period ? info.periodDays || [] : []), plan = info.period ? periodPlan(info.periodDays || []) : null;
    let cells = '';
    for (let i = 0; i < first.getDay(); i++) cells += '<button type="button" class="out" tabindex="-1"></button>';
    for (let d = 1; d <= last; d++) {
      const day = calMonth + '-' + pad(d), n = eventsOn(day).length;
      const cls = [day === today ? 'today' : '', day === selDay ? 'sel' : '', per.has(day) ? 'per' : '', !per.has(day) && plan && plan.predicted.has(day) && day >= today ? 'pred' : ''].filter(Boolean).join(' ');
      cells += '<button type="button" data-day="' + day + '" class="' + cls + '">' + d + '<span class="dots">' + '<i></i>'.repeat(Math.min(n, 3)) + '</span></button>';
    }
    const sel = eventsOn(selDay);
    return '<div class="calhead"><button type="button" data-mv="-1" aria-label="Last month">‹</button><b>' + first.toLocaleDateString([], { month: 'long', year: 'numeric' }) + '</b><button type="button" data-mv="1" aria-label="Next month">›</button></div>' +
      '<div class="grid">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(w => '<span class="wd">' + w + '</span>').join('') + cells + '</div>' +
      '<div class="legend"><span class="l-ev">Event</span>' + (info.period ? '<span class="l-per">Period</span><span class="l-pred">Expected</span>' : '') + '</div>' +
      '<div class="dayp"><h3>' + esc(new Date(selDay + 'T12:00').toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })) + '</h3>' +
      (sel.length ? sel.map(e => '<div class="row"><b>' + (e.allDay || !e.start ? 'All day' : niceTime(e.start)) + '</b><span>' + esc(e.title) + (e.location ? ' <span class="muted">· ' + esc(e.location) + '</span>' : '') + '</span></div>').join('') : '<p class="muted" style="margin:4px 0">Nothing that day.</p>') +
      (info.period ? '<button type="button" class="pbtn' + (per.has(selDay) ? ' on' : '') + '" id="perT">' + (per.has(selDay) ? '🌸 Period day ✓ (tap to remove)' : '🌸 Mark as a period day') + '</button>' : '') + '</div>';
  }
  function periodHtml() {
    if (!info.period) return '';
    const plan = periodPlan(info.periodDays || []);
    const line = !plan ? 'Start by marking the days of your last period on the calendar below. It will guess when the next one comes.'
      : plan.dayNo ? 'Today is <b>day ' + plan.dayNo + '</b> of your period.' + ' Next one expected around <b>' + esc(niceDate(plan.next > today ? plan.next : addDays(plan.next, plan.cycle))) + '</b>.'
      : 'Next period expected around <b>' + esc(niceDate(plan.next)) + '</b>' + (daysBetween(today, plan.next) > 0 ? ' (in ' + daysBetween(today, plan.next) + ' day' + (daysBetween(today, plan.next) === 1 ? '' : 's') + ')' : ' (any day now)') + '.';
    return '<div class="card pcard"><h2>🌸 Period tracker</h2><p style="margin:0">' + line + '</p>' +
      (plan ? '<p style="margin:6px 0 0;font-size:14px">Usual cycle: ' + plan.cycle + ' days · usually lasts ' + plan.len + ' days</p>' : '') +
      '<p style="margin:6px 0 0;font-size:14px">Tap a day, then 🌸 to mark it. The more you mark, the better the guess. If pop-ups are on, your phone gives you a heads-up 2 days before.</p></div>';
  }
  // Daily reminders: anyone with the link can add, change or delete them. Checkboxes are for today.
  // The phone pops them up through a calendar subscription, which picks up changes on its own.
  const remKey = () => 'remDone-' + token.slice(0, 8) + '-' + today;
  const remDone = () => { try { return JSON.parse(store.get(remKey()) || '[]'); } catch (e) { return []; } };
  const icsUrl = () => P.url + '/functions/v1/kid-ics?t=' + token, webcal = () => icsUrl().replace(/^https?:/, 'webcal:');
  let remEdit = null; // index being edited, or 'new'
  const remForm = (x, i) => '<form class="remform" data-remform="' + i + '"><input id="remT" maxlength="80" placeholder="Brush your teeth, take your pill…" value="' + esc(x ? x.t : '') + '" required><div class="two"><input id="remAt" type="time" required value="' + esc(x ? x.at : '') + '"><button class="go small">Save</button></div><div class="remrow">' + (x ? '<button type="button" class="link danger" id="remDel">Delete</button>' : '') + '<button type="button" class="link" id="remCancel">Cancel</button></div></form>';
  const remsHtml = () => {
    const r = info.reminders || [], done = remDone();
    return '<div class="card"><h2>⏰ ' + esc(info.name) + '’s reminders</h2>' +
      (r.length ? r.map((x, i) => remEdit === i ? remForm(x, i) : '<div class="rem' + (done.includes(x.at + x.t) ? ' done' : '') + '"><input type="checkbox" aria-label="Done" data-rem="' + esc(x.at + x.t) + '"' + (done.includes(x.at + x.t) ? ' checked' : '') + '><span>' + esc(x.t) + '</span><small>' + niceTime(x.at) + '</small><button type="button" class="link" data-remedit="' + i + '" aria-label="Edit">✏️</button></div>').join('') : '<p class="muted">No reminders yet.</p>') +
      (remEdit === 'new' ? remForm(null, 'new') : '<button type="button" class="link addrem" id="remNew">＋ Add a reminder</button>') +
      (r.length || (info.pings || []).length || info.hasWork ? (store.get('remSub-' + token.slice(0, 8)) ? '<p class="muted" style="margin:10px 0 0;font-size:14px">✓ Pop-ups are on this phone. Changes show up on their own within about an hour. <a href="' + esc(webcal()) + '" id="remAdd">Set up again</a></p>' :
        '<a class="addcal" id="remAdd" href="' + esc(ios ? webcal() : icsUrl()) + '">🔔 Get pop-up reminders on my phone</a><ol class="muted" style="font-size:14px;margin:8px 0 0;padding-left:1.2em">' + (ios ? '<li>Tap the button, then tap <b>Subscribe</b>.</li><li>Turn <b>Remove Alerts OFF</b> (important, or nothing pops up).</li><li>Tap <b>Add</b>. Your phone will pop up each reminder every day, and changes made here show up on their own.</li>' : '<li>Tap the button and open it with your <b>Calendar</b> app, then tap <b>Add</b>.</li><li>Your phone will pop up each reminder every day. After changing reminders, tap the button again.</li>') + '</ol>') : '') + '</div>';
  };
  // Instructions for putting this page on the Home Screen, hidden once it's opened from there.
  const standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // Birthdays: a party banner on your own birthday, and a heads-up on everyone else's.
  const md = (() => { const d = new Date(); return pad(d.getMonth() + 1) + '-' + pad(d.getDate()); })();
  const BDAY_LINES = ['We love you so much and we’re so proud of you!', 'Today is all about YOU. Have the best day ever!', 'Another year of being awesome. Go celebrate!'];
  const bdayHtml = () => {
    const b = (info.birthdays || []).filter(x => x.md === md); if (!b.length) return '';
    const me = b.find(x => x.name === info.name), others = b.filter(x => x.name !== info.name).map(x => x.name === 'Shaana' && info.tell === 'Mom' ? 'Mom' : x.name);
    return (me ? '<div class="card bday"><div class="big">🎂🎉🎈</div><h2>Happy Birthday, ' + esc(info.name) + '!</h2><p>' + BDAY_LINES[new Date().getFullYear() % 3] + '</p><p>💛 Love, ' + (info.tell === 'Mom' ? 'Mom' : 'Shaana') + ' & the family</p></div>' : '') +
      (others.length ? '<div class="card bday other"><h2>🎁 Today is ' + others.map(esc).join(' and ') + '’s birthday!</h2><p>Don’t forget to wish ' + (others.length > 1 ? 'them' : others.map(esc)[0]) + ' a happy birthday 🎉</p></div>' : '');
  };
  const confetti = () => {
    if (store.get('confetti-' + md + new Date().getFullYear())) return; store.set('confetti-' + md + new Date().getFullYear(), '1');
    const colors = ['#f59ab5', '#ffd166', '#7cc6fe', '#9ee493', '#c3a6ff'];
    for (let i = 0; i < 70; i++) { const c = document.createElement('i'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length]; c.style.animationDuration = 2.5 + Math.random() * 2.5 + 's'; c.style.animationDelay = Math.random() * 1.2 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 6500); }
  };
  // Quick reminders Shaana sent (pick up Cece, football game…).
  const pingsHtml = () => {
    const p = (info.pings || []).filter(x => x.date >= today); if (!p.length && !info.hasWork) return '';
    return '<div class="card"><h2>📣 From ' + esc(info.tell === 'Mom' ? 'Mom' : 'Shaana') + '</h2>' + (p.length ? p.map(x => '<div class="ping"><b>' + (x.date === today ? 'Today' : esc(niceDate(x.date))) + (x.at ? '<br>' + niceTime(x.at) : '') + '</b><span>' + esc(x.t) + '</span></div>').join('') : '<p class="muted">Nothing right now.</p>') +
      (info.hasWork ? '<p class="muted" style="font-size:14px;margin:8px 0 0">💼 Work days from the family calendar are in your phone reminders too (you get a heads-up the night before).</p>' : '') + '</div>';
  };
  const homeHelp = () => standalone || store.get('hsHide') ? '' :
    '<div class="card hs"><button type="button" class="x" id="hsX">Hide</button><h2>📲 Put this on your Home Screen</h2>' +
    (ios ? '<ol><li>Open this link in <b>Safari</b>.</li><li>Tap the <b>Share</b> button <span class="ico">⬆︎</span> (bottom of the screen on iPhone, top on iPad).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. Now open it from the new icon anytime.</li></ol>'
      : '<ol><li>Open this link in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Add to Home screen</b> (or <b>Install app</b>).</li><li>Tap <b>Add</b>. Now open it from the new icon anytime.</li></ol>') + '</div>';

  const upHtml = () => '<h2>Coming up</h2>' + (info.events.length ? info.events.map(e => '<div class="row"><b>' + esc(niceDate(e.date)) + (e.endDate ? '<br>– ' + esc(niceDate(e.endDate)) : '') + (e.allDay || !e.start ? '' : '<br>' + niceTime(e.start)) + '</b><span>' + esc(e.title) + (e.location ? ' <span class="muted">· ' + esc(e.location) + '</span>' : '') + '</span></div>').join('') : '<p class="muted">Nothing on the calendar for the next 3 weeks.</p>');
  // A link with a filter (only Cece's events and work days) also lists matching events from the family calendars.
  async function loadUpcoming() {
    if (!info.filtered) return;
    try {
      const r = await fetch(icsUrl() + '&list=1').then(x => x.json());
      if (r && Array.isArray(r.events)) { info.events = r.events; if ($('up')) $('up').innerHTML = upHtml(); }
    } catch (e) {}
  }
  async function load() {
    try { info = await rpc('kid_info', { p_token: token }); } catch (e) { info = null; }
    if (!info) { app.innerHTML = '<div class="msg"><h1>🙈</h1><p>This link doesn’t work. Ask for a new one.</p></div>'; return; }
    draw(); loadUpcoming();
  }
  function draw() {
    document.title = info.name + '’s Family Planner';
    app.innerHTML = '<h1>Hi ' + esc(info.name) + '! 👋</h1><p class="sub">Add things to the family calendar or the shopping list. ' + esc(info.tell || 'Mom') + ' gets a message when you do.</p>' + bdayHtml() + homeHelp() + pingsHtml() + remsHtml() +
      '<div class="tabs"><button type="button" data-tab="event" class="' + (tab === 'event' ? 'on' : '') + '">📅 Calendar</button><button type="button" data-tab="shop" class="' + (tab === 'shop' ? 'on' : '') + '">🛒 Shopping list</button></div>' +
      (tab === 'event' ?
        periodHtml() + '<div class="card" id="cal">' + calHtml() + '</div>' +
        '<form class="card" id="f"><label for="t">What is it?</label><input id="t" required maxlength="120" placeholder="Band practice, game, friend’s party…" autocomplete="off">' +
        '<label for="d">Day</label><input id="d" type="date" required min="' + today + '" value="' + (selDay >= today ? selDay : today) + '">' +
        '<label class="check"><input type="checkbox" id="ad"> All day</label>' +
        '<div class="two" id="times"><div><label for="s">Starts</label><input id="s" type="time"></div><div><label for="e">Ends</label><input id="e" type="time"></div></div>' +
        '<label for="n">Anything else? (where, need a ride…)</label><textarea id="n" rows="2" maxlength="500"></textarea>' +
        '<button class="go">Add to the calendar</button></form>' +
        '<div class="card" id="up">' + upHtml() + '</div>'
      :
        '<form class="card" id="f"><label for="t">What do we need?</label><input id="t" required maxlength="120" placeholder="Goldfish crackers, shampoo…" autocomplete="off">' +
        '<label for="n">Details (optional)</label><input id="n" maxlength="200" placeholder="the big box, strawberry kind…">' +
        '<button class="go">Add to the shopping list</button></form>' +
        '<div class="card"><h2>Already on the list</h2>' + (info.shop.length ? info.shop.map(s => '<div class="row"><span>' + esc(s.title) + (s.notes ? ' <span class="muted">· ' + esc(s.notes) + '</span>' : '') + '</span></div>').join('') : '<p class="muted">The list is empty.</p>') + '</div>') +
      (info.mine.length ? '<div class="card ok"><h2>You added</h2>' + info.mine.map(m => '<div class="row"><span>' + (m.kind === 'event' ? '📅 ' : '🛒 ') + esc(m.title) + '</span></div>').join('') + '</div>' : '');
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
    app.querySelectorAll('[data-rem]').forEach(c => c.onchange = () => { const d = remDone().filter(x => x !== c.dataset.rem); if (c.checked) d.push(c.dataset.rem); store.set(remKey(), JSON.stringify(d)); draw(); });
    if ($('remAdd')) $('remAdd').onclick = () => store.set('remSub-' + token.slice(0, 8), '1');
    if ($('remNew')) $('remNew').onclick = () => { remEdit = 'new'; draw(); $('remT').focus(); };
    app.querySelectorAll('[data-remedit]').forEach(b => b.onclick = () => { remEdit = +b.dataset.remedit; draw(); $('remT').focus(); });
    const saveRems = async list => {
      try { info.reminders = await rpc('kid_set_reminders', { p_token: token, p_reminders: list }); remEdit = null; draw(); toast('✓ Saved'); }
      catch (e) { toast('Couldn’t save. Try again.'); }
    };
    if ($('remCancel')) $('remCancel').onclick = () => { remEdit = null; draw(); };
    if ($('remDel')) $('remDel').onclick = () => { if (confirm('Delete this reminder?')) saveRems(info.reminders.filter((x, i) => i !== remEdit)); };
    const rf = app.querySelector('[data-remform]');
    if (rf) rf.onsubmit = e => { e.preventDefault(); const x = { t: $('remT').value.trim(), at: $('remAt').value }; if (!x.t || !x.at) return; const l = (info.reminders || []).slice(); if (remEdit === 'new') l.push(x); else l[remEdit] = x; saveRems(l); };
    if (app.querySelector('.bday:not(.other)')) confetti();
    if ($('hsX')) $('hsX').onclick = () => { store.set('hsHide', '1'); draw(); };
    if ($('cal')) {
      loadMonth(calMonth);
      $('cal').onclick = async e => {
        const mv = e.target.closest('[data-mv]'), day = e.target.closest('[data-day]');
        if (mv) { const [y, m] = calMonth.split('-').map(Number), d = new Date(y, m - 1 + Number(mv.dataset.mv), 1); calMonth = iso(d).slice(0, 7); selDay = calMonth === today.slice(0, 7) ? today : calMonth + '-01'; $('cal').innerHTML = calHtml(); loadMonth(calMonth); }
        else if (day) { selDay = day.dataset.day; $('cal').innerHTML = calHtml(); if ($('d') && selDay >= today) $('d').value = selDay; }
        else if (e.target.closest('#perT')) {
          const set = new Set(info.periodDays || []); if (set.has(selDay)) set.delete(selDay); else set.add(selDay);
          const before = info.periodDays; info.periodDays = [...set].sort(); $('cal').innerHTML = calHtml();
          try { info.periodDays = await rpc('kid_set_period', { p_token: token, p_days: info.periodDays }); const pc = app.querySelector('.pcard'); if (pc) pc.outerHTML = periodHtml(); }
          catch (err) { info.periodDays = before; $('cal').innerHTML = calHtml(); toast('Couldn’t save. Try again.'); }
        }
      };
    }
    if ($('ad')) $('ad').onchange = () => { $('times').style.display = $('ad').checked ? 'none' : ''; };
    $('f').onsubmit = async e => {
      e.preventDefault();
      const btn = app.querySelector('.go'), title = $('t').value.trim(); if (!title) return;
      const body = { p_token: token, p_kind: tab, p_title: title, p_notes: $('n').value.trim() };
      if (tab === 'event') Object.assign(body, { p_date: $('d').value, p_start: $('ad').checked ? '' : $('s').value, p_end: $('ad').checked ? '' : $('e').value });
      else body.p_list = aisleOf(title);
      btn.disabled = true; btn.textContent = 'Adding…';
      try {
        const r = await rpc('kid_add', body);
        call('/functions/v1/kid-notify', { token, activity: r.activity }).catch(() => {});
        toast('✓ Added! ' + (info.tell || 'Mom') + ' will see it.');
        delete monthEvents[body.p_date ? body.p_date.slice(0, 7) : calMonth];
        info = await rpc('kid_info', { p_token: token }); draw(); loadUpcoming();
      } catch (err) { btn.disabled = false; btn.textContent = tab === 'event' ? 'Add to the calendar' : 'Add to the shopping list'; toast(/date/i.test(err.message) ? 'Pick a day.' : /slow/i.test(err.message) ? 'That’s a lot! Try again later.' : 'Couldn’t add that. Try again.'); }
    };
  }
  load();
})();
</script>
<script src="../refresh.js"></script>
</body>
</html>
