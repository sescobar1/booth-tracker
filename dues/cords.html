<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ATU SNA · Cords Points</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#046A38">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-title" content="ATU SNA">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --green: #046A38; --green-dark: #034d29; --gold: #FFC72C; --gold-soft: #fff4d1; --bg: #f5f7f4; --card: #fff; --ink: #1c2a22; --muted: #5f6f66; --line: #dfe6e1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1712; --card: #17221b; --ink: #e9f1ec; --muted: #9fb3a7; --line: #26362c; --gold-soft: #3a3012; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { position: relative; background: var(--green); color: #fff; text-align: center; padding: calc(30px + env(safe-area-inset-top)) 16px 20px; border-bottom: 6px solid var(--gold); }
    header h1 { margin: 0; font-size: 2rem; letter-spacing: .04em; }
    header h1 span { color: var(--gold); }
    header p { margin: 4px 0 0; font-weight: 600; }
    main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
    .big { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .big b { font-size: 1.6rem; color: var(--green); }
    @media (prefers-color-scheme: dark) { .big b { color: var(--gold); } }
    input { width: 100%; font: inherit; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
    input:focus { outline: none; border-color: var(--gold); }
    #find { margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .chip { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 9px 16px; font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; }
    [hidden] { display: none !important; }
    .chip.on { background: var(--green); border-color: var(--green); color: #fff; }
    h2 { margin: 20px 4px 6px; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: baseline; }
    h2 small { color: var(--muted); font-weight: 600; }
    .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 2px 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .note a, .muted a { color: var(--green); font-weight: 700; }
    @media (prefers-color-scheme: dark) { .note a, .muted a { color: var(--gold); } }
    .ok { background: var(--gold); color: #1c2a22; font-weight: 800; font-size: .78rem; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
    .ok.ahead { background: var(--green); color: #fff; }
    .note { background: var(--gold-soft); border-left: 5px solid var(--gold); border-radius: 10px; padding: 12px 14px; }
    .muted { color: var(--muted); font-size: .9rem; }
    mark { background: var(--gold); color: #1c2a22; border-radius: 3px; }
      .pts { color: var(--muted); font-size: .85rem; }
    .tot { font-weight: 800; min-width: 2.2em; text-align: right; }
    .need { background: var(--line); color: var(--ink); font-weight: 700; font-size: .78rem; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
  </style>
</head>
<body>
  <header><a id="home" href="#" style="position:absolute;left:14px;top:calc(8px + env(safe-area-inset-top));color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;opacity:.9">‹ SNA home</a><h1>ATU <span>SNA</span></h1><p id="sub">Graduation cords points</p></header>
  <main id="view"><p class="muted">Loading…</p></main>
  <script src="config.js"></script>
  <script>
  // Cords points for students, by level. 5 points in total (Level 0–4) earns free cords.
  (function () {
    const CFG = window.DUES_CONFIG.sync, $ = id => document.getElementById(id), FREE = 5;
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const fold = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
    const MAIL = 'Think your points are wrong? Email Dr. Escobar at <a href="mailto:sescobar@atu.edu?subject=SNA%20cords%20points">sescobar@atu.edu</a>.';
    const token = new URLSearchParams(location.search).get('t') || '';
    if (/^[0-9a-f]{32}$/.test(token)) $('home').href = 'students.html?t=' + token; else $('home').hidden = true;
    const total = x => Math.round(Object.values(x.points || {}).reduce((t, v) => t + Number(v || 0), 0) * 100) / 100;
    let d, find = '', lvl = '';
    if (!/^[0-9a-f]{32}$/.test(token)) { $('view').innerHTML = '<div class="card">This link isn\'t complete. Ask an SNA officer for it again.</div>'; return; }
    const gradOf = l => { const k = d.term_key + (4 - l); return (k % 2 ? 'Dec ' : 'May ') + Math.floor(k / 2); };
    function draw() {
      $('find').hidden = !lvl;
      if (!lvl) { $('list').innerHTML = '<div class="note"><b>👆 Select your level</b> to see cords points.</div>'; return; }
      const L = Number(lvl), words = fold(find).split(' ').filter(Boolean);
      const xs = d.students.filter(x => x.lvl === L && words.every(w => fold(x.name).includes(w))).sort((a, b) => a.name.localeCompare(b.name));
      $('list').innerHTML = '<h2>Level ' + L + ' · Class of ' + gradOf(L) + '</h2>' +
        (xs.length ? '<div class="list">' + xs.map(x => { const t = total(x), P = x.points || {};
          const badge = x.cords === 'given' ? '<span class="ok ahead">CORDS GIVEN</span>' : t >= FREE ? '<span class="ok">FREE CORDS ✓</span>' : '<span class="need">NEEDS ' + Math.round((FREE - t) * 100) / 100 + '</span>';
          return '<div class="row"><span>' + esc(x.name) + '<br><span class="pts">' + [0, 1, 2, 3, 4].filter(k => k <= L).map(k => 'L' + k + ': ' + (P[k] != null ? P[k] : 0)).join(' · ') + '</span></span><span style="display:flex;gap:8px;align-items:center"><span class="tot">' + t + '</span>' + badge + '</span></div>'; }).join('') + '</div>'
          : '<div class="note">' + (words.length ? '<b>No match.</b> Check the spelling, or ' + MAIL.charAt(0).toLowerCase() + MAIL.slice(1) : 'No students listed for this level yet.') + '</div>');
    }
    fetch(CFG.url + '/rest/v1/rpc/dues_cords_list', { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }) })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(x => {
        if (!x) { $('view').innerHTML = '<div class="card">This link no longer works. Ask an SNA officer for the new one.</div>'; return; }
        d = x;
        $('view').innerHTML = '<h2 style="margin:4px 4px 0">Select your level</h2><div class="chips">' + [0, 1, 2, 3, 4].map(l => '<button type="button" class="chip" data-l="' + l + '">Level ' + l + '</button>').join('') + '</div>' +
          '<input type="search" id="find" placeholder="🔍 Type your name" autocomplete="off">' +
          '<div class="note"><b>Free graduation cords: ' + FREE + ' points in total</b> from Level 0 through Level 4.</div>' +
          '<p class="muted"><span class="ok" style="font-size:.7rem">FREE CORDS ✓</span> = earned · <span class="need" style="font-size:.7rem">NEEDS</span> = points still needed.<br>' + MAIL + '</p><div id="list"></div>';
        $('find').oninput = e => { find = e.target.value; draw(); };
        document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { lvl = b.dataset.l; document.querySelectorAll('[data-l]').forEach(y => y.classList.toggle('on', y === b)); draw(); });
        draw();
      })
      .catch(() => { $('view').innerHTML = '<div class="card">Couldn\'t load the list right now. Please try again in a minute.</div>'; });
  })();
  </script>
</body>
</html>
