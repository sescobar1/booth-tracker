<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SNA Dues</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#24536f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SNA Dues">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f6f4ef; --card: #fff; --ink: #1d2b33; --muted: #6b7880; --line: #e2e3dc; --navy: #24536f; --green: #2e7d4f; --green-soft: #e3f1e8; --amber: #a3620f; --amber-soft: #fbefd9; --red: #a43c2c; --red-soft: #f8e3df; --purple: #6b4fa0; --purple-soft: #ece6f7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141a1d; --card: #1e262a; --ink: #e8eef0; --muted: #9aa8ae; --line: #2f3a3f; --navy: #8cc0dd; --green: #7fd1a0; --green-soft: #1f3a2b; --amber: #f0c477; --amber-soft: #3a2f1c; --red: #f0a096; --red-soft: #3d2420; --purple: #c3b0ea; --purple-soft: #2e2840; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { background: #24536f; color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
    header .in { max-width: 820px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header small { opacity: .85; display: block; font-size: .85rem; }
    main { max-width: 820px; margin: 0 auto; padding: 14px 14px 110px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    .stat span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 700; }
    .stat b { font-size: 1.25rem; }
    .meter { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
    .meter i { display: block; height: 100%; background: var(--green); }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 6px; }
    .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 6px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
    .chip.on { background: var(--navy); color: var(--bg); border-color: var(--navy); }
    input, select, textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { font: inherit; cursor: pointer; }
    .btn { border: 0; border-radius: 10px; background: #24536f; color: #fff; padding: 10px 16px; font-weight: 700; text-decoration: none; display: inline-block; }
    .btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--line); }
    .btn.small { padding: 6px 10px; font-size: .85rem; }
    .btn:disabled { opacity: .45; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .lvlhead { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 4px 6px; }
    .lvlhead h3 { margin: 0; font-size: 1.05rem; }
    .lvlhead small { color: var(--muted); }
    .row { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-top: 1px solid var(--line); cursor: pointer; }
    .row:first-child { border-top: 0; }
    .row .who { flex: 1; min-width: 0; }
    .row .who b { display: block; overflow-wrap: anywhere; font-weight: 600; }
    .row .who small { color: var(--muted); display: block; }
    .tag { font-size: .78rem; font-weight: 700; border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
    .tag.paid { background: var(--green-soft); color: var(--green); }
    .tag.ahead { background: var(--purple-soft); color: var(--purple); }
    .tag.unpaid { background: var(--red-soft); color: var(--red); }
    .tag.grad { background: var(--line); color: var(--muted); }
    .helper { color: var(--muted); font-size: .88rem; margin: 6px 0; }
    .banner { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 10px 12px; font-size: .92rem; margin: 10px 0; }
    .modal { position: fixed; inset: 0; background: #0007; display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
    .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); }
    @media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 18px; } }
    .methods { display: flex; flex-wrap: wrap; gap: 6px; }
    .pay { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .92rem; align-items: center; }
    .pay:first-child { border-top: 0; }
    .linkbox { font-size: .82rem; word-break: break-word; background: var(--card); border: 1px dashed var(--line); padding: 8px; border-radius: 8px; white-space: pre-wrap; }
    .toast { display: flex; align-items: center; position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; z-index: 20; font-size: .92rem; max-width: 90vw; }
    .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: #24536f; color: #fff; font-size: 1.8rem; box-shadow: 0 6px 18px #0003; }
    .quick { border: 1px solid var(--line); background: var(--card); color: var(--green); border-radius: 8px; padding: 4px 8px; font-size: .8rem; font-weight: 700; }
    
    [hidden] { display: none !important; }
    .nm { padding: 1px 6px; border-radius: 5px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .nm.paid { background: #fff200; color: #1d2b33; }
    .nm.ahead { background: #d9c8f5; color: #2a1a4a; }
    .quick { padding: 8px 12px; font-size: .88rem; }
  </style>
</head>
<body>
  <header><div class="in"><div><h1>SNA Dues</h1><small id="sub">Student Nurses Association</small></div><button type="button" class="btn ghost small" id="setBtn" style="color:#fff;border-color:#ffffff66" hidden>⚙ Settings</button></div></header>
  <main id="view"><p class="helper">Loading…</p></main>
  <button type="button" class="fab" id="fab" hidden aria-label="Add a student">＋</button>
  <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script>
  // SNA Dues: students by level, which semester their dues are paid through, and who still owes.
  // Semesters are numbered year*2 + (0 spring, 1 fall). In January and August everyone moves up a level
  // on its own; Level 4 students graduate. Each student gets a private status link (status.html?t=…).
  (function () {
    const CFG = window.DUES_CONFIG.sync;
    const sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { storageKey: 'duesAuth', persistSession: true, autoRefreshToken: true } });
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const money = n => '$' + (Math.round(Number(n || 0) * 100) / 100).toFixed(2).replace(/\.00$/, '');
    const pad = n => String(n).padStart(2, '0');
    const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
    const fmtDate = iso => iso ? new Date(iso + 'T12:00').toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    // Spring runs January–July (summer counts with spring), fall runs August–December.
    const termOfDate = iso => { const [y, m] = iso.split('-').map(Number); return y * 2 + (m >= 8 ? 1 : 0); };
    const termName = k => !(k > 0) ? '—' : (k % 2 ? 'Fall ' : 'Spring ') + Math.floor(k / 2);
    const termStart = k => Math.floor(k / 2) + (k % 2 ? '-08-01' : '-01-01');
    const LEVELS = [0, 1, 2, 3, 4, -1];
    // "Paid until" labels: spring ends in May, fall ends in December. Choices run through Dec 2030.
    const until = k => (k % 2 ? 'Dec ' : 'May ') + String(Math.floor(k / 2)).slice(2);
    const LAST = 2030 * 2 + 1;
    const range = (a, b) => { const r = []; for (let k = a; k <= b; k++) r.push(k); return r; };
    const lvlName = l => l < 0 ? 'Lower division' : 'Level ' + l;
    const METHODS = ['Cash', 'Venmo', 'Cash App', 'Zelle', 'Check', 'Card', 'Other'];
    const statusBase = location.href.split('#')[0].replace(/[^/]*$/, '') + 'status.html?t=';
    const facultyBase = location.href.split('#')[0].replace(/[^/]*$/, '') + 'faculty.html?t=';
    // Send a file: on a phone this opens the share sheet (Mail, Messages…); otherwise it downloads.
    async function sendFile(name, text) {
      const file = new File(['\ufeff' + text], name, { type: 'text/csv' });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } } catch (e) { if (e.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
    }
    const csvLine = r => r.map(x => /[",\n]/.test(String(x)) ? '"' + String(x).replace(/"/g, '""') + '"' : String(x)).join(',');
    let user = null, settings = null, members = [], payments = [], filter = 'all', lvlFilter = 'all', find = '', banner = '', mode = 'dues', cFilter = 'all', classFilter = 'all';
    // Cords: up to 2 points a level; 5 or more points in all = free cords.
    const FREE = 5;
    const ptsTotal = m => Math.round(Object.values(m.points || {}).reduce((t, v) => t + Number(v || 0), 0) * 100) / 100;
    const cordsState = m => m.cords === 'given' ? { key: 'given', label: 'Cords given' } : ptsTotal(m) >= FREE ? { key: 'free', label: 'Free cords ✓' } : m.cords === 'purchase' ? { key: 'buy', label: 'Buying cords' } : { key: 'need', label: 'Needs ' + (Math.round((FREE - ptsTotal(m)) * 100) / 100) };
    // Every semester we know they paid: old lists, payments recorded here, and what's marked paid through now.
    function paidTermsOf(m) {
      const t = new Set(m.paid_terms || []);
      payments.filter(p => p.member_id === m.id && p.through_term).forEach(p => { const n = Math.max(1, Math.round(Number(p.amount) / (Number(settings.amount) || 5))); for (let k = p.through_term - n + 1; k <= p.through_term; k++) t.add(k); });
      if (m.paid_through >= cur()) for (let k = cur(); k <= m.paid_through; k++) t.add(k);
      return [...t].filter(k => k > 0).sort((a, b) => a - b);
    }
    let toastTimer;
    const toast = (m, undo) => { const t = $('toast'); t.innerHTML = esc(m) + (undo ? ' <button type="button" id="undoBtn" style="margin-left:10px;background:none;border:1px solid currentColor;color:inherit;border-radius:99px;padding:3px 10px;font-weight:700">Undo</button>' : ''); t.hidden = false; if (undo) $('undoBtn').onclick = () => { t.hidden = true; undo(); }; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 6000 : 3200); };
    const open = html => { $('sheet').innerHTML = html; $('modal').hidden = false; };
    const close = () => { $('modal').hidden = true; $('sheet').innerHTML = ''; };
    $('modal').addEventListener('click', e => { if (e.target.id === 'modal') close(); });
    const copy = async (text, msg) => { try { await navigator.clipboard.writeText(text); toast(msg || 'Copied ✓'); } catch (e) { prompt('Copy this:', text); } };
    const fail = r => { if (r.error) { toast('Could not save: ' + r.error.message); return true; } return false; };
    const firstName = n => { const p = String(n).split(','); return (p.length > 1 ? p[1] : p[0]).trim().split(/\s+/)[0] || n; };
    const cur = () => settings.term_key;

    // Paid for this semester? Purple = paid ahead past this semester.
    function stateOf(m) {
      if (!m.active) return { key: 'grad', label: m.graduated ? 'Graduated ' + m.graduated : m.left_term ? 'Left ' + m.left_term : 'Left program', owed: 0 };
      if (m.paid_through > cur()) return { key: 'ahead', label: 'Paid until ' + until(m.paid_through), owed: 0 };
      if (m.paid_through === cur()) return { key: 'paid', label: 'Paid', owed: 0 };
      return { key: 'unpaid', label: 'Unpaid', owed: Number(settings.amount) || 0 };
    }

    // ---- loading ----
    async function load() {
      const [s, m, p] = await Promise.all([
        sb.from('dues_settings').select('*').maybeSingle(),
        sb.from('dues_members').select('*').order('name'),
        sb.from('dues_payments').select('*').order('paid_on')
      ]);
      const err = [s, m, p].find(r => r.error); if (err) { toast(err.error.message); return; }
      settings = s.data || { org: 'ATU Student Nurses Association', term: '', term_key: termOfDate(today()), amount: 0, due_date: null, pay_info: '' };
      if (!s.data) await sb.from('dues_settings').upsert({ owner: user.id, ...settings });
      if (!settings.term_key) settings.term_key = termOfDate(today());
      members = m.data || []; payments = p.data || [];
      if (termOfDate(today()) > cur()) banner = 'It\'s a new semester. When you\'re ready, tap 🔄 Start ' + termName(cur() + 1) + ' to clear the list.';
      draw();
      if (!(Number(settings.amount) > 0)) editSettings(true);
    }

    // ---- start the next semester: only students paid ahead stay (and move up a level) ----
    async function startNext() {
      const from = cur(), to = from + 1, act = members.filter(m => m.active);
      const grads = act.filter(m => m.lvl === 4), keep = act.filter(m => m.lvl !== 4 && m.paid_through >= to), drop = act.filter(m => m.lvl !== 4 && m.paid_through < to);
      if (!confirm('Start ' + termName(to) + '?\n\n• ' + keep.length + ' students paid ahead stay on the list and move up a level.\n• ' + drop.length + ' others come off the list. Add them back when they pay.\n• ' + grads.length + ' Level 4 students graduate.')) return;
      const now = new Date().toISOString();
      if (grads.length && fail(await sb.from('dues_members').update({ active: false, graduated: termName(from), updated_at: now }).in('id', grads.map(m => m.id)))) return;
      if (drop.length && fail(await sb.from('dues_members').update({ active: false, graduated: '', left_term: '', updated_at: now }).in('id', drop.map(m => m.id)))) return;
      for (const l of [3, 2, 1, 0]) {
        const ids = keep.filter(m => m.lvl === l).map(m => m.id);
        if (ids.length && fail(await sb.from('dues_members').update({ lvl: l + 1, level: 'Level ' + (l + 1), updated_at: now }).in('id', ids))) return;
      }
      for (const m of act.filter(m => m.role && settings.officers_saved !== from)) {
        const h = (m.officer_history || []).filter(x => x.term !== termName(from)).concat(m.role.split(' · ').map(role => ({ term: termName(from), role })));
        if (fail(await sb.from('dues_members').update({ officer_history: h }).eq('id', m.id))) return;
        m.officer_history = h;
      }
      if (fail(await sb.from('dues_settings').update({ term_key: to, term: termName(to), due_date: null, updated_at: now }).eq('owner', user.id))) return;
      grads.forEach(m => { m.active = false; m.graduated = termName(from); });
      drop.forEach(m => { m.active = false; m.graduated = ''; });
      keep.forEach(m => { if (m.lvl >= 0) { m.lvl += 1; m.level = 'Level ' + m.lvl; } });
      settings.term_key = to; settings.due_date = null; filter = 'all';
      banner = '🔄 ' + termName(to) + ' started. ' + keep.length + ' paid-ahead students moved up a level. Add the rest as they pay with ➕ Add a student.';
      draw();
    }

    // ---- main screen ----
    function modeTabs() { return '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px">' + [['dues', '💵 Dues'], ['cords', '🎓 Cords'], ['officers', '⭐ Officers']].map(([k, l]) => '<button type="button" class="btn' + (mode === k ? '' : ' ghost') + '" data-mode="' + k + '">' + l + '</button>').join('') + '</div>'; }
    function wireModes() { document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; draw(); scrollTo(0, 0); }); }
    function draw() {
      if (mode === 'cords') return drawCords();
      if (mode === 'officers') return drawOfficers();
      $('sub').textContent = (settings.org || 'Student Nurses Association') + ' · ' + termName(cur());
      const active = members.filter(m => m.active), st = active.map(m => ({ m, s: stateOf(m) }));
      const nPaid = st.filter(x => x.s.key !== 'unpaid').length, nOwe = active.length - nPaid;
      const termPays = payments.filter(p => p.paid_on >= termStart(cur()) && termOfDate(p.paid_on) === cur());
      const collected = termPays.reduce((t, p) => t + Number(p.amount), 0);
      const q = find.toLowerCase();
      const past = filter === 'grad' || filter === 'left';
      const pool = past ? members.filter(m => !m.active && (filter === 'grad' ? !!m.graduated : !m.graduated)).map(m => ({ m, s: stateOf(m) })) : st;
      const shown = pool.filter(x => filter === 'all' || past || (filter === 'officers' ? !!x.m.role : filter === 'unpaid' ? x.s.key === 'unpaid' : x.s.key !== 'unpaid'))
        .filter(x => lvlFilter === 'all' || past || x.m.lvl === Number(lvlFilter))
        .filter(x => !q || (x.m.name + ' ' + x.m.email + ' ' + x.m.notes + ' ' + x.m.role).toLowerCase().includes(q));
      const groups = filter === 'grad' ? [...new Set(shown.map(x => x.m.graduated))].sort((a, b) => termRank(b) - termRank(a)).map(t => ['Graduated ' + t, shown.filter(x => x.m.graduated === t)]) : filter === 'left' ? [...new Set(shown.map(x => x.m.left_term || ''))].sort((a, b) => termRank(b) - termRank(a)).map(t => [t ? 'Left ' + t : 'Taken off the list (not paid at semester start)', shown.filter(x => (x.m.left_term || '') === t)]) : LEVELS.map(l => [lvlName(l), shown.filter(x => x.m.lvl === l)]).filter(g => g[1].length);
      $('view').innerHTML = modeTabs() + (banner ? '<div class="banner">' + esc(banner) + '</div>' : '') +
        '<div class="stats"><div class="stat"><span>Paid this semester</span><b style="color:var(--green)">' + nPaid + '</b><small class="helper" style="display:block;margin:0">of ' + active.length + ' on the list</small></div><div class="stat"><span>Collected in app</span><b>' + money(collected) + '</b><small class="helper" style="display:block;margin:0">' + termName(cur()) + '</small></div><div class="stat"><span>Dues</span><b>' + (settings.amount > 0 ? money(settings.amount) : '—') + '</b><small class="helper" style="display:block;margin:0">per semester</small></div></div>' +
        '<div class="meter"><i style="width:' + (active.length ? nPaid / active.length * 100 : 0) + '%"></i></div>' +
        '<div class="actions"><button type="button" class="btn" id="ciBtn">📥 Cash App import</button><button type="button" class="btn" id="paidBtn">📄 Paid list</button><button type="button" class="btn ghost" id="facBtn">🔗 Faculty link</button><button type="button" class="btn" id="rosBtn">👥 Upload student list</button><button type="button" class="btn ghost" id="addBtn">➕ Add a student</button><button type="button" class="btn ghost" id="bulkBtn">👥 Paste a list</button><button type="button" class="btn ghost" id="csvBtn">⬇ Everything</button><button type="button" class="btn ghost" id="nextBtn">🔄 Start ' + termName(cur() + 1) + '</button></div>' +
        '<div class="tabs">' + [['all', 'Everyone'], ['unpaid', 'Unpaid'], ['paid', 'Paid'], ['officers', '⭐ Officers'], ['grad', '🎓 Graduated'], ['left', '🚪 Left program']].map(([k, l]) => '<button type="button" class="chip' + (filter === k ? ' on' : '') + '" data-f="' + k + '">' + l + '</button>').join('') + '</div>' +
        (past ? '' : '<div class="tabs">' + [['all', 'All levels']].concat(LEVELS.map(l => [String(l), l < 0 ? 'Lower div.' : 'Level ' + l])).map(([k, l]) => '<button type="button" class="chip' + (lvlFilter === k ? ' on' : '') + '" data-l="' + k + '">' + l + '</button>').join('') + '</div>') +
        '<p class="helper"><b>✓ Paid</b> = this semester. <b style="color:var(--purple)">⏩</b> = more than one semester. Then tap Cash App, Cash or Check. Tap a name to edit it or change the level.</p><input type="search" id="find" placeholder="🔍 Search name, email or note" value="' + esc(find) + '">' +
        (groups.length ? groups.map(([title, xs]) => { const all = (past ? xs : st.filter(x => lvlName(x.m.lvl) === title)), paid = all.filter(x => x.s.key !== 'unpaid').length;
          return '<div class="lvlhead"><h3>' + esc(title) + '</h3><small>' + (past ? xs.length + ' students' : paid + ' of ' + all.length + ' paid') + '</small></div><div class="card" style="padding:4px 12px;margin-top:0">' +
            xs.map(({ m, s }) => '<div class="row" data-m="' + m.id + '"><div class="who"><b><span class="nm ' + s.key + '">' + esc(m.name) + '</span></b>' + (m.role ? '<small style="color:var(--navy);font-weight:600">⭐ ' + esc(m.role) + '</small>' : '') + (m.notes ? '<small>' + esc(m.notes) + '</small>' : '') + '</div>' +
              (m.active ? '<button type="button" class="quick" data-ahead="' + m.id + '" style="color:var(--purple)">⏩</button>' : '') + (s.key === 'unpaid' ? '<button type="button" class="quick" data-quick="' + m.id + '">✓ Paid</button>' : '') + '<span class="tag ' + s.key + '">' + esc(s.label) + '</span></div>').join('') + '</div>'; }).join('')
          : '<div class="card"><p class="helper">' + (members.length ? 'No students match.' : 'No students yet. Tap ＋ to add one.') + '</p></div>');
      wireModes();
      document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; draw(); });
      document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { lvlFilter = b.dataset.l; draw(); });

    async function readPdfLines(file) {

      const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise, lines = [];
      for (let p = 1; p <= doc.numPages; p++) {
        const items = (await (await doc.getPage(p)).getTextContent()).items.filter(i => i.str.trim());
        const rows = [];
        items.forEach(i => { const y = i.transform[5], x = i.transform[4]; let r = rows.find(r => Math.abs(r.y - y) < 3); if (!r) rows.push(r = { y, parts: [] }); r.parts.push({ x, s: i.str.trim() }); });
        rows.sort((a, b) => b.y - a.y).forEach(r => lines.push(r.parts.sort((a, b) => a.x - b.x).map(p => p.s).join(' ')));
      }
      return lines;
    }
    const words = s => String(s).toLowerCase().normalize('NFKD').replace(/[’']/g, '').replace(/[^a-z0-9.\s-]/g, ' ').replace(/-/g, ' ').split(/\s+/).filter(Boolean);
    function guessStudent(text, pool) {
      const w = new Set(words(text)); let best = null, bestScore = 0, tie = false;
      pool.forEach(m => {
        const [last, first = ''] = m.name.split(','); const lw = words(last.replace(/\(.*?\)/g, '')), fw = words(first.replace(/\(.*?\)/g, '')), alt = words((m.name.match(/\((.*?)\)/g) || []).join(' '));
        let s = 0;
        if (lw.length && lw.every(x => w.has(x))) s += 2; else if (alt.some(x => w.has(x))) s += 1.5; else return;
        if (fw[0] && w.has(fw[0])) s += 1; else if (fw[0] && [...w].some(x => x.length > 2 && (fw[0].startsWith(x) || x.startsWith(fw[0])))) s += 0.5;
        if (s > bestScore) { best = m; bestScore = s; tie = false; } else if (s === bestScore) tie = true;
      });

        grid.slice(hdr + 1).forEach(r => { const n = cleanName(r[ni]), l = levelFrom('level ' + String(r[li]).replace(/level/i, '').trim()) ?? levelFrom(r[li]); if (n && l !== null) out.push({ ...n, lvl: l }); });

          '<b>' + rows.length + '</b> students on the list: ' + counts.map(([l, n]) => (l < 0 ? 'Lower div. ' : 'L' + l + ' ') + n).join(' · ');
        $('rOut').innerHTML =
          sec('➕ New students', fresh.length, fresh.map((r, i) => '<div class="pay" style="flex-wrap:wrap"><span><b>' + esc(r.name) + '</b> · ' + esc(lvlName(r.lvl)) + '</span><select data-rn="' + i + '" style="max-width:100%"><option value="">Add as a new student</option>' + members.filter(m => !used.has(m.id)).sort((a, b) => a.name.localeCompare(b.name)).map(m => '<option value="' + m.id + '">Same person as ' + esc(m.name) + (m.active ? '' : ' (past)') + '</option>').join('') + '</select></div>').join('') || '<p class="helper">None</p>', fresh.length) +
          sec('🔁 Level changes', moved.length, moved.map(r => '<div class="pay"><span>' + esc(r.m.name) + '</span><span>' + esc(lvlName(r.m.lvl)) + ' → <b>' + esc(lvlName(r.lvl)) + '</b></span></div>').join('') || '<p class="helper">None</p>', moved.length && moved.length < 40) +
          (back.length ? sec('↩️ Coming back', back.length, back.map(r => '<div class="pay"><span>' + esc(r.m.name) + '</span><span>' + esc(lvlName(r.lvl)) + '</span></div>').join(''), true) : '') +
          (grads.length ? sec('🎓 Graduated (Level 4, not on the list)', grads.length, grads.map(m => '<div class="pay"><span>' + esc(m.name) + '</span></div>').join(''), false) : '') +
          sec('🚪 Left the program (not on the list)', left.length, byLvl(left).map(([l, xs]) => '<p class="helper" style="margin:8px 0 2px"><b>' + esc(lvlName(l)) + '</b></p>' + xs.map(m => '<label style="display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--ink);font-weight:400"><input type="checkbox" data-rl="' + m.id + '" checked style="width:auto">' + esc(m.name) + '</label>').join('')).join('') + (left.length ? '<p class="helper">Uncheck anyone who is still in the program but missing from the list.</p>' : '<p class="helper">None</p>'), left.length && left.length < 40) +
          '<p class="helper">' + stay.filter(r => r.m.lvl === r.lvl).length + ' students stay at the same level.' + (newSem ? ' Saving also starts ' + termName(target) + ': this semester\'s officers are saved to history, and only students paid ahead show as paid.' : '') + '</p>' +
          '<div class="actions"><button type="button" class="btn" id="rSave">Save</button></div>';
        document.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { si = Number(b.dataset.rs); review(); });
        $('rSave').onclick = async () => {
          $('rSave').disabled = true; $('rSave').textContent = 'Saving…';
          const now = new Date().toISOString(), from = cur();
          fresh.forEach((r, i) => { const id = document.querySelector('[data-rn="' + i + '"]').value; if (id) { r.m = members.find(m => m.id === id); r.back = !r.m.active; } });
          const keepIds = new Set(rows.filter(r => r.m).map(r => r.m.id));
          const leaving = left.filter(m => !keepIds.has(m.id) && document.querySelector('[data-rl="' + m.id + '"]')?.checked);
          if (newSem) {
            for (const m of members.filter(m => m.active && m.role && settings.officers_saved !== from)) {
              const h = (m.officer_history || []).filter(x => x.term !== termName(from)).concat(m.role.split(' · ').map(role => ({ term: termName(from), role })));
              if (fail(await sb.from('dues_members').update({ officer_history: h }).eq('id', m.id))) return; m.officer_history = h;
            }
          }
          // levels for everyone on the list (grouped so it's a few saves, not hundreds)
          for (const l of LEVELS) {
            const ids = rows.filter(r => r.m && r.lvl === l && (r.m.lvl !== l || !r.m.active)).map(r => r.m.id);
            if (ids.length && fail(await sb.from('dues_members').update({ lvl: l, level: lvlName(l), active: true, graduated: '', left_term: '', updated_at: now }).in('id', ids))) return;
            rows.filter(r => r.m && r.lvl === l).forEach(r => Object.assign(r.m, { lvl: l, level: lvlName(l), active: true, graduated: '', left_term: '' }));
          }
          const adds = rows.filter(r => !r.m).map(r => ({ owner: user.id, name: r.name, lvl: r.lvl, level: lvlName(r.lvl), notes: r.note ? 'From list: ' + r.note : '' }));
          if (adds.length) { const r = await sb.from('dues_members').insert(adds).select(); if (fail(r)) return; members = members.concat(r.data); }
          if (grads.length && !grads.some(m => keepIds.has(m.id))) { if (fail(await sb.from('dues_members').update({ active: false, graduated: termName(from), updated_at: now }).in('id', grads.map(m => m.id)))) return; grads.forEach(m => Object.assign(m, { active: false, graduated: termName(from) })); }
          if (leaving.length) { if (fail(await sb.from('dues_members').update({ active: false, graduated: '', left_term: termName(target), updated_at: now }).in('id', leaving.map(m => m.id)))) return; leaving.forEach(m => Object.assign(m, { active: false, graduated: '', left_term: termName(target) })); }
          if (newSem) { if (fail(await sb.from('dues_settings').update({ term_key: target, term: termName(target), due_date: null, updated_at: now }).eq('owner', user.id))) return; settings.term_key = target; settings.due_date = null; }
          members.sort((a, b) => a.name.localeCompare(b.name));
          banner = '👥 ' + termName(cur()) + ' list loaded: ' + rows.length + ' students · ' + adds.length + ' new · ' + moved.length + ' changed level' + (grads.length ? ' · ' + grads.length + ' graduated' : '') + ' · ' + leaving.length + ' moved to Left the program.';
          close(); filter = 'all'; mode = 'dues'; draw(); scrollTo(0, 0);
        };
      }
      wire();
    }

    // ---- one student ----
    function showMember(id) {
      const m = members.find(x => x.id === id); if (!m) return;
      const s = stateOf(m), mine = payments.filter(p => p.member_id === id), link = statusBase + m.token;
      open('<div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div><h2 style="margin:0">' + esc(m.name) + '</h2><p class="helper" style="margin:2px 0">' + esc(lvlName(m.lvl)) + '</p>' + (m.role ? '<p style="margin:2px 0;color:var(--navy);font-weight:700">⭐ ' + esc(m.role) + '</p>' : '') + ((m.officer_history || []).length ? '<p class="helper" style="margin:2px 0">Past: ' + esc(m.officer_history.map(h => h.role + ' (' + h.term + ')').join(' · ')) + '</p>' : '') + '</div><span class="tag ' + s.key + '">' + esc(s.label) + '</span></div>' +
        (m.notes ? '<p class="helper">📝 ' + esc(m.notes) + '</p>' : '') +
        (m.phone || m.email ? '<div class="actions" style="margin-top:6px">' + (m.phone ? '<a class="btn ghost small" href="tel:' + esc(m.phone.replace(/[^\d+]/g, '')) + '">📞 ' + esc(m.phone) + '</a><a class="btn ghost small" href="sms:' + esc(m.phone.replace(/[^\d+]/g, '')) + '">💬 Text</a>' : '') + (m.email ? '<a class="btn ghost small" href="mailto:' + esc(m.email) + '">✉ ' + esc(m.email) + '</a>' : '') + '</div>' : '') +
        (() => { const t = paidTermsOf(m); return '<div class="card"><h2>Dues history</h2>' + (t.length ? '<div class="methods">' + t.map(k => '<span class="tag ' + (k > cur() ? 'ahead' : 'paid') + '">' + termName(k) + ' ✓</span>').join('') + '</div>' : '<p class="helper" style="margin:0">No paid semesters on record.</p>') + '</div>'; })() +
        (() => { const c = cordsState(m), P = m.points || {}; return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">🎓 Cords · ' + ptsTotal(m) + ' points</h2><span class="tag ' + (c.key === 'need' ? 'unpaid' : c.key === 'buy' ? 'grad' : 'paid') + '">' + esc(c.label) + '</span></div><p class="helper" style="margin:6px 0">' + [0, 1, 2, 3, 4].map(l => 'L' + l + ': ' + (P[l] != null ? P[l] : '–')).join(' · ') + '</p><button type="button" class="btn ghost small" id="mCords">Edit points</button></div>'; })() +
        (m.active ? '<div class="actions"><button type="button" class="btn" id="mPay">💵 Record a payment</button></div>' +
          '<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px"><button type="button" class="btn ghost small" id="lvDown"' + (m.lvl <= -1 ? ' disabled' : '') + '>⬇ Back a level</button><b>' + esc(lvlName(m.lvl)) + '</b><button type="button" class="btn ghost small" id="lvUp"' + (m.lvl >= 4 ? ' disabled' : '') + '>⬆ Up a level</button></div>' : '') +
        '<div class="card"><h2>Payments recorded here</h2>' + (mine.length ? mine.map(p => '<div class="pay"><span>' + esc(fmtDate(p.paid_on)) + ' · ' + esc(p.method || '—') + (p.receipt ? ' · #' + esc(String(p.receipt).replace(/^#/, '')) : '') + (p.through_term ? '<br><small class="helper">through ' + termName(p.through_term) + '</small>' : '') + (p.note ? '<br><small class="helper">' + esc(p.note) + '</small>' : '') + '</span><span><b>' + money(p.amount) + '</b> <button type="button" class="btn ghost small" data-delpay="' + p.id + '" aria-label="Delete payment">✕</button></span></div>').join('') : '<p class="helper">None yet' + (m.paid_through >= cur() ? ' — marked paid from your Fall 2026 list.' : '.') + '</p>') + '</div>' +
        '<div class="card"><h2>Private status link</h2><p class="helper">Send this to ' + esc(firstName(m.name)) + '. They can check their own dues any time; it shows nothing about anyone else.</p><div class="linkbox">' + esc(link) + '</div>' +
        '<div class="actions"><button type="button" class="btn ghost small" id="lCopy">Copy link</button>' + '</div></div>' +
        '<div class="actions"><button type="button" class="btn ghost" id="mEdit">✏️ Edit name &amp; info</button><button type="button" class="btn ghost" id="mAct">' + (m.active ? 'Remove from roster' : 'Put back on roster') + '</button><button type="button" class="btn ghost" id="mClose">Close</button></div>');
      if ($('mPay')) $('mPay').onclick = () => payForm(id);
      document.querySelectorAll('[data-delpay]').forEach(b => b.onclick = async () => {
        if (!confirm('Delete this payment? Their "paid through" semester stays as it is; change it with Edit if needed.')) return;
        if (fail(await sb.from('dues_payments').delete().eq('id', b.dataset.delpay))) return;
        payments = payments.filter(p => p.id !== b.dataset.delpay); draw(); showMember(id);
      });
      $('lCopy').onclick = () => copy(link, 'Link copied ✓');
      $('mEdit').onclick = () => editMember(m);
      $('mCords').onclick = () => cordsEditor(id, () => showMember(id));
      const step = async d => {
        const lvl = m.lvl + d; if (lvl < -1 || lvl > 4) return;
        if (fail(await sb.from('dues_members').update({ lvl, level: lvlName(lvl), updated_at: new Date().toISOString() }).eq('id', id))) return;
        m.lvl = lvl; m.level = lvlName(lvl); draw(); showMember(id); toast(firstName(m.name) + ' is now ' + lvlName(lvl));
      };
      if ($('lvDown')) { $('lvDown').onclick = () => step(-1); $('lvUp').onclick = () => step(1); }
      $('mClose').onclick = close;
      $('mAct').onclick = async () => {
        const row = { active: !m.active, graduated: '' };
        if (fail(await sb.from('dues_members').update(row).eq('id', id))) return;
        Object.assign(m, row); close(); draw(); toast(m.active ? 'Back on the roster' : 'Removed from the roster');
      };
    }

    // ---- download ----
    function csv() {
      const rows = members.slice().sort((a, b) => (a.active === b.active ? 0 : a.active ? -1 : 1) || LEVELS.indexOf(a.lvl) - LEVELS.indexOf(b.lvl) || a.name.localeCompare(b.name));
      const lines = [['Name', 'Level', 'Officer role', 'Status ' + termName(cur()), 'Paid through', 'Semesters paid', 'Cords points', 'Email', 'Phone', 'Notes', 'Payments']].concat(rows.map(m => [m.name, m.active ? lvlName(m.lvl) : (m.graduated ? 'Graduated ' + m.graduated : 'Removed'), m.role || '', stateOf(m).label, termName(m.paid_through), paidTermsOf(m).map(termName).join('; '), ptsTotal(m), m.email, m.phone, m.notes,
        payments.filter(p => p.member_id === m.id).map(p => p.paid_on + ' ' + money(p.amount) + (p.method ? ' ' + p.method : '') + (p.receipt ? ' #' + p.receipt : '')).join('; ')]));
      sendFile('SNA dues ' + termName(cur()) + ' (all).csv', lines.map(csvLine).join('\n'));
    }
    function paidList() {
      const paid = members.filter(m => m.active && m.paid_through >= cur()).sort((a, b) => LEVELS.indexOf(a.lvl) - LEVELS.indexOf(b.lvl) || a.name.localeCompare(b.name));
      if (!paid.length) { toast('No one has paid yet this semester.'); return; }
      const lines = [[(settings.org || 'SNA') + ' dues paid · ' + termName(cur())], ['Level', 'Name', 'Paid until']].concat(paid.map(m => [lvlName(m.lvl), m.name, until(m.paid_through)]));
      lines.push([], ['Total paid', paid.length]);
      sendFile('SNA dues paid ' + termName(cur()) + '.csv', lines.map(csvLine).join('\n'));
    }
    function facultyLink() {
      const link = facultyBase + settings.faculty_token;
      open('<h2>🔗 Faculty link</h2><p class="helper">Faculty can open this without a password. It shows each student\'s name, level and whether they\'ve paid, and has a Paid list download. It doesn\'t show notes, emails or payment details, and they can\'t change anything.</p>' +
        '<div class="linkbox">' + esc(link) + '</div><div class="actions"><button type="button" class="btn small" id="fCopy">Copy link</button><a class="btn ghost small" href="' + esc(link) + '" target="_blank" rel="noopener">Open it</a></div>' +
        '<p class="helper" style="margin-top:16px">If the link gets passed around too far, make a new one. The old link stops working.</p><button type="button" class="btn ghost small" id="fNew">Make a new link</button>' +
        '<div class="actions"><button type="button" class="btn ghost" id="fClose">Close</button></div>');
      $('fCopy').onclick = () => copy(link, 'Faculty link copied ✓');
      $('fClose').onclick = close;
      $('fNew').onclick = async () => {
        if (!confirm('Make a new faculty link? The old one will stop working.')) return;
        const t = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
        if (fail(await sb.from('dues_settings').update({ faculty_token: t }).eq('owner', user.id))) return;
        settings.faculty_token = t; facultyLink(); toast('New link made ✓');
      };
    }

    // ---- sign in ----
    function signInView() {
      $('view').innerHTML = '<div class="card"><h2>Sign in</h2><p class="helper">Use the same email and password as your Booth Tracker and Money apps.</p>' +
        '<label>Email<input id="iEmail" type="email" autocomplete="username"></label><label>Password<input id="iPass" type="password" autocomplete="current-password"></label>' +
        '<div class="actions"><button type="button" class="btn" id="iGo">Sign in</button></div><p class="helper" id="iMsg"></p></div>';
      $('iGo').onclick = async () => {
        $('iMsg').textContent = 'Signing in…';
        const r = await sb.auth.signInWithPassword({ email: $('iEmail').value.trim(), password: $('iPass').value });
        if (r.error) { $('iMsg').textContent = r.error.message; return; }
        start(r.data.session.user);
      };
    }
    function start(u) { user = u; $('setBtn').hidden = false; $('fab').hidden = false; load(); }
    $('setBtn').onclick = () => editSettings(false);
    $('fab').onclick = () => editMember(null);
    sb.auth.getSession().then(({ data }) => data.session ? start(data.session.user) : signInView());
    window.__dues = { termOfDate, termName };
  })();
  </script>
</body>
</html>
