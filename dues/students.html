<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ATU SNA</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#046A38">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --green: #046A38; --green-dark: #034d29; --gold: #FFC72C; --gold-soft: #fff4d1; --bg: #f5f7f4; --card: #fff; --ink: #1c2a22; --muted: #5f6f66; --line: #dfe6e1; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1712; --card: #17221b; --ink: #e9f1ec; --muted: #9fb3a7; --line: #26362c; --gold-soft: #3a3012; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--green); color: #fff; text-align: center; padding: calc(22px + env(safe-area-inset-top)) 16px 20px; border-bottom: 6px solid var(--gold); }
    header h1 { margin: 0; font-size: 2rem; letter-spacing: .04em; }
    header h1 span { color: var(--gold); }
    header p { margin: 4px 0 0; font-weight: 600; }
    main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
    .big { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .big b { font-size: 1.6rem; color: var(--green); }
    @media (prefers-color-scheme: dark) { .big b { color: var(--gold); } }
    input { width: 100%; font: inherit; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
    input:focus { outline: none; border-color: var(--gold); }
    #find { margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .chip { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 9px 16px; font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; }
    [hidden] { display: none !important; }
    .chip.on { background: var(--green); border-color: var(--green); color: #fff; }
    h2 { margin: 20px 4px 6px; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: baseline; }
    h2 small { color: var(--muted); font-weight: 600; }
    .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 2px 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .note a, .muted a { color: var(--green); font-weight: 700; }
    @media (prefers-color-scheme: dark) { .note a, .muted a { color: var(--gold); } }
    .ok { background: var(--gold); color: #1c2a22; font-weight: 800; font-size: .78rem; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
    .ok.ahead { background: var(--green); color: #fff; }
    .note { background: var(--gold-soft); border-left: 5px solid var(--gold); border-radius: 10px; padding: 12px 14px; }
    .muted { color: var(--muted); font-size: .9rem; }
    mark { background: var(--gold); color: #1c2a22; border-radius: 3px; }
      .tile { display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--gold); border-radius: 14px; padding: 16px; margin: 12px 0; }
    .tile:active { transform: scale(.99); }
    .tile .ic { font-size: 1.9rem; width: 2.2rem; text-align: center; }
    .tile b { display: block; font-size: 1.08rem; color: var(--green); }
    @media (prefers-color-scheme: dark) { .tile b { color: var(--gold); } }
    .tile .go { margin-left: auto; color: var(--muted); font-size: 1.4rem; }
    .tile.hot { border-left-color: var(--green); background: var(--gold-soft); }
    .role { color: var(--muted); font-size: .88rem; }
  </style>
</head>
<body>
  <header><h1>ATU <span>SNA</span></h1><p id="sub">Student Nurses Association</p></header>
  <main id="view"><p class="muted">Loading…</p></main>
  <script src="config.js"></script>
  <script>
  // One page for SNA students: dues, cords points, the officer election, and who the officers are.
  (function () {
    const CFG = window.DUES_CONFIG.sync, $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const money = n => '$' + (Math.round(Number(n || 0) * 100) / 100).toFixed(2).replace(/\.00$/, '');
    const token = new URLSearchParams(location.search).get('t') || '';
    const ORDER = ['vice president', 'president', 'secretary', 'treasurer', 'level 0', 'level 1', 'level 2', 'level 3', 'level 4', 'fundraising', 'curriculum', 'welfare', 'recognition'];
    const rank = r => { const s = String(r).toLowerCase(), i = ORDER.findIndex(x => s.includes(x)); return i < 0 ? 99 : i === 0 ? 1.5 : i; };
    if (!/^[0-9a-f]{32}$/.test(token)) { $('view').innerHTML = '<div class="card">This link isn\'t complete. Ask an SNA officer for it again.</div>'; return; }
    const tile = (href, ic, title, text, hot) => '<a class="tile' + (hot ? ' hot' : '') + '" href="' + href + '"><span class="ic">' + ic + '</span><span><b>' + title + '</b><span class="muted">' + text + '</span></span><span class="go">›</span></a>';
    fetch(CFG.url + '/rest/v1/rpc/dues_hub', { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }) })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => {
        if (!d) { $('view').innerHTML = '<div class="card">This link no longer works. Ask an SNA officer for the new one.</div>'; return; }
        $('sub').textContent = 'Student Nurses Association · ' + d.term;
        const e = d.election, offs = (d.officers || []).slice().sort((a, b) => rank(a.role) - rank(b.role) || a.name.localeCompare(b.name));
        $('view').innerHTML =
          '<div class="note"><b>Dues: ' + (Number(d.amount) > 0 ? money(d.amount) + ' per semester' : 'see an officer') + '</b>' + (d.pay_info ? '<br>Pay with ' + esc(d.pay_info.replace(/^./, c => c.toLowerCase())) : '') + '</div>' +
          (e ? tile('elect.html?t=' + encodeURIComponent(e.token), '🗳', e.phase === 'voting' ? 'Vote for SNA officers' : 'Run for an SNA office', esc(e.title) + (e.phase === 'voting' ? ' · voting is open now' : ' · sign-ups are open now'), true) : '') +
          tile('paid.html?t=' + token, '💵', 'Dues paid list', 'Check that you\'re marked paid for ' + esc(d.term)) +
          tile('cords.html?t=' + token, '🎓', 'Graduation cords points', 'Your points by level · 5 points = free cords') +
          (offs.length ? '<h2>Your SNA officers</h2><div class="list">' + offs.map(o => '<div class="row"><span>' + esc(o.name) + '</span><span class="role" style="text-align:right">' + esc(o.role) + '</span></div>').join('') + '</div>' : '') +
          '<p class="muted" style="margin-top:18px">Questions? Email Dr. Escobar at <a href="mailto:sescobar@atu.edu?subject=SNA">sescobar@atu.edu</a>.</p>';
      })
      .catch(() => { $('view').innerHTML = '<div class="card">Couldn\'t load right now. Please try again in a minute.</div>'; });
  })();
  </script>
</body>
</html>
