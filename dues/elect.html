<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SNA Officer Election</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#24536f">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f6f4ef; --card: #fff; --ink: #1d2b33; --muted: #6b7880; --line: #e2e3dc; --navy: #24536f; --green: #2e7d4f; --green-soft: #e3f1e8; --red: #a43c2c; --red-soft: #f8e3df; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141a1d; --card: #1e262a; --ink: #e8eef0; --muted: #9aa8ae; --line: #2f3a3f; --navy: #8cc0dd; --green: #7fd1a0; --green-soft: #1f3a2b; --red: #f0a096; --red-soft: #3d2420; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { background: #24536f; color: #fff; padding: calc(16px + env(safe-area-inset-top)) 16px 16px; text-align: center; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header small { opacity: .85; }
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
    [hidden] { display: none !important; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; }
    label { display: block; font-size: .88rem; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
    input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { border: 0; border-radius: 12px; background: #24536f; color: #fff; padding: 14px 18px; font: inherit; font-weight: 700; width: 100%; margin-top: 14px; cursor: pointer; }
    .btn:disabled { opacity: .5; }
    .muted { color: var(--muted); font-size: .9rem; }
    .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; cursor: pointer; }
    .opt input { width: auto; margin-top: 4px; }
    .opt.on { border-color: var(--navy); box-shadow: 0 0 0 1px var(--navy) inset; }
    .msg { border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-weight: 600; }
    .msg.ok { background: var(--green-soft); color: var(--green); }
    .msg.bad { background: var(--red-soft); color: var(--red); }
    .cand { padding: 6px 0; border-top: 1px solid var(--line); }
    .cand:first-of-type { border-top: 0; }
  </style>
</head>
<body>
  <header><h1 id="title">SNA Officer Election</h1><small id="org">Student Nurses Association</small></header>
  <main id="view"><p class="muted">Loading…</p></main>
  <script src="config.js"></script>
  <script>
  // Students run for an office (nominations), then vote (voting). The server checks each name against the SNA list.
  (function () {
    const CFG = window.DUES_CONFIG.sync, $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const token = new URLSearchParams(location.search).get('t') || '';
    const rpc = (fn, body) => fetch(CFG.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    const show = html => { $('view').innerHTML = html; };
    const LEVELS = [['0', 'Level 0'], ['1', 'Level 1'], ['2', 'Level 2'], ['3', 'Level 3'], ['4', 'Level 4'], ['-1', 'Lower division']];
    const who = () => '<div class="grid2"><label>First name<input id="f" autocomplete="given-name" autocapitalize="words"></label><label>Last name<input id="l" autocomplete="family-name" autocapitalize="words"></label></div>' +
      '<label>Your level this semester<select id="v"><option value="">Pick your level…</option>' + LEVELS.map(([k, l]) => '<option value="' + k + '">' + l + '</option>').join('') + '</select></label>';
    const contact = () => '<div class="grid2"><label>Cell phone<input id="ph" type="tel" autocomplete="tel" placeholder="479-555-1234"></label><label>ATU email<input id="em" type="email" autocomplete="email" placeholder="you@atu.edu"></label></div>';
    const contactBad = () => !/^[^\s@]+@atu\.edu$/i.test($('em').value.trim()) ? 'Enter your ATU email (ending in @atu.edu).' : $('ph').value.replace(/\D/g, '').length < 10 ? 'Enter your cell phone number with area code.' : '';
    const me = () => ({ p_first: $('f').value.trim(), p_last: $('l').value.trim(), p_lvl: $('v').value === '' ? null : Number($('v').value) });
    const note = (ok, text) => '<div class="msg ' + (ok ? 'ok' : 'bad') + '">' + esc(text) + '</div>';
    if (!/^[0-9a-f]{32}$/.test(token)) { show('<div class="card"><p>This link isn\'t complete. Ask an SNA officer for it again.</p></div>'); return; }
    rpc('elect_info', { p_token: token }).then(d => {
      if (!d) { show('<div class="card"><p>This election isn\'t open yet, or the link has changed. Ask an SNA officer.</p></div>'); return; }
      $('title').textContent = d.title || 'SNA Officer Election'; if (d.org) $('org').textContent = d.org;
      const byPos = p => d.candidates.filter(c => c.position === p);
      const intro = d.intro ? '<div class="card"><p style="margin:0;white-space:pre-wrap">' + esc(d.intro) + '</p></div>' : '';
      const shift = Number(d.shift) || 0, soon = l => l + shift;
      const forLvl = (p, lvl) => p.level == null || p.level === '' || lvl === null || Number(p.level) === soon(lvl);
      const tagLvl = p => p.level != null && p.level !== '' ? ' <span class="muted">· ' + (shift ? 'for students in Level ' + p.level + ' in ' + esc(d.term) : 'Level ' + p.level + ' only') + '</span>' : '';
      const shiftNote = shift ? ' Pick the level you\'re in <b>now</b>; level positions are for the level you\'ll be in during ' + esc(d.term) + '.' : '';
      if (d.phase === 'nominations') {
        show(intro + '<div class="card"><h2>🙋 Sign up for an SNA position</h2><p class="muted">You can sign up for more than one position; submit once for each.' + shiftNote + (d.paid_only ? ' You need to have paid this semester\'s SNA dues.' : '') + '</p>' + who() +
          contact() +
          '<label>Position<select id="p"></select></label><p class="muted" id="pd" style="margin:6px 0 0"></p>' +
          '<label>Why you\'d be great (optional)<textarea id="s" rows="3" maxlength="400" placeholder="A sentence or two for your classmates"></textarea></label>' +
          '<button type="button" class="btn" id="go">Sign me up</button><div id="out"></div></div>' +
          '<div class="card"><h2>Positions</h2>' + d.positions.map(p => '<details style="margin:8px 0"><summary><b>' + esc(p.name) + '</b>' + tagLvl(p) + (p.seats > 1 ? ' <span class="muted">(' + p.seats + ' spots)</span>' : '') + '</summary><p class="muted" style="margin:6px 0">' + esc(p.desc || '') + '</p><p class="muted" style="margin:0">Signed up: ' + (byPos(p.name).map(c => esc(c.name)).join(', ') || 'no one yet') + '</p></details>').join('') + '</div>');
        const fill = () => {
          const lvl = $('v').value === '' ? null : Number($('v').value), was = $('p').value;
          $('p').innerHTML = '<option value="">Pick a position…</option>' + d.positions.filter(p => forLvl(p, lvl)).map(p => '<option' + (p.name === was ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
          desc();
        };
        const desc = () => { const p = d.positions.find(x => x.name === $('p').value); $('pd').textContent = p ? p.desc || '' : ''; };
        $('v').onchange = fill; $('p').onchange = desc; fill();
        $('go').onclick = async () => {
          const b = me(); if (!b.p_first || !b.p_last || b.p_lvl === null || !$('p').value) { $('out').innerHTML = note(false, 'Fill in your name, level and a position.'); return; }
          if (contactBad()) { $('out').innerHTML = note(false, contactBad()); return; }
          $('go').disabled = true;
          try { const r = await rpc('elect_signup', { ...b, p_position: $('p').value, p_statement: $('s').value.trim(), p_phone: $('ph').value.trim(), p_email: $('em').value.trim() }); $('out').innerHTML = note(r.ok, r.msg); if (r.ok) { $('p').value = ''; $('s').value = ''; desc(); } }
          catch (e) { $('out').innerHTML = note(false, 'Something went wrong. Please try again.'); }
          $('go').disabled = false;
        };
      } else if (d.phase === 'voting') {
        show(intro + '<div class="card"><h2>🗳 Vote for your SNA officers</h2><p class="muted">One ballot per student. Pick your level first; level positions are voted on by that level only.' + shiftNote + (d.paid_only ? ' You need to have paid this semester\'s SNA dues.' : '') + '</p>' + who() + contact() + '</div>' +
          d.positions.map(p => { const cs = byPos(p.name), seats = Math.max(1, Number(p.seats) || 1);
            return '<div class="card" data-pos="' + esc(p.name) + '" data-lvl="' + (p.level == null ? '' : p.level) + '" data-seats="' + seats + '"><h2>' + esc(p.name) + tagLvl(p) + '</h2><p class="muted" style="margin:0 0 6px">' + (seats > 1 ? 'Pick up to ' + seats : 'Pick one') + '</p>' +
              (cs.length ? cs.map(c => '<label class="opt"><input type="' + (seats > 1 ? 'checkbox' : 'radio') + '" name="' + esc(p.name) + '" value="' + c.id + '"><span><b style="color:var(--ink)">' + esc(c.name) + '</b>' + (c.statement ? '<br><span class="muted" style="font-weight:400">' + esc(c.statement) + '</span>' : '') + '</span></label>').join('') : '<p class="muted">No one is running.</p>') + '</div>'; }).join('') +
          '<button type="button" class="btn" id="go">Submit my vote</button><div id="out"></div>');
        const showFor = () => { const lvl = $('v').value === '' ? null : Number($('v').value); document.querySelectorAll('[data-pos]').forEach(c => { const ok = c.dataset.lvl === '' || (lvl !== null && Number(c.dataset.lvl) === soon(lvl)); c.hidden = !ok; if (!ok) c.querySelectorAll('input').forEach(i => { i.checked = false; }); }); };
        $('v').onchange = showFor; showFor();
        document.querySelectorAll('[data-pos]').forEach(card => {
          const seats = Number(card.dataset.seats);
          card.querySelectorAll('input').forEach(i => i.onchange = () => {
            const on = [...card.querySelectorAll('input:checked')];
            if (on.length > seats) { i.checked = false; return; }
            card.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
          });
        });
        $('go').onclick = async () => {
          const b = me(); if (!b.p_first || !b.p_last || b.p_lvl === null) { $('out').innerHTML = note(false, 'Fill in your name and level at the top.'); return; }
          if (contactBad()) { $('out').innerHTML = note(false, contactBad()); return; }
          const votes = {}; document.querySelectorAll('[data-pos]:not([hidden])').forEach(card => { const v = [...card.querySelectorAll('input:checked')].map(i => i.value); if (v.length) votes[card.dataset.pos] = v; });
          if (!Object.keys(votes).length) { $('out').innerHTML = note(false, 'Pick at least one candidate.'); return; }
          $('go').disabled = true;
          try { const r = await rpc('elect_ballot', { ...b, p_phone: $('ph').value.trim(), p_email: $('em').value.trim(), p_votes: votes }); $('out').innerHTML = note(r.ok, r.msg); if (r.ok) { document.querySelectorAll('input').forEach(i => i.disabled = true); $('go').style.display = 'none'; } else $('go').disabled = false; }
          catch (e) { $('out').innerHTML = note(false, 'Something went wrong. Please try again.'); $('go').disabled = false; }
        };
      } else {
        show('<div class="card"><h2>Voting is closed</h2><p>Thank you for taking part! Your new officers will be announced soon.</p></div>');
      }
    }).catch(() => show('<div class="card"><p>Couldn\'t load the election right now. Please try again in a minute.</p></div>'));
  })();
  </script>
</body>
</html>
