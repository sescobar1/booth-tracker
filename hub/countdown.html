<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown</title><link rel="stylesheet" href="style.css">
<style>.cd{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}.cd:last-child{border-bottom:0}
.n{min-width:58px;text-align:center;font-size:28px;line-height:1}.n small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.t{flex:1;font-size:15px}.t small{display:block;color:var(--muted);font-size:12px}.x{opacity:0;font-size:14px;color:var(--muted)}.cd:hover .x{opacity:1}
.add{display:none;gap:6px;margin-top:10px;flex-wrap:wrap}.add.on{display:flex}.add input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;flex:1;min-width:110px}</style></head><body><div class="card">
<h1>Countdown <button id="plus" title="Add a date">+</button></h1>
<div id="list"></div>
<form class="add" id="add"><input id="nm" placeholder="What" required><input id="dt" type="date" required><button class="btn">Add</button></form>
</div><script>
const KEY = 'hubCountdown';
const START = [['State Marching', '2026-11-05'], ['Thanksgiving', '2026-11-26'], ['Last day of fall semester', '2026-12-11'], ['Christmas', '2026-12-25']];
let list; try { list = JSON.parse(localStorage.getItem(KEY)) || START; } catch (e) { list = START; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function draw() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const rows = list.map((x, i) => ({ name: x[0], date: x[1], i, days: Math.round((new Date(x[1] + 'T00:00') - today) / 864e5) })).filter(x => x.days >= 0).sort((a, b) => a.days - b.days);
  document.getElementById('list').innerHTML = rows.length ? rows.map(r => '<div class="cd"><div class="n">' + (r.days || '🎉') + '<small>' + (r.days === 0 ? 'today' : r.days === 1 ? 'day' : 'days') + '</small></div><div class="t">' + esc(r.name) +
    '<small>' + new Date(r.date + 'T12:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + '</small></div><button class="x" data-i="' + r.i + '" title="Remove">✕</button></div>').join('') : '<p class="muted small">Tap + to add a date.</p>';
}
document.getElementById('plus').onclick = () => document.getElementById('add').classList.toggle('on');
document.getElementById('add').onsubmit = e => { e.preventDefault(); list.push([document.getElementById('nm').value.trim(), document.getElementById('dt').value]); save(); e.target.reset(); e.target.classList.remove('on'); draw(); };
document.getElementById('list').onclick = e => { const b = e.target.closest('.x'); if (b) { list.splice(+b.dataset.i, 1); save(); draw(); } };
draw(); setInterval(draw, 60 * 60000);
</script></body></html>
