<style>

.fth{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 4px}.care{margin-top:2px}.cr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px;color:#7a8c74;min-height:36px}.tm2{font-family:var(--hand);font-size:17px;color:var(--ink2);border:0;border-bottom:1px dashed #c9c0ad;background:transparent;padding:0 2px;width:112px}.hrs{font-size:15px;background:#e9e3f3;color:#5b4e7a;border-radius:12px;padding:0 9px;line-height:24px}.sc{font-size:19px;line-height:1;width:34px;height:34px;border-radius:50%;border:1.5px dashed #d6cdbb;background:#fffaf0;cursor:pointer;padding:0}.sc.on{border:2px solid #7d9178;background:#eef3ea;transform:scale(1.1)}.stp{width:90px;display:inline-block;border-bottom:1px dashed #c9c0ad;height:28px;font-size:17px}.fb.hd.on{border-color:#d9675f;background:#fbe7e4}.pray{margin:0 0 16px}.pr{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:32px;font-size:18px;line-height:22px}.pr small{font-size:13px;color:#9a8f7a}.pr>span:last-child{display:flex;gap:6px;flex:0 0 auto}.pr.ans>span:first-child{color:#7d9178}.mtl{font-size:17px;margin:0;line-height:26px}.mtl b{font-weight:400;font-size:19px}.mtl small{color:#8a8f86;font-size:13px}.mtl .sep{color:#c9c0ad;margin:0 7px}
.trk{margin-top:16px;background:#fffaf0;border-radius:8px;padding:12px 16px 4px;box-shadow:0 4px 12px #00000014;font-family:var(--hand);color:var(--ink2);font-size:20px;line-height:32px}.trk h3{font-family:var(--hand);font-weight:400;font-size:22px;margin:0 0 8px}.tcols{columns:3 320px;column-gap:14px}.tc{break-inside:avoid;background:var(--paper);border:1px solid #ece4d3;border-radius:6px;padding:4px 14px 10px;margin:0 0 14px;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 22px}.tc>.lbl:first-child,.tc>.cece>.lbl:first-child,.tc>.thrift>.lbl:first-child{margin-top:4px!important}.tc .cece,.tc .thrift,.tc .pray{margin-bottom:0}.tc .fr.tr{grid-template-columns:minmax(120px,1fr) auto auto}.tc .fr:not(.tr){grid-template-columns:62px 1fr;row-gap:0}.tc .fr:not(.tr) .fw{flex-wrap:nowrap}.tc .fr:not(.tr) .fl{grid-column:2;line-height:16px;margin:-2px 0 6px}</style>
<script src="../config.js"></script><script src="../vendor/supabase.js"></script><script src="data.js?v=5"></script><script src="cal.js"></script></head><body><div class="wrap">
<div class="top"><h1>My Journal</h1><div class="nav"><button id="prev" title="Day before">‹</button><button id="tdy">Today</button><button id="next" title="Next day">›</button></div></div>
<div id="body" class="muted small">Opening your journal…</div>
</div><script>
const MOODS = [['🌞', 'Great'], ['🌤', 'Good'], ['☁️', 'Okay'], ['🌧', 'Hard'], ['⛈', 'Rough'], ['🥰', 'Loved'], ['😴', 'Tired'], ['🙏', 'Thankful']];

let recentAll = [], SB, day = isoDay(new Date()), cur = null, days = new Set(), recent = [], timer, calMonth = day.slice(0, 7), pIdx = 0;
const dt = d => new Date(d + 'T12:00'), add = (d, n) => { const x = dt(d); x.setDate(x.getDate() + n); return isoDay(x); };
const blank = () => ({ day, body: '', mood: '', grateful: ['', '', ''], highlight: '', tomorrow: '', cece_mood: '', cece_tags: [], cece_note: '', cece_did: [], verse_ref: '', verse: '', family: {}, drinks: {}, thrift: {}, sleep: {}, move: {}, faith: {}, body_feel: {}, eli_mood: '', eli_tags: [], eli_note: '', eli_did: [] });
// How Cece was today: a 5-step scale (with colors for the month view), plus quick words and a note.
const CECE = [['😄', 'Great', '#7fb069'], ['🙂', 'Good', '#b5cf7a'], ['😐', 'So-so', '#e8c95a'], ['😤', 'Rough', '#e8995a'], ['😭', 'Really hard', '#d9675f']];
const CECE_TAGS = ['Kind', 'Helpful', 'Listened', 'Funny', 'Did chores', 'Good at school', 'Tired', 'Moody', 'Sassy', 'Argued', 'Talked back', 'Cried', 'Anxious', 'Sick', 'Stayed in room'];
const ELI_TAGS = ['Kind', 'Helpful', 'Listened', 'Funny', 'Played well', 'Shared', 'Good at school', 'Tired', 'Cranky', 'Hyper', 'Whiny', 'Meltdown', 'Cried', 'Didn\'t listen', 'Sick'];
const KIDS = { cece: { name: 'Cece', icon: '💜', pr: 'she', tags: CECE_TAGS, ex: 'cleaned her room, made a new friend, got in trouble at school…' }, eli: { name: 'Eli', icon: '💙', pr: 'he', tags: ELI_TAGS, ex: 'learned a new word, built a fort, helped feed the dog…' } };
function draw() {
  if (document.getElementById('body2')) collect(); // keep what's being typed when the day's info arrives
  const ae = document.activeElement, focusKey = ae && (ae.dataset.f || (ae.dataset.g != null ? 'g' + ae.dataset.g : '') || (ae.dataset.did != null ? 'did' + ae.dataset.kid + ':' + ae.dataset.did : '') || (ae.dataset.j ? 'j:' + ae.dataset.j : '') || (ae.dataset.tf ? 'tf' : '')), caret = ae && ae.selectionStart;
  const e = cur || blank(), t = isoDay(new Date()), el = document.getElementById('body'); el.className = '';
  pIdx = (dt(day).getDate() + dt(day).getMonth()) % PROMPTS.length;
  const mood = MOODS.find(m => m[1] === e.mood);
  el.innerHTML = '<div class="book"><div class="ribbon"></div>' +
    '<div class="pg left">' + (mood ? '<div class="sticker">' + mood[0] + '</div>' : '') +
      '<p class="date">' + dt(day).toLocaleDateString('en-US', { weekday: 'long' }) + '<small>' + dt(day).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) + (day === t ? ' · today' : '') + '</small></p>' +

        '<textarea class="vt" data-f="verse" rows="2" placeholder="“The Lord is my shepherd; I shall not want.”">' + esc(e.verse || '') + '</textarea>' +

      '<p class="lbl">Today I feel…</p><div class="moods">' + MOODS.map(([i, n]) => '<button class="mood' + (e.mood === n ? ' on' : '') + '" data-mood="' + n + '" title="' + n + '">' + i + '</button>').join('') + '</div>' +
      '<p class="lbl">I\'m grateful for…</p><ol class="g">' + [0, 1, 2].map(i => '<li><input class="line" data-g="' + i + '" value="' + esc((e.grateful || [])[i] || '') + '" placeholder="' + (i ? '' : 'my family, coffee, a good laugh…') + '"></li>').join('') + '</ol>' +
      '<p class="lbl">Highlight of the day</p><input class="line" data-f="highlight" value="' + esc(e.highlight) + '" placeholder="the best part was…">' +

      '<div class="tc">' + drinksHtml(e) + '</div>' +
      '<div class="tc">' + careHtml(e) + '</div>' +
      '<div class="tc"><p class="lbl">✝️ Faith</p>' + faithHtml(e) + prayerHtml() + '</div>' +
      '<div class="tc">' + kidHtml(e, 'cece') + '</div>' +
      '<div class="tc">' + kidHtml(e, 'eli') + '</div>' +
      '<div class="tc">' + familyHtml(e) + '</div>' +
      '<div class="tc">' + thriftHtml(e) + '</div>' +
    '</div></div>' +
    pastHtml();
  grow();
  if (focusKey) { const n = document.querySelector(focusKey === 'tf' ? '[data-tf="found"]' : /^did\w+:\d+$/.test(focusKey) ? '[data-kid="' + focusKey.slice(3).split(':')[0] + '"][data-did="' + focusKey.split(':')[1] + '"]' : focusKey.startsWith('j:') ? '[data-j="' + focusKey.slice(2) + '"]' : focusKey[0] === 'g' && focusKey.length < 3 ? '[data-g="' + focusKey.slice(1) + '"]' : '[data-f="' + focusKey + '"]'); if (n) { n.focus(); try { n.setSelectionRange(caret, caret); } catch (x) {} } }
}

// ---------- From my day: appointments, work, meals, to-dos done, habits and spending flow in on their own ----------
let G = null, gDay = '', SET = null;
const WORKCAL = /outlook|atu|work/i, WORKWORD = /\b(work|shift|clinical|sim ?lab|simulation|class|lecture|office hours|advising|faculty|meeting|nur ?\d{4})\b/i;
const ampm = s => { if (!s) return ''; const [h, m] = s.split(':').map(Number); return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm'); };
async function loadGlance(d) {

  const [pi, rep, st, band, tx, hb] = await Promise.all([
    SB.from('planner_items').select('kind,title,start_time,end_time,all_day,done,list,repeat,date').in('kind', ['event', 'task', 'meal', 'track']).eq('date', d),
    SB.from('planner_items').select('title,start_time,end_time,all_day,repeat,date').eq('kind', 'event').neq('repeat', '').lt('date', d),
    SET ? Promise.resolve({ data: { data: SET } }) : SB.from('planner_settings').select('data').maybeSingle(),
    SB.from('vol_events').select('name,start_time,end_time').eq('date', d),
    SB.from('money_tx').select('amount,category,payee').eq('date', d).eq('type', 'expense'),
    hubGet(SB, 'habits').catch(() => ({}))

  const items = pi.data || [], RR = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', biweekly: 'FREQ=WEEKLY;INTERVAL=2', monthly: 'FREQ=MONTHLY', yearly: 'FREQ=YEARLY' };
  const ev = items.filter(i => i.kind === 'event' && !/^medrem-/.test(i.title || '')).map(i => ({ t: i.title, s: i.all_day ? '' : i.start_time, e: i.end_time, cal: 'Planner' }));
  (rep.data || []).forEach(i => { if (RR[i.repeat] && expandRule({ start: i.date + (i.all_day || !i.start_time ? '' : 'T' + i.start_time), allDay: i.all_day || !i.start_time, rrule: RR[i.repeat] }, d, d).length) ev.push({ t: i.title, s: i.all_day ? '' : i.start_time, e: i.end_time, cal: 'Planner' }); });
  (band.data || []).forEach(b => ev.push({ t: '🎺 ' + b.name, s: b.start_time || '', e: b.end_time || '', cal: 'Band' }));
  const sp = (tx.data || []).filter(t => !/transfer/i.test(t.category || ''));
  const tr = (set.trackers || []).filter(t => !t.cycle), habits = ((hb && hb.log) || {})[d] || [];
  G = { ev, work: [], meals: items.filter(i => i.kind === 'meal'), done: items.filter(i => i.kind === 'task' && i.done).map(i => i.title),
    habits: habits.concat(items.filter(i => i.kind === 'track').map(i => { const t = tr.find(x => x.id === i.list); return t ? t.icon + ' ' + t.name : null; }).filter(Boolean)),

function glanceHtml() {
  if (!G || gDay !== day) return '<div class="note"><span class="tape"></span><p class="nh">📌 From my day</p><p class="nl muted">gathering your day…</p></div>';

});
document.addEventListener('click', async e => {
  const sr = e.target.closest('[data-srm]'); if (sr) { const n = sr.dataset.srm; if (!(await ask('Take ' + n + ' off your store list?'))) return; collect(); STORES = STORES.filter(x => x !== n); hubSet(SB, 'thriftStores', { list: STORES }); draw(); return; }
  const sb2 = e.target.closest('[data-store]'); if (sb2) { const n = sb2.dataset.store; collect();
    const t = cur.thrift = { ...(cur.thrift || {}) }, l = t.stores || []; t.stores = l.includes(n) ? l.filter(x => x !== n) : l.concat(n); await save(); draw(); return; }

  const dk = e.target.closest('[data-drink]'); if (dk) { collect(); const k = dk.dataset.drink, d = cur.drinks = { ...(cur.drinks || {}) }; d[k] = Math.max(0, (d[k] || 0) + Number(dk.dataset.d)); if (!d[k]) delete d[k]; await save(); draw(); return; }
  const fb = e.target.closest('[data-fam]'); if (fb) { collect(); const n = fb.dataset.fam, k = fb.dataset.way, f = cur.family = { ...(cur.family || {}) }, l = f[n] || []; f[n] = l.includes(k) ? l.filter(x => x !== k) : l.concat(k); if (!f[n].length) delete f[n]; await save(); draw(); return; }
  if (e.target.id === 'famEd') { collect(); famEdit = !famEdit; draw(); if (famEdit) { const n = document.getElementById('famNew'); if (n) n.focus(); } return; }
  const fr = e.target.closest('[data-frm]'); if (fr) { if (!(await ask('Take ' + fr.dataset.frm + ' off your check-in list?'))) return; collect(); FAM = FAM.filter(x => x !== fr.dataset.frm); hubSet(SB, 'familyPeople', { list: FAM }); draw(); return; }
  const cm = e.target.closest('[data-kmood]'); if (cm) { collect(); const f = cm.dataset.kid + '_mood'; cur[f] = cur[f] === cm.dataset.kmood ? '' : cm.dataset.kmood; await save(); draw(); return; }
  const ct = e.target.closest('[data-ktag]'); if (ct) { collect(); const f = ct.dataset.kid + '_tags', t = ct.dataset.ktag, l = cur[f] || []; cur[f] = l.includes(t) ? l.filter(x => x !== t) : l.concat(t); await save(); draw(); return; }
  const jt = e.target.closest('[data-jt]'); if (jt) { collect(); jset(cur, jt.dataset.jt, !jget(cur, jt.dataset.jt)); await save(); draw(); return; }
  const jv = e.target.closest('[data-jv]'); if (jv) { collect(); const v = Number(jv.dataset.v); jset(cur, jv.dataset.jv, jget(cur, jv.dataset.jv) == v ? '' : v); await save(); draw(); return; }
  const pa = e.target.closest('[data-pans]'); if (pa) { collect(); const p = PRAY.find(x => x.id === pa.dataset.pans); if (p) { p.answered = day; savePray(); draw(); } return; }
  const pu = e.target.closest('[data-pun]'); if (pu) { collect(); const p = PRAY.find(x => x.id === pu.dataset.pun); if (p) { delete p.answered; savePray(); draw(); } return; }
  const pr = e.target.closest('[data-prm]'); if (pr) { const p = PRAY.find(x => x.id === pr.dataset.prm); if (!p || !(await ask('Take “' + p.text + '” off your prayer list?'))) return; collect(); PRAY = PRAY.filter(x => x !== p); savePray(); draw(); return; }
  if (e.target.id === 'prAns') { collect(); prShowAns = !prShowAns; draw(); return; }
  const m = e.target.closest('[data-mood]'); if (m) { collect(); cur.mood = cur.mood === m.dataset.mood ? '' : m.dataset.mood; await save(); draw(); return; }
  const d = e.target.closest('[data-day]'); if (d && !d.disabled) return open(d.dataset.day);
  const nm = e.target.closest('.nav-m'); if (nm) { const [y, mo] = calMonth.split('-').map(Number), x = new Date(y, mo - 1 + Number(nm.dataset.m), 1); calMonth = x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); collect(); return draw(); }
  if (e.target.id === 'newP') { const p = document.querySelector('.prompt'); pIdx = (pIdx + 1) % PROMPTS.length; p.firstChild.nextSibling.textContent = ' ' + PROMPTS[pIdx]; return; }
  if (e.target.id === 'prev') return open(add(day, -1));
  if (e.target.id === 'next') { if (day < isoDay(new Date())) open(add(day, 1)); return; }
  if (e.target.id === 'tdy') return open(isoDay(new Date()));
});
