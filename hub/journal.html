<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal</title><link rel="stylesheet" href="style.css">
<style>
@font-face{font-family:'Patrick Hand';src:url(../fonts/patrick-hand.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Pacifico';src:url(../fonts/pacifico.woff2) format('woff2');font-display:swap}
:root{--paper:#fffdf6;--rule:#d9e3ea;--margin:#e8b4b0;--ink2:#2f3b4c;--hand:'Patrick Hand','Bradley Hand','Segoe Print',cursive}
html,body{background:#efe9dc}
body{background:radial-gradient(#e7dfcf 1px,transparent 1px) 0 0/18px 18px,#efe9dc}
.wrap{max-width:1100px;margin:0 auto;padding:14px 12px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-family:'Pacifico',cursive;font-weight:400;font-size:30px;color:#5b6b52;margin:0}
.nav{display:flex;gap:6px;align-items:center}.nav button{font-family:var(--hand);font-size:17px;border:1px solid #d8cfbd;background:#fffaf0;border-radius:18px;padding:3px 12px;color:var(--ink2)}
.nav button:hover{background:#fff}
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:6px 6px 6px 6px;box-shadow:0 1px 0 #e3dccb,0 3px 0 #ece6d8,0 5px 0 #e3dccb,0 14px 28px #0000002a}
.book:before{content:'';position:absolute;top:0;bottom:0;left:50%;width:40px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#00000014 45%,#0000001f 50%,#00000014 55%,transparent);pointer-events:none}
.ribbon{position:absolute;top:-6px;right:14px;width:22px;height:90px;background:#b65d5d;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 2px 4px #0003;z-index:2}
.pg{position:relative;padding:34px 34px 30px 58px;min-height:640px;font-family:var(--hand);color:var(--ink2);font-size:20px;line-height:32px;
  background:linear-gradient(90deg,transparent 44px,var(--margin) 44px,var(--margin) 46px,transparent 46px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 0,0 22px}
.pg.right{padding-left:40px;padding-right:52px;background:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 22px}
.date{font-size:34px;line-height:40px;margin:0 0 2px}.date small{display:block;font-size:19px;color:#8a8f86;line-height:24px}
.lbl{font-family:var(--hand);font-size:17px;letter-spacing:.04em;color:#7a8c74;text-transform:none;margin:16px 0 0;line-height:32px}
.moods{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.mood{font-size:24px;line-height:1;width:44px;height:44px;border-radius:50%;border:2px dashed #d6cdbb;background:#fffaf0;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.mood:hover{transform:rotate(-8deg) scale(1.08)}.mood.on{border:2px solid #7d9178;background:#eef3ea;transform:rotate(-6deg) scale(1.1)}
.line{display:block;width:100%;border:0;background:transparent;font:inherit;color:var(--ink2);height:32px;padding:0;outline:none}
.line::placeholder,textarea::placeholder{color:#b7bcc4}
ol.g{margin:0;padding-left:22px}ol.g li::marker{color:#c39a6b}
textarea{display:block;width:100%;border:0;background:transparent;font:inherit;color:var(--ink2);line-height:32px;resize:none;outline:none;padding:0;min-height:448px;overflow:hidden}
.prompt{font-size:17px;color:#9a8f7a;margin:0 0 0;line-height:32px}.prompt b{color:#c39a6b;font-weight:400}.prompt button{font:inherit;color:#7d9178;border:0;background:none;cursor:pointer;padding:0 0 0 4px;text-decoration:underline dotted}
.saved{position:absolute;right:16px;bottom:8px;font-size:15px;color:#9aa596}
.sticker{position:absolute;right:56px;top:20px;font-size:30px;transform:rotate(12deg);opacity:.9}
.past{margin-top:16px;background:#fffaf0;border-radius:8px;padding:12px 16px;box-shadow:0 4px 12px #00000014;font-family:var(--hand);color:var(--ink2)}
.past h3{font-family:var(--hand);font-weight:400;font-size:22px;margin:0 0 6px;display:flex;justify-content:space-between}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-width:420px;text-align:center;font-size:16px}.cal span{color:#9a8f7a;font-size:14px}
.cal button{font:inherit;border:0;background:none;border-radius:50%;width:34px;height:34px;margin:auto;cursor:pointer;color:var(--ink2)}
.cal button.has{background:#dfe8da}.cal button.sel{outline:2px solid #b65d5d}.cal button.today{font-weight:700;color:#b65d5d}.cal button:disabled{opacity:.3;cursor:default}
.recent{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px}.recent button{flex:0 0 auto;font:inherit;font-size:16px;text-align:left;border:1px solid #e3dccb;background:#fff;border-radius:6px;padding:6px 10px;max-width:220px;cursor:pointer;color:var(--ink2)}
.recent small{display:block;color:#9a8f7a;font-size:13px}
@media(max-width:760px){.book{grid-template-columns:1fr}.book:before{display:none}.pg{min-height:0}.pg.right{padding-left:58px;background:linear-gradient(90deg,transparent 44px,var(--margin) 44px,var(--margin) 46px,transparent 46px),repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-position:0 0,0 22px}.ribbon{right:24px}}
.signin,.muted.small{font-family:Lora,serif}
.note{position:relative;background:#fff8c9;margin:14px 0 6px -8px;padding:10px 14px 8px;border-radius:2px;box-shadow:0 3px 8px #0000001f;transform:rotate(-.6deg);line-height:24px;font-size:17px}
.tape{position:absolute;top:-10px;left:50%;width:84px;height:20px;margin-left:-42px;background:#e9dcc0cc;transform:rotate(-3deg);box-shadow:0 1px 2px #0001}
.nh{margin:0 0 2px;font-size:16px;color:#9a7b3b}.nl{margin:2px 0}.nl b{font-weight:400}.nl .sub,.nl .tm{color:#8a8f86;font-size:15px}.cece{margin:0 0 18px;padding-bottom:4px}.cm.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 22%,#fff)}.cl{align-self:center;font-size:17px;color:#8a8f86;margin-left:4px}
.ctags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}.ctag{font-family:var(--hand);font-size:15px;line-height:1.2;border:1px dashed #d6cdbb;background:#fffaf0;border-radius:14px;padding:3px 10px;color:var(--ink2);cursor:pointer}.ctag.on{border:1px solid #a98bc4;background:#efe6f6}
.dots{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}.dots i{width:14px;height:14px;border-radius:50%;display:block}.ck{font-size:15px;color:#8a8f86;margin:4px 0 0}.verse{margin:6px 0 4px;padding-left:12px;border-left:3px solid #c39a6b}.verse a{font-size:14px;color:#7d9178;margin-left:6px}
textarea.vt{min-height:0;font-style:italic;color:#4e5a6b;overflow:hidden}.vr{text-align:right;color:#8a7a5e}
ul.did{margin:0;padding-left:20px}ul.did li::marker{color:#a98bc4}</style>
<script src="../config.js"></script><script src="../vendor/supabase.js"></script><script src="data.js?v=5"></script><script src="cal.js"></script></head><body><div class="wrap">
<div class="top"><h1>My Journal</h1><div class="nav"><button id="prev" title="Day before">‹</button><button id="tdy">Today</button><button id="next" title="Next day">›</button></div></div>
<div id="body" class="muted small">Opening your journal…</div>
</div><script>
const MOODS = [['🌞', 'Great'], ['🌤', 'Good'], ['☁️', 'Okay'], ['🌧', 'Hard'], ['⛈', 'Rough'], ['🥰', 'Loved'], ['😴', 'Tired'], ['🙏', 'Thankful']];
const PROMPTS = ['What made you smile today?', 'What\'s been on your mind lately?', 'A moment you want to remember…', 'What did you learn today?', 'How did you take care of yourself?', 'What are you looking forward to?', 'Something you\'re proud of…', 'What would make tomorrow great?', 'Who made a difference for you today?', 'What\'s weighing on you, and one small next step?', 'Write a little letter to yourself…', 'Where did you see God / grace today?'];
let recentAll = [], SB, day = isoDay(new Date()), cur = null, days = new Set(), recent = [], timer, calMonth = day.slice(0, 7), pIdx = 0;
const dt = d => new Date(d + 'T12:00'), add = (d, n) => { const x = dt(d); x.setDate(x.getDate() + n); return isoDay(x); };
const blank = () => ({ day, body: '', mood: '', grateful: ['', '', ''], highlight: '', tomorrow: '', cece_mood: '', cece_tags: [], cece_note: '', cece_did: [], verse_ref: '', verse: '' });
// How Cece was today: a 5-step scale (with colors for the month view), plus quick words and a note.
const CECE = [['😄', 'Great', '#7fb069'], ['🙂', 'Good', '#b5cf7a'], ['😐', 'So-so', '#e8c95a'], ['😤', 'Rough', '#e8995a'], ['😭', 'Really hard', '#d9675f']];
const CECE_TAGS = ['Kind', 'Helpful', 'Listened', 'Funny', 'Did chores', 'Good at school', 'Tired', 'Moody', 'Sassy', 'Argued', 'Talked back', 'Cried', 'Anxious', 'Sick', 'Stayed in room'];
function draw() {
  if (document.getElementById('body2')) collect(); // keep what's being typed when the day's info arrives
  const ae = document.activeElement, focusKey = ae && (ae.dataset.f || (ae.dataset.g != null ? 'g' + ae.dataset.g : '') || (ae.dataset.did != null ? 'did' + ae.dataset.did : '')), caret = ae && ae.selectionStart;
  const e = cur || blank(), t = isoDay(new Date()), el = document.getElementById('body'); el.className = '';
  pIdx = (dt(day).getDate() + dt(day).getMonth()) % PROMPTS.length;
  const mood = MOODS.find(m => m[1] === e.mood);
  el.innerHTML = '<div class="book"><div class="ribbon"></div>' +
    '<div class="pg left">' + (mood ? '<div class="sticker">' + mood[0] + '</div>' : '') +
      '<p class="date">' + dt(day).toLocaleDateString('en-US', { weekday: 'long' }) + '<small>' + dt(day).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) + (day === t ? ' · today' : '') + '</small></p>' +
      '<div class="verse"><p class="lbl" style="margin:0">📖 Verse of the day <a href="https://www.biblegateway.com/" target="_blank" title="Find today\'s verse">find one ↗</a></p>' +
        '<textarea class="vt" data-f="verse" rows="2" placeholder="“The Lord is my shepherd; I shall not want.”">' + esc(e.verse || '') + '</textarea>' +
        '<input class="line vr" data-f="verse_ref" value="' + esc(e.verse_ref || '') + '" placeholder="— Psalm 23:1"></div>' +
      glanceHtml() +
      '<p class="lbl">Today I feel…</p><div class="moods">' + MOODS.map(([i, n]) => '<button class="mood' + (e.mood === n ? ' on' : '') + '" data-mood="' + n + '" title="' + n + '">' + i + '</button>').join('') + '</div>' +
      '<p class="lbl">I\'m grateful for…</p><ol class="g">' + [0, 1, 2].map(i => '<li><input class="line" data-g="' + i + '" value="' + esc((e.grateful || [])[i] || '') + '" placeholder="' + (i ? '' : 'my family, coffee, a good laugh…') + '"></li>').join('') + '</ol>' +
      '<p class="lbl">Highlight of the day</p><input class="line" data-f="highlight" value="' + esc(e.highlight) + '" placeholder="the best part was…">' +
      '<p class="lbl">Tomorrow I want to…</p><input class="line" data-f="tomorrow" value="' + esc(e.tomorrow) + '" placeholder="one thing that matters">' +
    '</div>' +
    '<div class="pg right">' + ceceHtml(e) + '<p class="prompt"><b>✎</b> ' + esc(PROMPTS[pIdx]) + '<button id="newP" title="Another prompt">another</button></p>' +
      '<textarea id="body2" data-f="body" placeholder="Dear diary…">' + esc(e.body) + '</textarea><span class="saved" id="saved"></span></div></div>' +
    pastHtml();
  grow();
  if (focusKey) { const n = document.querySelector(/^did\d+$/.test(focusKey) ? '[data-did="' + focusKey.slice(3) + '"]' : focusKey[0] === 'g' && focusKey.length < 3 ? '[data-g="' + focusKey.slice(1) + '"]' : '[data-f="' + focusKey + '"]'); if (n) { n.focus(); try { n.setSelectionRange(caret, caret); } catch (x) {} } }
}

// ---------- From my day: appointments, work, meals, to-dos done, habits and spending flow in on their own ----------
let G = null, gDay = '', SET = null;
const WORKCAL = /outlook|atu|work/i, WORKWORD = /\b(work|shift|clinical|sim ?lab|simulation|class|lecture|office hours|advising|faculty|meeting|nur ?\d{4})\b/i;
const ampm = s => { if (!s) return ''; const [h, m] = s.split(':').map(Number); return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm'); };
async function loadGlance(d) {
  G = null; gDay = d;
  const [pi, rep, st, band, tx, hb] = await Promise.all([
    SB.from('planner_items').select('kind,title,start_time,end_time,all_day,done,list,repeat,date').in('kind', ['event', 'task', 'meal', 'track']).eq('date', d),
    SB.from('planner_items').select('title,start_time,end_time,all_day,repeat,date').eq('kind', 'event').neq('repeat', '').lt('date', d),
    SET ? Promise.resolve({ data: { data: SET } }) : SB.from('planner_settings').select('data').maybeSingle(),
    SB.from('vol_events').select('name,start_time,end_time').eq('date', d),
    SB.from('money_tx').select('amount,category,payee').eq('date', d).eq('type', 'expense'),
    hubGet(SB, 'habits').catch(() => ({}))
  ]);
  if (gDay !== d) return;
  SET = (st.data && st.data.data) || {}; const set = SET.settings || {};
  const items = pi.data || [], RR = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', biweekly: 'FREQ=WEEKLY;INTERVAL=2', monthly: 'FREQ=MONTHLY', yearly: 'FREQ=YEARLY' };
  const ev = items.filter(i => i.kind === 'event' && !/^medrem-/.test(i.title || '')).map(i => ({ t: i.title, s: i.all_day ? '' : i.start_time, e: i.end_time, cal: 'Planner' }));
  (rep.data || []).forEach(i => { if (RR[i.repeat] && expandRule({ start: i.date + (i.all_day || !i.start_time ? '' : 'T' + i.start_time), allDay: i.all_day || !i.start_time, rrule: RR[i.repeat] }, d, d).length) ev.push({ t: i.title, s: i.all_day ? '' : i.start_time, e: i.end_time, cal: 'Planner' }); });
  (band.data || []).forEach(b => ev.push({ t: '🎺 ' + b.name, s: b.start_time || '', e: b.end_time || '', cal: 'Band' }));
  const sp = (tx.data || []).filter(t => !/transfer/i.test(t.category || ''));
  const tr = (set.trackers || []).filter(t => !t.cycle), habits = ((hb && hb.log) || {})[d] || [];
  G = { ev, work: [], meals: items.filter(i => i.kind === 'meal'), done: items.filter(i => i.kind === 'task' && i.done).map(i => i.title),
    habits: habits.concat(items.filter(i => i.kind === 'track').map(i => { const t = tr.find(x => x.id === i.list); return t ? t.icon + ' ' + t.name : null; }).filter(Boolean)),
    spent: sp.reduce((a, t) => a + Number(t.amount), 0), spentN: sp.length };
  draw();
  // Connected calendars (Google, Outlook) take a moment longer.
  try {
    const cal = await calendarDay(SB, set.calendars || [], d); if (gDay !== d) return;
    cal.forEach(o => G.ev.push({ t: o.title, s: o.allDay ? '' : o.start, e: o.allDay ? '' : o.end, cal: o.cal || '' }));
    draw();
  } catch (e) {}
}
function glanceHtml() {
  if (!G || gDay !== day) return '<div class="note"><span class="tape"></span><p class="nh">📌 From my day</p><p class="nl muted">gathering your day…</p></div>';
  const ev = G.ev.slice().sort((a, b) => (a.s || '00').localeCompare(b.s || '00'));
  const work = ev.filter(e => WORKCAL.test(e.cal) || WORKWORD.test(e.t)), appts = ev.filter(e => !work.includes(e));
  const span = l => { const t = l.filter(e => e.s); return t.length ? ampm(t[0].s) + '–' + ampm(t.map(e => e.e || e.s).sort().pop()) : 'all day'; };
  const row = (i, txt) => '<p class="nl"><b>' + i + '</b> ' + txt + '</p>';
  const evTxt = e => (e.s ? '<span class="tm">' + ampm(e.s) + '</span> ' : '') + esc(e.t);
  const order = { Breakfast: 0, Lunch: 1, Dinner: 2 };
  const parts = [
    work.length ? row('💼', 'Worked · ' + span(work) + '<br><span class="sub">' + work.map(evTxt).join(' · ') + '</span>') : '',
    appts.length ? row('🗓', appts.map(evTxt).join(' · ')) : '',
    G.meals.length ? row('🍽', G.meals.sort((a, b) => (order[a.list] ?? 3) - (order[b.list] ?? 3)).map(m => '<span class="sub">' + esc((m.list || '').slice(0, 1)) + '</span> ' + esc(m.title)).join(' · ')) : '',
    G.done.length ? row('✅', esc(G.done.slice(0, 6).join(' · ')) + (G.done.length > 6 ? ' +' + (G.done.length - 6) : '')) : '',
    G.habits.length ? row('🌿', esc(G.habits.join(' · '))) : '',
    G.spentN ? row('💵', 'Spent $' + G.spent.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' · ' + G.spentN + ' purchase' + (G.spentN === 1 ? '' : 's')) : ''
  ].filter(Boolean);
  return '<div class="note"><span class="tape"></span><p class="nh">📌 From my day</p>' + (parts.length ? parts.join('') : '<p class="nl muted">Nothing on the books — a quiet day.</p>') + '</div>';
}

// Always one empty line at the end, so there's room to add another.
const didLines = e => { const l = (e.cece_did || []).filter(x => x && x.trim()); return l.concat(['']).concat(l.length ? [] : ['']); };
function ceceHtml(e) {
  const tags = e.cece_tags || [];
  return '<div class="cece"><p class="lbl" style="margin-top:0">💜 How was Cece today?</p><div class="moods">' +
    CECE.map(([i, n, c]) => '<button class="mood cm' + (e.cece_mood === n ? ' on' : '') + '" data-cece="' + n + '" title="' + n + '" style="--cc:' + c + '">' + i + '</button>').join('') +
    (e.cece_mood ? '<span class="cl">' + esc(e.cece_mood) + '</span>' : '') + '</div>' +
    '<div class="ctags">' + CECE_TAGS.map(t => '<button class="ctag' + (tags.includes(t) ? ' on' : '') + '" data-ctag="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' +
    '<input class="line" data-f="cece_note" value="' + esc(e.cece_note || '') + '" placeholder="what happened, what helped…">' +
    '<p class="lbl">Things she did</p><ul class="did">' + didLines(e).map((t, i) => '<li><input class="line" data-did="' + i + '" value="' + esc(t) + '" placeholder="' + (i ? '' : 'cleaned her room, made a new friend, got in trouble at school…') + '"></li>').join('') + '</ul></div>';
}

// Cece this month: one dot per day, colored by how her day went.
function ceceMonth() {
  const [y, m] = calMonth.split('-').map(Number), n = new Date(y, m, 0).getDate(), have = {}; recentAll.forEach(r => { if (r.cece_mood) have[r.day] = r.cece_mood; });
  if (cur && cur.cece_mood) have[cur.day] = cur.cece_mood;
  const ds = [...Array(n)].map((_, k) => calMonth + '-' + String(k + 1).padStart(2, '0')), logged = ds.filter(d => have[d]);
  if (!logged.length) return '';
  const counts = {}; logged.forEach(d => counts[have[d]] = (counts[have[d]] || 0) + 1);
  return '<div class="cmonth"><p class="nh" style="margin:10px 0 4px">💜 Cece this month</p><div class="dots">' + ds.map(d => { const c = CECE.find(x => x[1] === have[d]); return '<i title="' + d + (c ? ' · ' + c[1] : '') + '" style="background:' + (c ? c[2] : '#ece6d8') + '"></i>'; }).join('') + '</div>' +
    '<p class="ck">' + CECE.filter(c => counts[c[1]]).map(c => c[0] + ' ' + c[1] + ' ' + counts[c[1]]).join(' · ') + '</p></div>';
}
function pastHtml() {
  const [y, m] = calMonth.split('-').map(Number), first = new Date(y, m - 1, 1), n = new Date(y, m, 0).getDate(), t = isoDay(new Date());
  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => '<span>' + x + '</span>').join('') + '<span></span>'.repeat((first.getDay() + 6) % 7);
  for (let k = 1; k <= n; k++) { const d = calMonth + '-' + String(k).padStart(2, '0'); cells += '<button data-day="' + d + '" class="' + (days.has(d) ? 'has ' : '') + (d === day ? 'sel ' : '') + (d === t ? 'today' : '') + '"' + (d > t ? ' disabled' : '') + '>' + k + '</button>'; }
  return '<div class="past"><h3><span>📚 Past entries</span><span><button class="nav-m" data-m="-1" style="font:inherit;border:0;background:none;cursor:pointer">‹</button> ' + first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) + ' <button class="nav-m" data-m="1" style="font:inherit;border:0;background:none;cursor:pointer">›</button></span></h3>' +
    '<div class="cal">' + cells + '</div>' +
    ceceMonth() +
    (recent.length ? '<div class="recent">' + recent.map(r => '<button data-day="' + r.day + '"><small>' + dt(r.day).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + (r.mood ? ' · ' + (MOODS.find(m => m[1] === r.mood) || [''])[0] : '') + '</small>' + esc((r.highlight || r.body || 'Entry').slice(0, 60)) + '</button>').join('') + '</div>' : '') + '</div>';
}
function grow() { document.querySelectorAll('textarea.vt').forEach(v => { v.style.height = 'auto'; v.style.height = Math.max(64, Math.ceil(v.scrollHeight / 32) * 32) + 'px'; }); const t = document.getElementById('body2'); if (!t) return; t.style.height = 'auto'; t.style.height = Math.max(448, Math.ceil(t.scrollHeight / 32) * 32) + 'px'; }
function collect() {
  const e = cur || blank();
  document.querySelectorAll('[data-f]').forEach(i => { e[i.dataset.f] = i.value; });
  e.grateful = [0, 1, 2].map(i => (document.querySelector('[data-g="' + i + '"]') || {}).value || '');
  if (document.querySelector('[data-did]')) e.cece_did = [...document.querySelectorAll('[data-did]')].map(i => i.value).filter(x => x.trim());
  cur = e; return e;
}
