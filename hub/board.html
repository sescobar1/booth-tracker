<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub</title>
<style>
/* Several hub boxes in one Notion embed, each sized to fit what it holds. Drag the embed taller or shorter
   and every box grows or shrinks with it, keeping the same proportions. */
html,body{margin:0;height:100%;background:#f6f4ee}
.b{display:grid;gap:12px;height:100vh;box-sizing:border-box;padding:2px}
.c{display:grid;gap:12px;min-height:0}
iframe{width:100%;height:100%;border:0;border-radius:14px;background:#fbfaf6;min-height:0;display:block}
@media(max-width:640px){.b{height:auto;grid-template-columns:1fr!important}.c{grid-template-rows:none!important}iframe{height:var(--h)}}
</style></head><body><div class="b" id="b"></div>
<script>
// Each layout: columns (width share) holding boxes (height share, and height on a phone).
const L = {
  top: [[1, [['hello.html', 0.75, 210], ['quick.html', 1.25, 260]]], [1, [['weather.html', 1, 230], ['clock.html', 1, 230]]], [1, [['countdown.html?v=2', 1, 360]]]],
  home: [[1.1, [['meals.html', 1, 520]]], [1, [['money.html', 1.15, 400], ['christmas.html', 0.85, 460]]]]
};
const lay = L[new URLSearchParams(location.search).get('l')] || L.top, b = document.getElementById('b');
b.style.gridTemplateColumns = lay.map(c => c[0] + 'fr').join(' ');
b.innerHTML = lay.map(c => '<div class="c" style="grid-template-rows:' + c[1].map(x => x[1] + 'fr').join(' ') + '">' +
  c[1].map(x => '<iframe src="' + x[0] + '" style="--h:' + x[2] + 'px" loading="lazy" title="' + x[0].split('.')[0] + '"></iframe>').join('') + '</div>').join('');
</script></body></html>
