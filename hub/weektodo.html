<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>This week's to-dos</title><link rel="stylesheet" href="style.css">
<style>.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dy{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:120px;display:flex;flex-direction:column}
.dy.now{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage-l)}.dy.past{opacity:.7}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.dh b{font-weight:500;font-size:15px}.dh span{font-size:12px;color:var(--muted)}
.t{display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:start;padding:4px 0;font-size:13.5px;line-height:1.35}
.ck{width:16px;height:16px;margin-top:1px;border:1.5px solid var(--sage);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.t.on .ck{background:var(--sage)}.t.on .tx{color:var(--muted);text-decoration:line-through}
.x{opacity:0;font-size:11px;color:var(--muted);padding:0 2px}.t:hover .x{opacity:1}
.add{margin-top:auto;padding-top:6px}.add input{width:100%;font:inherit;font-size:13px;border:0;border-top:1px dashed var(--line);background:transparent;padding:6px 0 2px;color:var(--ink);outline:none}
.add input::placeholder{color:#b5b9b0}.nav{display:flex;gap:4px;align-items:center;font-size:13px}.nav button{font-size:16px}
.foot{font-size:12px;color:var(--muted);margin-top:10px}.foot a{color:var(--muted)}</style>
<script src="../config.js"></script><script src="../vendor/supabase.js"></script><script src="data.js"></script></head><body><div class="card">
<h1>This week <span class="nav"><button id="prev" title="Last week">‹</button><span id="rng" class="muted"></span><button id="next" title="Next week">›</button></span></h1>
<div id="body" class="muted small">Loading…</div>
<p class="foot">Saved to your Planner as tasks, so they show on your Google Calendar too. <a href="https://sescobar1.github.io/booth-tracker/planner/#feed" target="_blank">Calendar setup</a></p>
</div><script>
let SB, off = 0, tasks = [];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const days = () => { const ws = weekStart(new Date()); ws.setDate(ws.getDate() + off * 7); return [...Array(7)].map((_, k) => { const d = new Date(ws); d.setDate(d.getDate() + k); return isoDay(d); }); };
function draw() {
  const ds = days(), tdy = isoDay(new Date()), f = d => new Date(d + 'T12:00');
  document.getElementById('rng').textContent = f(ds[0]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' + f(ds[6]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const el = document.getElementById('body'); el.className = '';
  el.innerHTML = '<div class="wk">' + ds.map(d => {
    const list = tasks.filter(t => t.date === d).sort((a, b) => a.done - b.done || (a.sort || 0) - (b.sort || 0));
    return '<div class="dy' + (d === tdy ? ' now' : d < tdy ? ' past' : '') + '"><div class="dh"><b>' + f(d).toLocaleDateString('en-US', { weekday: 'long' }) + '</b><span>' + f(d).getDate() + '</span></div>' +
      list.map(t => '<div class="t' + (t.done ? ' on' : '') + '" data-id="' + t.id + '"><span class="ck">' + (t.done ? '✓' : '') + '</span><span class="tx">' + esc(t.title) + '</span><button class="x" title="Delete">✕</button></div>').join('') +
      '<form class="add" data-d="' + d + '"><input placeholder="+ Add a to-do" aria-label="Add a to-do for ' + d + '"></form></div>';
  }).join('') + '</div>';
}
async function load() {
  const ds = days();
  const { data, error } = await SB.from('planner_items').select('id,title,date,done,sort').eq('kind', 'task').gte('date', ds[0]).lte('date', ds[6]);
  if (error) throw error; tasks = data || []; draw();
}
document.addEventListener('submit', async e => {
  e.preventDefault(); const inp = e.target.querySelector('input'), title = inp.value.trim(), date = e.target.dataset.d; if (!title) return;
  const t = { id: uid(), kind: 'task', title, date, done: false, all_day: true, list: 'Home', sort: Date.now() % 1e9, updated_at: new Date().toISOString() };
  tasks.push(t); draw(); document.querySelector('form[data-d="' + date + '"] input').focus();
  const { error } = await SB.from('planner_items').insert(t); if (error) { tasks = tasks.filter(x => x !== t); draw(); alert('Couldn\'t save: ' + error.message); }
});
document.addEventListener('click', async e => {
  if (e.target.id === 'prev' || e.target.id === 'next') { off += e.target.id === 'next' ? 1 : -1; await load(); return; }
  const row = e.target.closest('.t'); if (!row) return; const t = tasks.find(x => x.id === row.dataset.id); if (!t) return;
  if (e.target.closest('.x')) { tasks = tasks.filter(x => x !== t); draw(); await SB.from('planner_items').delete().eq('id', t.id); return; }
  if (e.target.closest('.ck') || e.target.closest('.tx')) { t.done = !t.done; draw(); await SB.from('planner_items').update({ done: t.done, updated_at: new Date().toISOString() }).eq('id', t.id); }
});
hubData(async sb => { SB = sb; if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.value) return; await load(); }, 5);
</script></body></html>
