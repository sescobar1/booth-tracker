<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-dos</title><link rel="stylesheet" href="style.css">
<style>.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dy{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:120px;display:flex;flex-direction:column;transition:.15s}
.dy.now{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage-l)}.dy.past{opacity:.7}.dy.over{background:var(--sage-l)}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.dh b{font-weight:500;font-size:15px}.dh span{font-size:12px;color:var(--muted)}
.t{display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:start;padding:4px 0 4px 6px;font-size:13.5px;line-height:1.35;border-left:3px solid transparent;border-radius:2px;cursor:grab}
.t.drag{opacity:.4}.ck{width:16px;height:16px;margin-top:1px;border:1.5px solid var(--sage);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.t.on .ck{background:var(--sage)}.t.on .tx{color:var(--muted);text-decoration:line-through}.t.ghost{opacity:.55;cursor:default}.t.ghost .ck{border-style:dashed;cursor:default}
.tx{cursor:pointer}.tm{font-size:11px;color:var(--muted);margin-right:3px}.rp{font-size:10px;margin-left:3px}
.st{font-size:13px;color:#c9c3b3;padding:0 2px}.st.on{color:#d9a441}.t:not(:hover) .st:not(.on){opacity:0}
.add{margin-top:auto;padding-top:6px}.add input{width:100%;font:inherit;font-size:13px;border:0;border-top:1px dashed var(--line);background:transparent;padding:6px 0 2px;color:var(--ink);outline:none}
.add input::placeholder{color:#b5b9b0}.nav{display:flex;gap:4px;align-items:center;font-size:13px}.nav button{font-size:16px}
.foot{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}.foot a{color:var(--muted)}
.key{display:inline-flex;align-items:center;gap:4px}.key i{width:8px;height:8px;border-radius:2px;display:inline-block}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 2px}.one .t{font-size:14.5px;padding:6px 0 6px 8px}
.sheet{position:fixed;inset:0;background:#26342855;display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:5;overflow:auto}
.pane{background:var(--card);border-radius:14px;padding:16px 18px;width:100%;max-width:380px;box-shadow:0 10px 30px #0002}
.pane label{display:block;font-size:12px;color:var(--muted);margin-top:10px}.pane input,.pane select{display:block;width:100%;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts{display:flex;gap:8px;margin-top:14px;justify-content:space-between}.ghost{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 12px}.del{color:#a5543b}</style>
<script src="../config.js"></script><script src="../vendor/supabase.js"></script><script src="data.js"></script></head><body><div class="card" id="card">
<h1 id="h1">This week <span class="nav" id="navs"><button id="prev" title="Last week">‹</button><span id="rng" class="muted"></span><button id="next" title="Next week">›</button></span></h1>
<div id="body" class="muted small">Loading…</div>
<div class="foot" id="foot"></div>
</div><script>
const ONE = /today/.test(location.search); // the Today box: just today, with a Top 3
const AREAS = { Work: '#6b8fb3', Home: '#7d9178', Kids: '#d39b6a', Booth: '#b07aa1', Band: '#d2b04c', Errands: '#8a8f86', ATU: '#6b8fb3' };
const colorOf = l => AREAS[l] || '#c9c3b3';
const REP = { '': 'Does not repeat', daily: 'Every day', weekdays: 'Every weekday', weekly: 'Every week', biweekly: 'Every 2 weeks', monthly: 'Every month' };
let SB, off = 0, tasks = [], rolled = false;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString(), today = () => isoDay(new Date());
const dt = d => new Date(d + 'T12:00'), add = (d, n) => { const x = dt(d); x.setDate(x.getDate() + n); return isoDay(x); };
const days = () => { if (ONE) return [today()]; const ws = weekStart(new Date()); ws.setDate(ws.getDate() + off * 7); return [...Array(7)].map((_, k) => { const d = new Date(ws); d.setDate(d.getDate() + k); return isoDay(d); }); };
// Does a repeating task land on day d (on or after its current date)?
function repeatsOn(t, d) {
  if (!t.repeat || d <= t.date) return false;
  const a = dt(t.date), b = dt(d), gap = Math.round((b - a) / 864e5);
  return t.repeat === 'daily' || (t.repeat === 'weekdays' && b.getDay() % 6 !== 0) || (t.repeat === 'weekly' && gap % 7 === 0) || (t.repeat === 'biweekly' && gap % 14 === 0) || (t.repeat === 'monthly' && a.getDate() === b.getDate());
}
function next(t) { for (let k = 1; k < 400; k++) { const d = add(t.date, k); if (repeatsOn(t, d)) return d; } return null; }
const ampm = s => { if (!s) return ''; const [h, m] = s.split(':').map(Number); return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm'); };
function row(t, d) {
  const ghost = t.date !== d;
  return '<div class="t' + (t.done && !ghost ? ' on' : '') + (ghost ? ' ghost' : '') + '" data-id="' + t.id + '"' + (ghost ? '' : ' draggable="true"') + ' style="border-left-color:' + colorOf(t.list) + '">' +
    '<span class="ck">' + (t.done && !ghost ? '✓' : '') + '</span><span class="tx">' + (t.start_time ? '<span class="tm">' + ampm(t.start_time) + '</span>' : '') + esc(t.title) + (t.repeat ? '<span class="rp" title="' + REP[t.repeat] + '">🔁</span>' : '') + '</span>' +
    (ghost ? '<span></span>' : '<button class="st' + (t.priority ? ' on' : '') + '" title="Top 3 for the day">' + (t.priority ? '★' : '☆') + '</button>') + '</div>';
}
const sortT = (a, b) => (a.date === b.date ? 0 : 0) || a.done - b.done || (b.priority || 0) - (a.priority || 0) || (a.start_time || '99').localeCompare(b.start_time || '99') || (a.sort || 0) - (b.sort || 0);
function onDay(d) { return tasks.filter(t => t.date === d || (!t.done || t.repeat) && repeatsOn(t, d)).sort(sortT); }
function draw() {
  if (document.querySelector('.sheet')) return;
  const ds = days(), tdy = today(), el = document.getElementById('body'); el.className = '';
  if (ONE) {
    const list = onDay(tdy), top = list.filter(t => t.priority && t.date === tdy).slice(0, 3), rest = list.filter(t => !top.includes(t));
    el.innerHTML = '<div class="one">' + (top.length ? '<div class="sec">⭐ Top 3</div>' + top.map(t => row(t, tdy)).join('') + (rest.length ? '<div class="sec" style="margin-top:8px">Also today</div>' : '') : '') +
      rest.map(t => row(t, tdy)).join('') + (list.length ? '' : '<p class="muted small">Nothing yet. Add one below — tap ☆ to make it a Top 3.</p>') +
      '<form class="add" data-d="' + tdy + '"><input placeholder="+ Add a to-do for today"></form></div>';
  } else {
    el.innerHTML = '<div class="wk">' + ds.map(d => '<div class="dy' + (d === tdy ? ' now' : d < tdy ? ' past' : '') + '" data-day="' + d + '"><div class="dh"><b>' + dt(d).toLocaleDateString('en-US', { weekday: 'long' }) + '</b><span>' + dt(d).getDate() + '</span></div>' +
      onDay(d).map(t => row(t, d)).join('') + '<form class="add" data-d="' + d + '"><input placeholder="+ Add a to-do"></form></div>').join('') + '</div>';
    document.getElementById('rng').textContent = dt(ds[0]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' + dt(ds[6]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
}
function foot() {
  document.getElementById('foot').innerHTML = (ONE ? '' : Object.entries(AREAS).filter(([k]) => k !== 'ATU').map(([k, c]) => '<span class="key"><i style="background:' + c + '"></i>' + k + '</span>').join('')) +
    '<span>Unfinished to-dos move to today. Tap one to set a time, repeat or area.</span>' +
    '<span>On your Google Calendar too · <a href="https://sescobar1.github.io/booth-tracker/planner/#feed" target="_blank">Calendar setup</a></span>';
}
async function save(t, fields) { Object.assign(t, fields); draw(); const { error } = await SB.from('planner_items').update({ ...fields, updated_at: now() }).eq('id', t.id); if (error) alert('Couldn\'t save: ' + error.message); }
async function load() {
  const ds = days(), from = ONE ? today() : ds[0];
  // Unfinished one-time to-dos from the last two months move to today (once per load).
  if (!rolled) {
    rolled = true;
    const { data: old } = await SB.from('planner_items').select('id,date,repeat').eq('kind', 'task').eq('done', false).lt('date', today()).gte('date', add(today(), -60)).not('id', 'like', 'gift-%');
    const once = (old || []).filter(o => !o.repeat);
    if (once.length) await SB.from('planner_items').update({ date: today(), updated_at: now() }).in('id', once.map(o => o.id));
    // A missed repeating to-do jumps to its next day from today on, keeping its schedule.
    for (const o of (old || []).filter(o => o.repeat)) {
      let d = today(); for (let k = 0; k < 400 && !repeatsOn(o, d); k++) d = add(d, 1);
      await SB.from('planner_items').update({ date: d, updated_at: now() }).eq('id', o.id);
    }
  }
  const [a, b] = await Promise.all([
    SB.from('planner_items').select('id,title,date,done,sort,priority,start_time,end_time,all_day,repeat,list').eq('kind', 'task').gte('date', from).lte('date', ds[ds.length - 1]),
    SB.from('planner_items').select('id,title,date,done,sort,priority,start_time,end_time,all_day,repeat,list').eq('kind', 'task').neq('repeat', '').lt('date', from)
  ]);
  if (a.error) throw a.error;
  const seen = new Set(); tasks = (a.data || []).concat(b.data || []).filter(t => !seen.has(t.id) && seen.add(t.id)); draw(); foot();
}
function edit(t) {
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = '<div class="pane"><label>To-do<input id="eT" value="' + esc(t.title) + '"></label><div class="g2"><label>Day<input id="eD" type="date" value="' + t.date + '"></label><label>Time (optional)<input id="eS" type="time" value="' + (t.start_time || '') + '"></label></div>' +
    '<div class="g2"><label>Repeats<select id="eR">' + Object.entries(REP).map(([k, v]) => '<option value="' + k + '"' + ((t.repeat || '') === k ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></label>' +
    '<label>Area<select id="eL"><option value="">—</option>' + Object.keys(AREAS).map(k => '<option' + (t.list === k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></label></div>' +
    '<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input id="eP" type="checkbox" style="width:auto;margin:0"' + (t.priority ? ' checked' : '') + '> ⭐ Top 3 for the day</label>' +
    '<div class="acts"><button class="ghost del" id="eX">Delete</button><span><button class="ghost" id="eC">Cancel</button> <button class="btn" id="eOK">Save</button></span></div></div>';
  document.body.appendChild(s);
  const close = () => { s.remove(); draw(); };
  s.onclick = e => { if (e.target === s) close(); };
  s.querySelector('#eC').onclick = close;
  s.querySelector('#eX').onclick = async () => { if (!confirm('Delete “' + t.title + '”' + (t.repeat ? ' (every time it repeats)' : '') + '?')) return; tasks = tasks.filter(x => x !== t); close(); await SB.from('planner_items').delete().eq('id', t.id); };
  s.querySelector('#eOK').onclick = async () => {
    const st = s.querySelector('#eS').value, f = { title: s.querySelector('#eT').value.trim() || t.title, date: s.querySelector('#eD').value || t.date, start_time: st, all_day: !st,
      end_time: st ? String(Math.min(23, +st.slice(0, 2) + 1)).padStart(2, '0') + st.slice(2) : '', repeat: s.querySelector('#eR').value, list: s.querySelector('#eL').value, priority: s.querySelector('#eP').checked ? 1 : 0 };
    s.remove(); await save(t, f);
  };
}
document.addEventListener('submit', async e => {
  e.preventDefault(); const inp = e.target.querySelector('input'), title = inp.value.trim(), date = e.target.dataset.d; if (!title) return;
  const t = { id: uid(), kind: 'task', title, date, done: false, all_day: true, list: 'Home', priority: 0, repeat: '', start_time: '', end_time: '', sort: Date.now() % 1e9, updated_at: now() };
  tasks.push(t); draw(); const again = document.querySelector('form[data-d="' + date + '"] input'); if (again) again.focus();
  const { error } = await SB.from('planner_items').insert(t); if (error) { tasks = tasks.filter(x => x !== t); draw(); alert('Couldn\'t save: ' + error.message); }
});
document.addEventListener('click', async e => {
  if (e.target.id === 'prev' || e.target.id === 'next') { off += e.target.id === 'next' ? 1 : -1; await load(); return; }
  const r = e.target.closest('.t'); if (!r || r.classList.contains('ghost')) return; const t = tasks.find(x => x.id === r.dataset.id); if (!t) return;
  if (e.target.closest('.st')) return save(t, { priority: t.priority ? 0 : 1 });
  if (e.target.closest('.ck')) {
    // A repeating to-do moves on to its next day instead of staying done.
    if (t.repeat && !t.done) { const n = next(t); if (n) return save(t, { date: n }); }
    return save(t, { done: !t.done });
  }
  if (e.target.closest('.tx')) edit(t);
});
// Drag a to-do to another day.
let dragId = null;
document.addEventListener('dragstart', e => { const r = e.target.closest('.t'); if (!r) return; dragId = r.dataset.id; r.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.drag,.over').forEach(x => x.classList.remove('drag', 'over')); });
document.addEventListener('dragover', e => { const d = e.target.closest('.dy'); if (!d || !dragId) return; e.preventDefault(); document.querySelectorAll('.over').forEach(x => x !== d && x.classList.remove('over')); d.classList.add('over'); });
document.addEventListener('drop', async e => { const d = e.target.closest('.dy'); if (!d || !dragId) return; e.preventDefault(); const t = tasks.find(x => x.id === dragId); dragId = null; if (t && t.date !== d.dataset.day) await save(t, { date: d.dataset.day }); });
if (ONE) { document.getElementById('h1').firstChild.textContent = 'Today '; document.getElementById('navs').innerHTML = '<span class="muted">' + new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) + '</span>'; }
hubData(async sb => { SB = sb; if (document.querySelector('.sheet') || (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.value)) return; await load(); }, 5);
</script></body></html>
