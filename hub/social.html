<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social media planner</title><link rel="stylesheet" href="style.css">
<style>
:root{--red:#b5483d;--red-l:#f7e3df;--grn:#4f6b4a;--gold:#c79a3b;--plaid:repeating-linear-gradient(90deg,#b5483d22 0 10px,transparent 10px 20px),repeating-linear-gradient(0deg,#4f6b4a1c 0 10px,transparent 10px 20px)}
.card{min-height:100vh;height:auto;max-width:1150px;margin:0 auto}
.hero{background:var(--plaid),#fffaf3;border:1px solid #ecdcc9;border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.hero h1{margin:0;font-size:24px}.hero p{font-size:13px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap}.stats span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 10px}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.tabs button{font-size:13.5px;border:1px solid var(--line);border-radius:16px;padding:6px 14px;background:#fff}.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow-x:auto}
.col{background:#f6f2ea;border-radius:12px;padding:8px;min-height:200px}.col h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:2px 4px 8px;display:flex;justify-content:space-between}
.col.over{outline:2px dashed var(--red)}
.v{background:#fff;border:1px solid var(--line);border-left:4px solid var(--bc,#ccc);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:14px}.v:hover{box-shadow:0 3px 10px #0001}
.v b{font-weight:500;display:block}.v small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}.v .hk{font-style:italic;color:#6a5a4c;font-size:12.5px;margin-top:3px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.tag{font-size:10.5px;border-radius:9px;padding:1px 7px;background:#f1ece2;color:#6a5a4c}.tag.due{background:#fde7d6;color:#9a4f1c}.tag.late{background:#f8d7d3;color:#9c2f25}
.nav{display:flex;gap:6px;margin-top:6px}.nav button{font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.qadd{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:12px}.qadd input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.qadd button{background:var(--red);color:#fff;border-radius:9px;font-size:14px;padding:0 16px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.idea{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.idea h4{font-size:15px;font-weight:500;margin:0;display:flex;justify-content:space-between;gap:8px}.fire{white-space:nowrap;font-size:13px}
.idea p{font-size:13px;line-height:1.45;margin:0;color:#3d4a3e}.idea .why{color:var(--muted);font-size:12.5px}.idea .hk{font-style:italic;color:#6a5a4c}
.idea .meta{font-size:11.5px;color:var(--muted)}.idea button{align-self:flex-start;margin-top:4px;font-size:13px;background:var(--red-l);color:var(--red);border-radius:8px;padding:5px 12px}.idea button.done{background:#e6efe1;color:var(--grn)}
.secth{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:baseline}.secth small{letter-spacing:0;text-transform:none;color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.filters button{font-size:12px;border:1px solid var(--line);border-radius:12px;padding:3px 10px;background:#fff}.filters button.on{background:#f1ece2;border-color:#d9c9b1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;min-height:110px;font-size:12.5px}.day.now{border-color:var(--red)}.day h5{font-size:11px;font-weight:500;color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}.day .v{padding:5px 7px;font-size:12.5px;margin-bottom:5px}
.sheet{position:fixed;inset:0;background:#26342866;display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:5;overflow:auto}
.pane{background:var(--card);border-radius:14px;padding:16px 18px;width:100%;max-width:560px;box-shadow:0 10px 30px #0003}
.pane h2{font-size:19px;font-weight:500;margin:0 0 6px}.pane label{display:block;font-size:12px;color:var(--muted);margin-top:9px}
.pane input,.pane select,.pane textarea{display:block;width:100%;font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:3px;color:var(--ink)}.pane textarea{font-size:13.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.plats{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.plats button{font-size:12.5px;border:1px solid var(--line);border-radius:12px;padding:3px 10px;background:#fff}.plats button.on{background:var(--red-l);border-color:var(--red);color:var(--red)}
.shots{margin-top:4px}.shot{display:grid;grid-template-columns:20px 1fr 20px;gap:6px;align-items:center;font-size:13.5px;padding:2px 0}.shot input[type=text]{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:3px 0;margin:0}.shot .rm{font-size:13px;color:var(--muted);padding:0}
.acts{display:flex;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap}.ghost{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 12px}.del{color:#a5543b}.btn{background:var(--red)}
.tip{font-size:12.5px;background:#fffaf0;border:1px dashed #e3d3b8;border-radius:10px;padding:8px 12px;color:#6a5a4c;margin:6px 0 12px}
.mini .card{min-height:0}.mini .hero,.mini .tabs{display:none}
@media(max-width:820px){.board{grid-template-columns:repeat(4,240px)}.week{grid-template-columns:1fr}.day{min-height:0}.g3{grid-template-columns:1fr 1fr}}
</style>
<script src="../config.js"></script><script src="../vendor/supabase.js"></script><script src="data.js?v=5"></script></head><body data-q style="--q:#7d9178"><div class="card">
<div class="hero"><div><h1>📱 Social media planner</h1><p>What to record, what’s trending, and what’s posted — ideas for your nursing-instructor content.</p></div><div class="stats" id="stats"></div></div>

</div><script>

const STAGES = [['idea', '💡 To record'], ['filmed', '🎬 Filmed'], ['edited', '✂️ Edited'], ['posted', '✅ Posted']];
const PLATS = ['TikTok', 'Reels', 'Facebook', 'Shorts', 'Stories'];
const BRANDS = { 'Plaid Paddling Mama': '#b5483d', 'Squishies': '#c97f9b', "Y'allternative": '#4f6b4a', 'Block City': '#6b8fb3', 'Thrifting': '#c79a3b', 'Cleaning': '#5b9aa0', 'Beauty': '#d07aa6', 'Nursing': '#4a7fb5', 'Teaching': '#7a6bb5', 'Food': '#d08a3e', 'Coffee': '#7b5a3c', 'Personal / family': '#8a8f86' };
const OLDB = { 'Thrift & resale': 'Thrifting' };
// Ideas are for her nursing-instructor content only (Nursing + Teaching). Trending now — week of Oct 29, 2026.

const TRENDS_SEED = { updated: '2026-10-29c', list: [
  { t: 'Day in the life: nursing professor (timestamps)', f: 5, until: 'Nov', brand: 'Nursing', how: 'Vlog-timestamp trend: 5:30 coffee → 7:00 sim lab → 12:00 lecture → 3:00 office hours → 6:00 band pickup. Swipe transitions, no talking.', hook: '5:30 AM — a day in the life of a nursing professor', why: 'Timestamp vlogs are trending right now, and nurses & students love seeing the teaching side.', sound: 'Pump It or original audio', shots: ['Coffee at 5:30', 'Badge & scrubs', 'Sim lab (no student faces)', 'Lecture hall', 'Office hours desk', 'Home on the couch'] },
  { t: 'My reaction when a student asks “is this on the test?”', f: 5, until: 'Nov', brand: 'Teaching', how: '“My reaction” trend: text sets up each question, you answer with only facial expressions, escalating over 3–4 rounds.', hook: 'My reaction when a student asks if it’s on the test…', why: 'Faces-only reactions are trending and every student and teacher relates.', sound: 'Original audio', shots: ['Text: “Is this on the test?”', 'Your face', 'Text: “Can we round up?”', 'Bigger reaction'] },
  { t: 'Nursing professor debunks a viral health myth', f: 5, until: 'ongoing', brand: 'Nursing', how: 'Green-screen or stitch a viral claim (mouth taping, “nature’s Ozempic,” garlic curing diabetes), then explain the real science in 30 seconds and name your source.', hook: 'As a nursing professor, I need you to stop doing this…', why: 'Nurses debunking health myths is one of the fastest-growing NurseTok formats, and a DNP professor is extra credible.', sound: 'Original audio (voiceover)', shots: ['Green screen of the claim', 'You reacting', 'Explain in 3 points', 'Source on screen'] },
  { t: 'Nursing school myths you should ghost', f: 4, until: 'Oct 31', brand: 'Nursing', how: 'Sheet-ghost costume holding one sign per myth (“You have to be a math genius,” “C’s get degrees”…) — 4–6 quick clips or a carousel.', hook: 'Nursing school myths you should definitely ghost 👻', why: 'The ghost-sign trend peaks this week; myth-busting from a real professor gets saved.', sound: 'Original audio', shots: ['Ghost + sign 1', 'Sign 2', 'Sign 3', 'Reveal: you with coffee'] },
  { t: 'Balance challenge: professor edition', f: 4, until: 'Nov', brand: 'Teaching', how: 'The viral wobbly balance pose — but holding a stethoscope, coffee, 60 care plans and a laptop.', hook: 'Balancing everything a nursing professor carries on a Monday', why: 'Nurses are riding this trend with work props; it’s silly and very shareable.', sound: '“High School” (Nicki Minaj) — check business access, or original audio', shots: ['Set up props', 'The wobble', 'Something falls', 'Laughing'] },
  { t: '“Wish I was there” — finals week countdown', f: 4, until: 'Dec 11', brand: 'Teaching', how: 'The Jet2 holiday daydream audio over clips of finals prep, then you on the beach in your head. Count down to the last day of the semester.', hook: 'Me 6 weeks before the end of the semester…', why: 'Nurses use this audio as their “send help” anthem; finals week makes it perfect for professors too.', sound: 'Jet2 Holiday audio — check business access', shots: ['Stack of exams', 'Staring at screen', 'Daydream beach clip', 'Calendar countdown'] },
  { t: 'Charting #facts — grading edition', f: 4, until: 'Nov', brand: 'Teaching', how: 'Show yourself at the keyboard grading, then reacting warmly to a sweet note a student left at the end of their care plan (blur names).', hook: 'When a student writes “thank you for believing in me” at the end of a care plan', why: 'The charting-facts trend is big on NurseTok; the teaching twist is heartwarming.', sound: 'Original audio from the trend', shots: ['Typing / grading', 'Reading the note', 'Your reaction'] },
  { t: 'GRWM for sim lab day: loading…', f: 4, until: 'Nov', brand: 'Nursing', how: '“Daily GRWM loading” trend: a % climbs with each cut — skincare 20%, makeup 50%, scrubs 80%, coffee & badge 100%.', hook: 'Sim lab day GRWM loading… 0%', why: 'GRWM loading is trending; “nursing professor” makes it stand out.', sound: 'Windows in Brazil (sped up) or original', shots: ['0% bare face', 'Skincare', 'Makeup', 'Scrubs', 'Badge + coffee 100%'] },
  { t: 'Take that chance: ER nurse → DNP professor', f: 4, until: 'Nov', brand: 'Nursing', how: 'Quick cuts of your journey (nursing school, ER, grad school, DNP graduation, first lecture) with words appearing on the beat.', hook: 'I almost didn’t apply to nursing school.', why: 'Journey edits are trending and inspire nursing students — great one to pin.', sound: '“What You Waiting For?” or original', shots: ['Old photos', 'ER days', 'Graduation', 'Lecture hall today'] },
  { t: 'Not all angels are in heaven…', f: 3, until: 'early Nov', brand: 'Teaching', how: 'Fill-in-the-blank trend: “…some are nursing professors answering emails at 11pm.”', hook: 'Not all angels are in heaven… some are grading care plans at 11 PM', why: 'Job fill-in trends get shared by people with the same job.', sound: 'Original audio', shots: ['You at the laptop late', 'Stack of care plans', 'Clock showing 11:02'] }
] };
// Nursing-instructor formats that work any week.
const EVERGREEN = [
  { t: 'NCLEX-style question of the day', f: 5, brand: 'Nursing', how: 'Show one NCLEX-style question on screen, pause 3 seconds, then the answer and why. Ask viewers to comment their answer first.', hook: 'Only 1 in 3 nursing students get this right…', why: 'Quiz videos get tons of comments, and students follow for daily practice.', shots: ['Question on screen', 'Timer pause', 'Answer + rationale'] },
  { t: 'What nursing students say vs. what they mean', f: 5, brand: 'Nursing', how: 'Text skits: “I studied all weekend” → you holding up one highlighted page. Keep it kind and funny.', hook: 'What nursing students say vs. what they actually mean', why: 'Relatable nursing-school humor is shared constantly.', shots: ['Say', 'Mean', 'Say', 'Mean'] },
  { t: 'Sim lab behind the scenes', f: 5, brand: 'Nursing', how: 'Show the mannequins, the control room, the moulage — no student faces.', hook: 'You won’t believe what’s inside a nursing sim lab', why: 'Behind-the-scenes curiosity + “creepy mannequin” appeal.', shots: ['Mannequin reveal', 'Control room', 'Moulage kit', 'Set-up time-lapse'] },
  { t: 'Moulage: making fake wounds for sim', f: 5, brand: 'Nursing', how: 'Time-lapse of you creating a realistic wound or burn with moulage makeup, then the reveal on the mannequin.', hook: 'This is fake. Here’s how we make it for nursing students.', why: 'Special-effects makeup is hugely watchable, and it shows how realistic nursing education is.', shots: ['Supplies', 'Building the wound', 'Close-up reveal', 'On the mannequin'] },
  { t: 'Nursing professor reacts to medical TV', f: 5, brand: 'Nursing', how: 'Green-screen a scene from a hospital show and rate how realistic it is (gloves, charting, CPR form).', hook: 'Nursing professor rates this TV hospital scene', why: 'Reaction + “what they got wrong” videos ride on shows people already love.', shots: ['Green screen clip', 'Pause & point', 'Score out of 10'] },
  { t: 'Med math in 30 seconds', f: 4, brand: 'Nursing', how: 'One dosage problem per video, solved fast on a whiteboard or paper.', hook: 'Can you solve this med math problem in 30 seconds?', why: 'Quiz-style; comments fill with answers.', shots: ['Problem', 'Pause', 'Solve', 'Answer'] },
  { t: 'Mnemonics that actually stick', f: 4, brand: 'Nursing', how: 'One mnemonic per video with a quick visual for each letter.', hook: 'The mnemonic I teach every semester', why: 'Saveable study content — students save it for exam week.', shots: ['Mnemonic on screen', 'Each letter explained', 'Recap'] },
  { t: 'First clinical bag: what to pack', f: 4, brand: 'Nursing', how: 'Lay out everything a first-semester student needs (penlight, stethoscope, pocket guide, snacks) with why.', hook: 'Your nursing professor packs your first clinical bag', why: 'Students search for this before every semester.', shots: ['Empty bag', 'Each item', 'Packed bag'] },
  { t: 'Skills check-off: what instructors look for', f: 4, brand: 'Teaching', how: 'Walk through a skill (hand hygiene, vitals, med pass) and point out the 3 things instructors watch for.', hook: 'What your instructor is REALLY watching during check-offs', why: 'Insider tips from the person grading are gold for students.', shots: ['Skill demo on mannequin', 'Point out each step', 'Common mistake'] },
  { t: 'Things I wish I knew before nursing school', f: 4, brand: 'Nursing', how: 'Talking to camera: 3–5 honest tips from a professor who was once a student.', hook: 'Things I wish someone told me before nursing school', why: 'Advice lists get saved and shared to pre-nursing students.', shots: ['Talking head', 'B-roll of campus'] },
  { t: 'What my students think I do vs. what I actually do', f: 4, brand: 'Teaching', how: 'Split: “sipping coffee reading papers” vs. reality (grading at the ball field, writing exams at midnight).', hook: 'What my students think I do all day', why: 'Expectation-vs-reality is a proven format.', shots: ['Expectation', 'Reality ×2–3'] },
  { t: 'Nursing school tip of the week', f: 4, brand: 'Nursing', how: 'One study or clinical tip, 20–30 seconds, talking to camera. Same day every week.', hook: 'Nursing professor tip: ___', why: 'A weekly series trains followers to come back.', shots: ['Talking head', 'B-roll of notes or sim lab'] },
  { t: 'Excuses I’ve heard (kindly)', f: 4, brand: 'Teaching', how: 'Funny, anonymous list of late-assignment excuses with your reactions. Never identify a student.', hook: 'Excuses I’ve heard as a nursing professor — part 1', why: 'Teacher-humor series perform well and get “part 2!” comments.', shots: ['Text excuse', 'Your reaction', 'Repeat'] },
  { t: 'Dear first-semester nursing student', f: 3, brand: 'Teaching', how: 'Short encouraging message for students who feel like quitting. Post during exam weeks.', hook: 'If you’re thinking about quitting nursing school, watch this', why: 'Emotional encouragement gets shared to friends who need it.', shots: ['Talking head', 'Soft b-roll'] },
  { t: 'Grade with me + coffee', f: 3, brand: 'Teaching', how: 'Cozy grading time-lapse: coffee, playlist, stack going down.', hook: 'Grade with me (and my third coffee)', why: 'Work-with-me videos get long watch time.', shots: ['Coffee', 'Stack', 'Time-lapse', 'Done!'] },
  { t: 'STTI / SNA event behind the scenes', f: 3, brand: 'Nursing', how: 'Set-up, decorations and the big moment of an induction or SNA event (with permission for any faces).', hook: 'Behind the scenes of a nursing honor society induction', why: 'Celebratory content — students and families share it.', shots: ['Set-up', 'Details', 'Ceremony moment', 'Group (with permission)'] }
];
let SB, S = { videos: [] }, TR = TRENDS_SEED, tab = 'board', fBrand = '', edit = null, dragId = null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6), T = () => isoDay(new Date());
const dt = d => new Date(d + 'T12:00'), fmt = d => dt(d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const fire = n => '🔥'.repeat(n) + '<span style="opacity:.25">' + '🔥'.repeat(5 - n) + '</span>';
const save = () => hubSet(SB, 'social', S).catch(e => alert('Couldn’t save: ' + e.message));
function card(v, mini) {
  const t = T(), due = v.date && v.stage !== 'posted' ? (v.date < t ? 'late' : v.date === t ? 'due' : '') : '';
  return '<div class="v" draggable="true" data-v="' + v.id + '" style="--bc:' + (BRANDS[v.brand] || '#ccc') + '"><b>' + esc(v.title) + '</b>' + (v.hook && !mini ? '<div class="hk">“' + esc(v.hook) + '”</div>' : '') +
    '<div class="tags">' + (v.date ? '<span class="tag ' + due + '">' + (v.stage === 'posted' ? 'posted ' : '📅 ') + fmt(v.date) + '</span>' : '') + (v.plats || []).map(p => '<span class="tag">' + p + '</span>').join('') +
    (v.shots && v.shots.length && v.stage === 'idea' ? '<span class="tag">' + v.shots.filter(s => s.done).length + '/' + v.shots.length + ' shots</span>' : '') + (v.views ? '<span class="tag">👀 ' + Number(v.views).toLocaleString() + '</span>' : '') + '</div>' +
    (mini ? '' : '<div class="nav">' + (v.stage !== 'idea' ? '<button data-mv="' + v.id + '" data-d="-1">‹</button>' : '') + (v.stage !== 'posted' ? '<button data-mv="' + v.id + '" data-d="1">' + STAGES[STAGES.findIndex(s => s[0] === v.stage) + 1][1].split(' ').slice(1).join(' ') + ' ›</button>' : '') + '</div>') + '</div>';
}
function ideaCard(x, trend) {
  const have = S.videos.some(v => v.title === x.t);
  return '<div class="idea"><h4><span>' + esc(x.t) + '</span><span class="fire" title="Viral potential: ' + x.f + ' of 5">' + fire(x.f) + '</span></h4>' +
    '<p>' + esc(x.how) + '</p><p class="hk">Hook: “' + esc(x.hook) + '”</p><p class="why">Why it could pop: ' + esc(x.why) + '</p>' +
    '<p class="meta">' + esc(x.brand) + (x.sound ? ' · 🎵 ' + esc(x.sound) : '') + (x.until ? ' · ⏳ ride it until ' + esc(x.until) : '') + '</p>' +
    '<button data-take="' + (trend ? 't' : 'e') + ':' + esc(x.t) + '" class="' + (have ? 'done' : '') + '">' + (have ? '✓ On my list' : '＋ Add to what to record') + '</button></div>';
}
function draw() {
  if (document.querySelector('.sheet')) return;
  const V = S.videos, t = T(), wk = isoDay(new Date(Date.now() - 6 * 864e5));
  document.getElementById('stats').innerHTML = '<span>💡 ' + V.filter(v => v.stage === 'idea').length + ' to record</span><span>✂️ ' + V.filter(v => v.stage === 'filmed' || v.stage === 'edited').length + ' in progress</span><span>✅ ' + V.filter(v => v.stage === 'posted' && v.date >= wk).length + ' posted this week</span>';
  document.getElementById('tabs').innerHTML = [['board', '🎬 My videos'], ['ideas', '🔥 Ideas & trends'], ['week', '📅 Posting week']].map(([k, l]) => '<button data-tab="' + k + '" class="' + (tab === k ? 'on' : '') + '">' + l + '</button>').join('');
  const el = document.getElementById('body'); el.className = '';
  const flt = '<div class="filters"><button data-fb="" class="' + (!fBrand ? 'on' : '') + '">All</button>' + Object.keys(BRANDS).map(b => '<button data-fb="' + esc(b) + '" class="' + (fBrand === b ? 'on' : '') + '" style="border-left:3px solid ' + BRANDS[b] + '">' + esc(b) + '</button>').join('') + '</div>';
  const IDEA_T = ['Nursing', 'Teaching'];
  if (tab === 'board') {
    const vs = V.filter(v => !fBrand || v.brand === fBrand);
    el.innerHTML = '<form class="qadd" id="qadd"><input id="qT" placeholder="Video idea… (e.g. flannel try-on at the booth)" autocomplete="off"><button>＋ Add</button></form>' + flt +
      (V.length ? '' : '<div class="tip">Start with the <b>🔥 Ideas & trends</b> tab — tap “＋ Add to what to record” on any idea and it lands here with a hook and shot list.</div>') +
      '<div class="board">' + STAGES.map(([k, l]) => { const l2 = vs.filter(v => v.stage === k).sort((a, b) => (k === 'posted' ? (b.date || '').localeCompare(a.date || '') : (a.date || '9').localeCompare(b.date || '9')));
        return '<div class="col" data-col="' + k + '"><h3><span>' + l + '</span><span>' + l2.length + '</span></h3>' + (k === 'posted' ? l2.slice(0, 15) : l2).map(v => card(v)).join('') + '</div>'; }).join('') + '</div>';
  } else if (tab === 'ideas') {
    const ok = x => !fBrand || x.brand === fBrand;
    const iflt = '<div class="filters"><button data-fb="" class="' + (!fBrand ? 'on' : '') + '">All</button>' + IDEA_T.map(b => '<button data-fb="' + b + '" class="' + (fBrand === b ? 'on' : '') + '" style="border-left:3px solid ' + BRANDS[b] + '">' + b + '</button>').join('') + '</div>';
    el.innerHTML = iflt + '<div class="tip">🩺 Ideas for your nursing-instructor content. Keep students’ faces, names and any patient details out of every video, and follow ATU’s social media policy. 🔥 = how likely I think it is to take off for you (5 is best). Trends move fast — ask Claude to <b>“refresh my social trends”</b> any time and this list gets updated. Business accounts: if a trending song isn’t available, use the same format with your own audio.</div>' +
      '<div class="secth"><span>⚡ Trending now</span><small>updated ' + fmt(TR.updated.slice(0, 10)) + '</small></div><div class="ideas">' + TR.list.filter(ok).sort((a, b) => b.f - a.f).map(x => ideaCard(x, 1)).join('') + '</div>' +
      '<div class="secth"><span>🌲 Always works</span></div><div class="ideas">' + EVERGREEN.filter(ok).sort((a, b) => b.f - a.f).map(x => ideaCard(x, 0)).join('') + '</div>';
  } else {
    const ws = weekStart(new Date()), days = [...Array(14)].map((_, i) => { const d = new Date(ws); d.setDate(d.getDate() + i); return isoDay(d); });
    const unsched = V.filter(v => v.stage !== 'posted' && !v.date);
    el.innerHTML = '<div class="tip">Drag a video onto a day to plan when it goes up. Aim for 3–4 posts a week; Tue–Thu evenings and Sunday afternoons are good times for local shoppers.</div>' +
      [0, 7].map(o => '<div class="secth"><span>' + (o ? 'Next week' : 'This week') + '</span></div><div class="week">' + days.slice(o, o + 7).map(d => '<div class="day' + (d === t ? ' now' : '') + '" data-day="' + d + '"><h5>' + fmt(d) + '</h5>' + V.filter(v => v.date === d).map(v => card(v, 1)).join('') + '</div>').join('') + '</div>').join('') +
      '<div class="secth"><span>Not scheduled yet</span><small>' + unsched.length + '</small></div><div class="ideas">' + unsched.map(v => card(v)).join('') + '</div>';
  }
}
function sheet(v) {
  edit = v;
  const sh = (v.shots || []).concat([{ s: '', done: false }]);
  document.body.insertAdjacentHTML('beforeend', '<div class="sheet"><form class="pane" id="vF"><h2>' + (v.title ? 'Edit video' : 'New video') + '</h2>' +
    '<label>Video<input id="fT" value="' + esc(v.title || '') + '" placeholder="Flannel before & after"></label>' +
    '<label>Hook (first 2 seconds — what you say or the text on screen)<input id="fH" value="' + esc(v.hook || '') + '" placeholder="These were headed to the rag bin…"></label>' +
    '<div class="g3"><label>Stage<select id="fS">' + STAGES.map(([k, l]) => '<option value="' + k + '"' + (v.stage === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>' +
    '<label>For<select id="fB">' + Object.keys(BRANDS).map(b => '<option' + (v.brand === b ? ' selected' : '') + '>' + esc(b) + '</option>').join('') + '</select></label>' +
    '<label>' + (v.stage === 'posted' ? 'Posted on' : 'Post on') + '<input id="fD" type="date" value="' + (v.date || '') + '"></label></div>' +
    '<label>Where<div class="plats">' + PLATS.map(p => '<button type="button" data-pl="' + p + '" class="' + ((v.plats || []).includes(p) ? 'on' : '') + '">' + p + '</button>').join('') + '</div></label>' +
    '<label>Shot list</label><div class="shots" id="shots">' + sh.map((s, i) => '<div class="shot"><input type="checkbox" data-sd="' + i + '"' + (s.done ? ' checked' : '') + '><input type="text" data-ss="' + i + '" value="' + esc(s.s) + '" placeholder="' + (i === sh.length - 1 ? 'add a shot…' : '') + '"><button type="button" class="rm" data-sr="' + i + '">✕</button></div>').join('') + '</div>' +
    '<div class="g2"><label>Sound / audio<input id="fA" value="' + esc(v.sound || '') + '" placeholder="original audio"></label><label>Caption & hashtags<input id="fC" value="' + esc(v.caption || '') + '" placeholder="#upcycledflannel #shoplocal"></label></div>' +
    '<label>Notes<textarea id="fN" rows="2">' + esc(v.notes || '') + '</textarea></label>' +
    '<div class="g2"><label>Link once posted<input id="fL" value="' + esc(v.link || '') + '" placeholder="https://…"></label><label>Views / likes (to see what works)<input id="fV" value="' + esc(v.views || '') + '" inputmode="numeric" placeholder="e.g. 4200"></label></div>' +
    '<div class="acts">' + (v.id ? '<button type="button" class="ghost del" id="fDel">Delete</button>' : '<span></span>') + '<span><button type="button" class="ghost" id="fX">Cancel</button> <button class="btn">Save</button></span></div></form></div>');
  document.getElementById('fT').focus();
}
function readSheet() {
  const shots = [...document.querySelectorAll('[data-ss]')].map(i => ({ s: i.value.trim(), done: document.querySelector('[data-sd="' + i.dataset.ss + '"]').checked })).filter(x => x.s);
  return { title: document.getElementById('fT').value.trim(), hook: document.getElementById('fH').value.trim(), stage: document.getElementById('fS').value, brand: document.getElementById('fB').value, date: document.getElementById('fD').value,
    plats: [...document.querySelectorAll('[data-pl].on')].map(b => b.dataset.pl), shots, sound: document.getElementById('fA').value.trim(), caption: document.getElementById('fC').value.trim(),
    notes: document.getElementById('fN').value.trim(), link: document.getElementById('fL').value.trim(), views: document.getElementById('fV').value.replace(/[^\d]/g, '') };
}
const close = () => { const s = document.querySelector('.sheet'); if (s) s.remove(); edit = null; draw(); };
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'qadd') { const i = document.getElementById('qT'), v = i.value.trim(); if (!v) return; S.videos.push({ id: uid(), title: v, stage: 'idea', brand: fBrand || 'Plaid Paddling Mama', plats: ['TikTok', 'Reels'], shots: [], added: T() }); i.value = ''; draw(); await save(); document.getElementById('qT').focus(); return; }
  if (e.target.id === 'vF') { const f = readSheet(); if (!f.title) return; if (f.stage === 'posted' && !f.date) f.date = T();
    if (edit.id) Object.assign(S.videos.find(x => x.id === edit.id), f); else S.videos.push({ id: uid(), added: T(), ...f }); close(); await save(); }
});
document.addEventListener('input', e => { const s = e.target.closest('[data-ss]'); if (s && e.target === [...document.querySelectorAll('[data-ss]')].pop() && s.value.trim()) { const i = document.querySelectorAll('[data-ss]').length; document.getElementById('shots').insertAdjacentHTML('beforeend', '<div class="shot"><input type="checkbox" data-sd="' + i + '"><input type="text" data-ss="' + i + '" placeholder="add a shot…"><button type="button" class="rm" data-sr="' + i + '">✕</button></div>'); } });
document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; draw(); return; }
  const fb = e.target.closest('[data-fb]'); if (fb) { fBrand = fb.dataset.fb; draw(); return; }
  const pl = e.target.closest('[data-pl]'); if (pl) { pl.classList.toggle('on'); return; }
  const sr = e.target.closest('[data-sr]'); if (sr) { sr.parentElement.remove(); return; }
  if (e.target.id === 'fX' || e.target.classList.contains('sheet')) return close();
  if (e.target.id === 'fDel') { if (!(await ask('Delete “' + edit.title + '”?'))) return; S.videos = S.videos.filter(x => x.id !== edit.id); close(); await save(); return; }
  const mv = e.target.closest('[data-mv]'); if (mv) { e.stopPropagation(); const v = S.videos.find(x => x.id === mv.dataset.mv), i = STAGES.findIndex(s => s[0] === v.stage) + Number(mv.dataset.d); v.stage = STAGES[i][0]; if (v.stage === 'posted' && (!v.date || v.date > T())) v.date = T(); draw(); await save(); return; }
  const tk = e.target.closest('[data-take]'); if (tk) { const [k, ...r] = tk.dataset.take.split(':'), name = r.join(':'), x = (k === 't' ? TR.list : EVERGREEN).find(y => y.t === name); if (!x || S.videos.some(v => v.title === x.t)) return;
    S.videos.push({ id: uid(), title: x.t, hook: x.hook, stage: 'idea', brand: x.brand, plats: ['TikTok', 'Reels'], shots: (x.shots || []).map(s => ({ s, done: false })), sound: x.sound || '', notes: x.how, added: T(), date: '' }); draw(); await save(); return; }
  const v = e.target.closest('[data-v]'); if (v) { sheet(S.videos.find(x => x.id === v.dataset.v)); return; }
});
// Drag cards between stages, or onto a day in the posting week.
document.addEventListener('dragstart', e => { const v = e.target.closest('[data-v]'); if (v) dragId = v.dataset.v; });
document.addEventListener('dragover', e => { const c = e.target.closest('[data-col],[data-day]'); if (c && dragId) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest('[data-col],[data-day]'); if (c) c.classList.remove('over'); });
document.addEventListener('drop', async e => { const c = e.target.closest('[data-col],[data-day]'); if (!c || !dragId) return; e.preventDefault(); const v = S.videos.find(x => x.id === dragId); dragId = null;
  if (c.dataset.col) { v.stage = c.dataset.col; if (v.stage === 'posted' && !v.date) v.date = T(); } else v.date = c.dataset.day; draw(); await save(); });
hubData(async sb => {
  SB = sb; if (document.querySelector('.sheet')) return;
  const [d, tr] = await Promise.all([hubGet(sb, 'social'), hubGet(sb, 'socialTrends').catch(() => ({}))]);
  S = d && d.videos ? d : { videos: [] }; S.videos.forEach(v => { if (OLDB[v.brand]) v.brand = OLDB[v.brand]; });
  TR = tr && tr.list && tr.updated >= TRENDS_SEED.updated ? tr : TRENDS_SEED; TR.list.forEach(x => { if (OLDB[x.brand]) x.brand = OLDB[x.brand]; });
  draw();
}, 10);
</script></body></html>
