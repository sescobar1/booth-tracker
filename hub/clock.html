<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clock</title><link rel="stylesheet" href="style.css">
<style>.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
#t{font-size:clamp(44px,18vw,76px);letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
#ap{font-size:.38em;color:var(--sage);margin-left:6px;letter-spacing:2px}
#s{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
#d{font-size:15px;color:var(--muted);margin-top:6px}
.bar{width:60%;height:3px;background:var(--sage-l);border-radius:2px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--sage)}</style></head><body><div class="card">
<div id="t"></div><div id="s"></div><div class="bar"><i id="b"></i></div><div id="d"></div></div><script>
function tick(){const n=new Date();let h=n.getHours(),ap=h<12?'AM':'PM';h=h%12||12;
document.getElementById('t').innerHTML=h+':'+String(n.getMinutes()).padStart(2,'0')+'<span id="ap">'+ap+'</span>';
document.getElementById('s').textContent=String(n.getSeconds()).padStart(2,'0')+' sec';
document.getElementById('b').style.width=(n.getSeconds()/59*100)+'%';
document.getElementById('d').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
tick();setInterval(tick,1000);
</script></body></html>
