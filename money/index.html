<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Money</title>
  <meta name="description" content="Check register, bank statement matching, and tax documents.">
  <meta name="theme-color" content="#1d5c46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Money">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="money.css">
</head>
<body>
  <header class="top no-print">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"> <span>Money</span></div>
    <button type="button" class="ghost small" id="topAdd">＋ Add</button>
  </header>

  <main id="view"></main>

  <button type="button" class="fab no-print" id="fab" aria-label="Add">＋</button>

  <nav class="tabs no-print">
    <a href="#register" data-tab="register"><span>📒</span>Register</a>
    <a href="#bank" data-tab="bank"><span>🏦</span>Bank</a>
    <a href="#taxes" data-tab="taxes"><span>🧾</span>Taxes</a>
    <a href="#more" data-tab="more"><span>⚙</span>More</a>
  </nav>

  <div id="modal" class="modal no-print" hidden><div class="sheet" id="modalBody"></div></div>
  <div id="toast" class="toast no-print" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="db.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
