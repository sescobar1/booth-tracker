<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cecilia's Work Clock</title>
  <meta name="theme-color" content="#7a3e8e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clock In">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="clock.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top"><div class="brand"><img src="icon.svg" alt="" width="28" height="28"> Clock In</div></header>
  <main id="view"><div class="card clock"><p class="muted">Loading…</p></div></main>
  <div id="toast" class="toast" hidden></div>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
  (function () {
    const { $, esc, money, hrs, timer, register, totals, registerTable, totalsHtml, toast, tm } = WORK, CFG = window.WORK_CONFIG;
    // The link carries her token; remember it so the home-screen icon works even without it.
    let token = new URLSearchParams(location.search).get('t') || '';
    try { if (token) localStorage.setItem('workToken', token); else token = localStorage.getItem('workToken') || ''; } catch (e) {}
    let info = null, tick = null, busy = false;

    const rpc = (fn, body) => fetch(CFG.sync.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: CFG.sync.key, Authorization: 'Bearer ' + CFG.sync.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(async r => { const j = await r.json().catch(() => null); if (!r.ok) throw new Error((j && j.message) || 'error'); return j; });

    function draw() {
      clearInterval(tick);
      if (!info) { $('view').innerHTML = '<div class="card clock"><p class="hi">Hi!</p><p>This page needs the link Mom sent you. Ask her to share it again. 💜</p></div>'; return; }
      const name = CFG.kidName, open = info.open, lines = register(info.shifts, info.register, info.balance), t = totals(lines);
      // The server's numbers are the full history; the register below shows the latest lines.
      t.earned = Number(info.earned) + Number(info.bonus); t.spent = Number(info.spent); t.balance = Number(info.balance);
      const skew = new Date(info.now) - Date.now(); // use the server's clock so the timer matches the pay
      $('view').innerHTML =
        '<div class="card clock">' +
          '<p class="hi">Hi ' + esc(name) + '!</p>' +
          (open
            ? '<p class="state"><span class="dot"></span>Clocked in since <b>' + tm(open.clock_in) + '</b></p><div class="timer" id="tm"></div><div class="pay" id="earn"></div><button class="big out" id="go">Clock out</button>'
            : '<p class="state muted">You’re clocked out.</p><div class="pay">$' + Number(CFG.rate).toFixed(2) + ' an hour</div><button class="big in" id="go">Clock in</button>') +
        '</div>' +
        totalsHtml(t) +
        '<h2>My pay register <small>what I earned and spent</small></h2>' +
        '<div class="card" style="padding:8px 10px">' + registerTable(lines, false) + '</div>' +
        '<p class="muted small" style="text-align:center">Mom adds what you spend. Ask her if something looks wrong.</p>';
      if (open) {
        const upd = () => { const ms = Date.now() + skew - new Date(open.clock_in); $('tm').textContent = timer(ms); $('earn').textContent = '+' + money(ms / 3600000 * open.rate) + ' so far'; };
        upd(); tick = setInterval(upd, 1000);
      }
      $('go').onclick = async () => {
        if (busy) return; busy = true; $('go').disabled = true;
        try {
          const before = info.open;
          info = await rpc('work_clock', { p_token: token, p_action: open ? 'out' : 'in' });
          if (before) { const s = info.shifts.find(x => x.id === before.id); toast(s ? '✓ Clocked out · ' + hrs(new Date(s.clock_out) - new Date(s.clock_in)) + ' · +' + money(WORK.shiftPay(s)) : '✓ Clocked out'); }
          else toast('✓ Clocked in. Have a good shift!');
        } catch (e) { toast('Couldn’t reach the internet. Try again.'); }
        busy = false; draw();
      };
    }
    async function load() {
      if (!token) { info = null; draw(); return; }
      try { info = await rpc('work_info', { p_token: token }); }
      catch (e) { if (/bad link/.test(e.message)) info = null; else { $('view').innerHTML = '<div class="card clock"><p>No internet right now. <button class="ghost sm" onclick="location.reload()">Try again</button></p></div>'; return; } }
      draw();
    }
    // Refresh when she comes back to the page (Mom may have added something).
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy) load(); });
    load();
  })();
  </script>
</body>
</html>
